[package]
name = "anvil-sys"
# Kept equal to version.txt by release-please (release-please-config.json).
version = "1.3.0"
description = "Raw bindings to the Anvil plugin API 2 (anvil_plugin.h), the C ABI of the Anvil plugin loader for Europa Universalis IV"
readme = "README.md"
keywords = ["anvil", "eu4", "plugin", "ffi", "bindings"]
categories = ["external-ffi-bindings", "no-std"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
include = ["src/**/*.rs", "Cargo.toml", "README.md"]

[lib]
# bindings.rs is generated from the header; its comments are not doc tests.
doctest = false

[package.metadata.docs.rs]
targets = ["x86_64-pc-windows-msvc"]
