# anvil-overlay's texts in German (design §5.4), looked up by their English
# words in plugin.toml and settings.toml. Machine-drafted by the agent; a native speaker has not checked it yet.
status = "draft"

[text]
"Standard plugin: in-game notifications about skipped plugins, the previous crash, safe mode, ironman, multiplayer and, opt-in, a newer Anvil release, a badge with Anvil's version in the main menu, and a panel (Ctrl+Shift+F12 or a click on the badge) with the status, the crash report, the log and every plugin's settings." = "Standard-Plugin: Hinweise im Spiel zu übersprungenen Plugins, dem letzten Absturz, dem abgesicherten Modus, Ironman, Mehrspieler und, auf Wunsch, einer neueren Anvil-Version, ein Abzeichen mit Anvils Version im Hauptmenü und ein Panel (Strg+Umschalt+F12 oder ein Klick auf das Abzeichen) mit dem Status, dem Absturzbericht, dem Log und den Einstellungen jedes Plugins."
"Panel key" = "Panel-Taste"
"Opens and closes the Anvil panel." = "Öffnet und schließt das Anvil-Panel."
"Show notifications" = "Hinweise anzeigen"
"Notices about skipped plugins, the previous crash and safe mode when the game is ready. The ironman notice is always shown; the multiplayer notice too, until you close it." = "Hinweise zu übersprungenen Plugins, dem letzten Absturz und dem abgesicherten Modus, wenn das Spiel bereit ist. Der Ironman-Hinweis wird immer angezeigt; der Mehrspieler-Hinweis auch, bis du ihn schließt."
"Notification time (s)" = "Anzeigedauer der Hinweise (s)"
"How long a notification stays; 0 keeps it until it is closed." = "Wie lange ein Hinweis bleibt; 0 lässt ihn stehen, bis er geschlossen wird."
"Scale" = "Skalierung"
"The size of the panel and the notifications." = "Die Größe des Panels und der Hinweise."
"Show Anvil in the main menu" = "Anvil im Hauptmenü anzeigen"
"A small badge with Anvil's version on the left edge of the game's main menu; a click opens the panel. Never shown in a game." = "Ein kleines Abzeichen mit Anvils Version am linken Rand des Hauptmenüs; ein Klick öffnet das Panel. Im Spiel nie angezeigt."
"Like the game" = "Wie das Spiel"
"English" = "Englisch"
"French" = "Französisch"
"German" = "Deutsch"
"Spanish" = "Spanisch"
"Chinese (Simplified)" = "Chinesisch (vereinfacht)"
"Chinese (Traditional)" = "Chinesisch (traditionell)"
"Japanese" = "Japanisch"
"Korean" = "Koreanisch"
"Polish" = "Polnisch"
"Language" = "Sprache"
"The language of the panel and the notices. Like the game: EU4's language, or with Mei the Chinese, Japanese or Korean of Steam or Windows, or Polish when Steam is in Polish. The Manager follows it too." = "Die Sprache des Panels und der Hinweise. Wie das Spiel: die Sprache von EU4, mit Mei das Chinesisch, Japanisch oder Koreanisch von Steam oder Windows, oder Polnisch, wenn Steam auf Polnisch ist. Der Manager folgt ihr auch."
"Ask (or follow Anvil Manager)" = "Fragen (oder Anvil Manager folgen)"
"On" = "An"
"Off" = "Aus"
"Check for new Anvil releases" = "Nach neuen Anvil-Versionen suchen"
"When the game is ready, ask GitHub (api.github.com) once for Anvil's latest release and, when it is newer, show a notice with a link to its page. Nothing is downloaded. Ask: follow your answer in Anvil Manager, or ask once in the game. A Manager that never asked follows On or Off here, and then also reads the list of the team's plugins at its start to show their updates." = "Wenn das Spiel bereit ist, einmal GitHub (api.github.com) nach Anvils neuester Version fragen und, wenn sie neuer ist, einen Hinweis mit einem Link zu ihrer Seite zeigen. Nichts wird heruntergeladen. Fragen: deiner Antwort in Anvil Manager folgen oder einmal im Spiel fragen. Ein Manager, der nie gefragt hat, folgt hier An oder Aus und liest dann bei seinem Start auch die Liste der Plugins des Teams, um ihre Updates zu zeigen."
