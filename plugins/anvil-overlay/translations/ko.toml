# anvil-overlay's texts in Korean (design §5.4), looked up by their English
# words in plugin.toml and settings.toml. Machine-drafted by the agent; a native speaker has not checked it yet.
status = "draft"

[text]
"Standard plugin: in-game notifications about skipped plugins, the previous crash, safe mode, ironman, multiplayer and, opt-in, a newer Anvil release, a badge with Anvil's version in the main menu, and a panel (Ctrl+Shift+F12 or a click on the badge) with the status, the crash report, the log and every plugin's settings." = "표준 플러그인: 건너뛴 플러그인, 이전 충돌, 안전 모드, 아이언맨, 멀티플레이, 그리고 원하면 Anvil 새 릴리스에 대한 게임 내 알림, 메인 메뉴의 Anvil 버전 배지, 그리고 상태·충돌 보고서·로그·각 플러그인의 설정이 있는 패널(Ctrl+Shift+F12 또는 배지 클릭)."
"Panel key" = "패널 키"
"Opens and closes the Anvil panel." = "Anvil 패널을 열고 닫습니다."
"Show notifications" = "알림 표시"
"Notices about skipped plugins, the previous crash and safe mode when the game is ready. The ironman notice is always shown; the multiplayer notice too, until you close it." = "게임이 준비되었을 때 건너뛴 플러그인, 이전 충돌, 안전 모드에 대한 알림. 아이언맨 알림은 항상 표시되고, 멀티플레이 알림도 닫을 때까지 표시됩니다."
"Notification time (s)" = "알림 표시 시간(초)"
"How long a notification stays; 0 keeps it until it is closed." = "알림이 머무는 시간. 0이면 닫을 때까지 유지합니다."
"Scale" = "크기 비율"
"The size of the panel and the notifications." = "패널과 알림의 크기."
"Show Anvil in the main menu" = "메인 메뉴에 Anvil 표시"
"A small badge with Anvil's version on the left edge of the game's main menu; a click opens the panel. Never shown in a game." = "게임 메인 메뉴의 왼쪽 가장자리에 Anvil 버전이 적힌 작은 배지를 표시하며, 클릭하면 패널이 열립니다. 게임 중에는 표시하지 않습니다."
"Like the game" = "게임과 같게"
"English" = "영어"
"French" = "프랑스어"
"German" = "독일어"
"Spanish" = "스페인어"
"Chinese (Simplified)" = "중국어(간체)"
"Chinese (Traditional)" = "중국어(번체)"
"Japanese" = "일본어"
"Korean" = "한국어"
"Polish" = "폴란드어"
"Language" = "언어"
"The language of the panel and the notices. Like the game: EU4's language, or with Mei the Chinese, Japanese or Korean of Steam or Windows, or Polish when Steam is in Polish. The Manager follows it too." = "패널과 알림의 언어. 게임과 같게: EU4의 언어, Mei가 있으면 Steam 또는 Windows의 중국어·일본어·한국어, Steam이 폴란드어이면 폴란드어. Manager도 이를 따릅니다."
"Ask (or follow Anvil Manager)" = "묻기(또는 Anvil Manager 따르기)"
"On" = "켜기"
"Off" = "끄기"
"Check for new Anvil releases" = "Anvil 새 릴리스 확인"
"When the game is ready, ask GitHub (api.github.com) once for Anvil's latest release and, when it is newer, show a notice with a link to its page. Nothing is downloaded. Ask: follow your answer in Anvil Manager, or ask once in the game. A Manager that never asked follows On or Off here, and then also reads the list of the team's plugins at its start to show their updates." = "게임이 준비되면 GitHub(api.github.com)에 Anvil의 최신 릴리스를 한 번 묻고, 더 새로우면 그 페이지 링크가 있는 알림을 표시합니다. 아무것도 다운로드하지 않습니다. 묻기: Anvil Manager에서 한 답을 따르거나 게임에서 한 번 묻습니다. 한 번도 묻지 않은 Manager는 여기의 켜기 또는 끄기를 따르며, 그때는 시작할 때 팀의 플러그인 목록도 읽어 업데이트를 표시합니다."
