# anvil-overlay's texts in Japanese (design §5.4), looked up by their English
# words in plugin.toml and settings.toml. Machine-drafted by the agent; a native speaker has not checked it yet.
status = "draft"

[text]
"Standard plugin: in-game notifications about skipped plugins, the previous crash, safe mode, ironman, multiplayer and, opt-in, a newer Anvil release, a badge with Anvil's version in the main menu, and a panel (Ctrl+Shift+F12 or a click on the badge) with the status, the crash report, the log and every plugin's settings." = "標準プラグイン：スキップされたプラグイン、前回のクラッシュ、セーフモード、アイアンマン、マルチプレイ、そして希望すれば Anvil の新しいリリースについてのゲーム内通知、メインメニューに Anvil のバージョンを示すバッジ、そして状態・クラッシュレポート・ログ・各プラグインの設定を表示するパネル（Ctrl+Shift+F12 またはバッジをクリック）。"
"Panel key" = "パネルのキー"
"Opens and closes the Anvil panel." = "Anvil パネルを開閉します。"
"Show notifications" = "通知を表示"
"Notices about skipped plugins, the previous crash and safe mode when the game is ready. The ironman notice is always shown; the multiplayer notice too, until you close it." = "ゲームの準備ができたときの、スキップされたプラグイン、前回のクラッシュ、セーフモードについての通知。アイアンマンの通知は常に表示され、マルチプレイの通知も閉じるまで表示されます。"
"Notification time (s)" = "通知の表示時間（秒）"
"How long a notification stays; 0 keeps it until it is closed." = "通知が表示される時間。0 にすると閉じるまで表示します。"
"Scale" = "拡大率"
"The size of the panel and the notifications." = "パネルと通知の大きさ。"
"Show Anvil in the main menu" = "メインメニューに Anvil を表示"
"A small badge with Anvil's version on the left edge of the game's main menu; a click opens the panel. Never shown in a game." = "ゲームのメインメニューの左端に Anvil のバージョンを示す小さなバッジを表示し、クリックでパネルを開きます。ゲーム中は表示しません。"
"Like the game" = "ゲームと同じ"
"English" = "英語"
"French" = "フランス語"
"German" = "ドイツ語"
"Spanish" = "スペイン語"
"Chinese (Simplified)" = "中国語（簡体字）"
"Chinese (Traditional)" = "中国語（繁体字）"
"Japanese" = "日本語"
"Korean" = "韓国語"
"Polish" = "ポーランド語"
"Language" = "言語"
"The language of the panel and the notices. Like the game: EU4's language, or with Mei the Chinese, Japanese or Korean of Steam or Windows, or Polish when Steam is in Polish. The Manager follows it too." = "パネルと通知の言語。ゲームと同じ：EU4 の言語、Mei があれば Steam または Windows の中国語・日本語・韓国語、Steam がポーランド語ならポーランド語。Manager もこれに従います。"
"Ask (or follow Anvil Manager)" = "確認する（または Anvil Manager に従う）"
"On" = "オン"
"Off" = "オフ"
"Check for new Anvil releases" = "Anvil の新しいリリースを確認"
"When the game is ready, ask GitHub (api.github.com) once for Anvil's latest release and, when it is newer, show a notice with a link to its page. Nothing is downloaded. Ask: follow your answer in Anvil Manager, or ask once in the game. A Manager that never asked follows On or Off here, and then also reads the list of the team's plugins at its start to show their updates." = "ゲームの準備ができたら GitHub（api.github.com）に Anvil の最新リリースを一度問い合わせ、新しければそのページへのリンク付きの通知を表示します。何もダウンロードしません。確認する：Anvil Manager での回答に従うか、ゲーム内で一度確認します。一度も確認していない Manager はここのオンまたはオフに従い、その場合は起動時にチームのプラグイン一覧も読み込んで更新を表示します。"
