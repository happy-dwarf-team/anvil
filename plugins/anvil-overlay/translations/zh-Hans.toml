# anvil-overlay's texts in Simplified Chinese (design §5.4), looked up by their English
# words in plugin.toml and settings.toml. Machine-drafted by the agent; a native speaker has not checked it yet.
status = "draft"

[text]
"Standard plugin: in-game notifications about skipped plugins, the previous crash, safe mode, ironman, multiplayer and, opt-in, a newer Anvil release, a badge with Anvil's version in the main menu, and a panel (Ctrl+Shift+F12 or a click on the badge) with the status, the crash report, the log and every plugin's settings." = "标准插件：游戏内关于被跳过的插件、上次崩溃、安全模式、铁人、多人模式以及（可选）Anvil 新版本的通知，主菜单中显示 Anvil 版本的徽标，以及一个面板（Ctrl+Shift+F12 或点击徽标），其中有状态、崩溃报告、日志和每个插件的设置。"
"Panel key" = "面板快捷键"
"Opens and closes the Anvil panel." = "打开和关闭 Anvil 面板。"
"Show notifications" = "显示通知"
"Notices about skipped plugins, the previous crash and safe mode when the game is ready. The ironman notice is always shown; the multiplayer notice too, until you close it." = "游戏就绪时关于被跳过的插件、上次崩溃和安全模式的通知。铁人通知始终显示；多人模式通知也会显示，直到你关闭它。"
"Notification time (s)" = "通知显示时间（秒）"
"How long a notification stays; 0 keeps it until it is closed." = "通知停留多长时间；0 表示一直显示到被关闭。"
"Scale" = "缩放"
"The size of the panel and the notifications." = "面板和通知的大小。"
"Show Anvil in the main menu" = "在主菜单中显示 Anvil"
"A small badge with Anvil's version on the left edge of the game's main menu; a click opens the panel. Never shown in a game." = "游戏主菜单左边缘显示 Anvil 版本的小徽标；点击即可打开面板。游戏中从不显示。"
"Like the game" = "跟随游戏"
"English" = "英语"
"French" = "法语"
"German" = "德语"
"Spanish" = "西班牙语"
"Chinese (Simplified)" = "简体中文"
"Chinese (Traditional)" = "繁体中文"
"Japanese" = "日语"
"Korean" = "韩语"
"Polish" = "波兰语"
"Language" = "语言"
"The language of the panel and the notices. Like the game: EU4's language, or with Mei the Chinese, Japanese or Korean of Steam or Windows, or Polish when Steam is in Polish. The Manager follows it too." = "面板和通知的语言。跟随游戏：EU4 的语言；使用 Mei 时为 Steam 或 Windows 的中文、日语或韩语；Steam 为波兰语时为波兰语。Manager 也会跟随此设置。"
"Ask (or follow Anvil Manager)" = "询问（或跟随 Anvil Manager）"
"On" = "开"
"Off" = "关"
"Check for new Anvil releases" = "检查 Anvil 的新版本"
"When the game is ready, ask GitHub (api.github.com) once for Anvil's latest release and, when it is newer, show a notice with a link to its page. Nothing is downloaded. Ask: follow your answer in Anvil Manager, or ask once in the game. A Manager that never asked follows On or Off here, and then also reads the list of the team's plugins at its start to show their updates." = "游戏就绪时向 GitHub（api.github.com）查询一次 Anvil 的最新版本，如果更新，则显示带有其页面链接的通知。不会下载任何内容。询问：跟随你在 Anvil Manager 中的回答，或在游戏中询问一次。从未询问过的 Manager 会跟随这里的开或关，并且在启动时还会读取团队插件列表以显示它们的更新。"
