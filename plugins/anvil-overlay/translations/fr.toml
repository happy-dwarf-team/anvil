# anvil-overlay's texts in French (design §5.4), looked up by their English
# words in plugin.toml and settings.toml. Machine-drafted by the agent; a native speaker has not checked it yet.
status = "draft"

[text]
"Standard plugin: in-game notifications about skipped plugins, the previous crash, safe mode, ironman, multiplayer and, opt-in, a newer Anvil release, a badge with Anvil's version in the main menu, and a panel (Ctrl+Shift+F12 or a click on the badge) with the status, the crash report, the log and every plugin's settings." = "Plugin standard : des notifications en jeu sur les plugins ignorés, le plantage précédent, le mode sans échec, l'ironman, le multijoueur et, sur demande, une version plus récente d'Anvil, un badge avec la version d'Anvil dans le menu principal, et un panneau (Ctrl+Shift+F12 ou un clic sur le badge) avec l'état, le rapport de plantage, le journal et les paramètres de chaque plugin."
"Panel key" = "Touche du panneau"
"Opens and closes the Anvil panel." = "Ouvre et ferme le panneau d'Anvil."
"Show notifications" = "Afficher les notifications"
"Notices about skipped plugins, the previous crash and safe mode when the game is ready. The ironman notice is always shown; the multiplayer notice too, until you close it." = "Des avis sur les plugins ignorés, le plantage précédent et le mode sans échec quand le jeu est prêt. L'avis ironman s'affiche toujours ; l'avis multijoueur aussi, jusqu'à ce que vous le fermiez."
"Notification time (s)" = "Durée des notifications (s)"
"How long a notification stays; 0 keeps it until it is closed." = "Combien de temps une notification reste affichée ; 0 la garde jusqu'à sa fermeture."
"Scale" = "Échelle"
"The size of the panel and the notifications." = "La taille du panneau et des notifications."
"Show Anvil in the main menu" = "Afficher Anvil dans le menu principal"
"A small badge with Anvil's version on the left edge of the game's main menu; a click opens the panel. Never shown in a game." = "Un petit badge avec la version d'Anvil sur le bord gauche du menu principal du jeu ; un clic ouvre le panneau. Jamais affiché en partie."
"Like the game" = "Comme le jeu"
"English" = "Anglais"
"French" = "Français"
"German" = "Allemand"
"Spanish" = "Espagnol"
"Chinese (Simplified)" = "Chinois (simplifié)"
"Chinese (Traditional)" = "Chinois (traditionnel)"
"Japanese" = "Japonais"
"Korean" = "Coréen"
"Polish" = "Polonais"
"Language" = "Langue"
"The language of the panel and the notices. Like the game: EU4's language, or with Mei the Chinese, Japanese or Korean of Steam or Windows, or Polish when Steam is in Polish. The Manager follows it too." = "La langue du panneau et des avis. Comme le jeu : la langue d'EU4, ou avec Mei le chinois, le japonais ou le coréen de Steam ou de Windows, ou le polonais quand Steam est en polonais. Le Manager la suit aussi."
"Ask (or follow Anvil Manager)" = "Demander (ou suivre Anvil Manager)"
"On" = "Activé"
"Off" = "Désactivé"
"Check for new Anvil releases" = "Vérifier les nouvelles versions d'Anvil"
"When the game is ready, ask GitHub (api.github.com) once for Anvil's latest release and, when it is newer, show a notice with a link to its page. Nothing is downloaded. Ask: follow your answer in Anvil Manager, or ask once in the game. A Manager that never asked follows On or Off here, and then also reads the list of the team's plugins at its start to show their updates." = "Quand le jeu est prêt, demande une fois à GitHub (api.github.com) la dernière version d'Anvil et, si elle est plus récente, affiche un avis avec un lien vers sa page. Rien n'est téléchargé. Demander : suivre votre réponse dans Anvil Manager, ou demander une fois en jeu. Un Manager qui n'a jamais demandé suit Activé ou Désactivé ici, et lit alors aussi à son démarrage la liste des plugins de l'équipe pour afficher leurs mises à jour."
