# anvil-overlay's texts in Spanish (design §5.4), looked up by their English
# words in plugin.toml and settings.toml. Machine-drafted by the agent; a native speaker has not checked it yet.
status = "draft"

[text]
"Standard plugin: in-game notifications about skipped plugins, the previous crash, safe mode, ironman, multiplayer and, opt-in, a newer Anvil release, a badge with Anvil's version in the main menu, and a panel (Ctrl+Shift+F12 or a click on the badge) with the status, the crash report, the log and every plugin's settings." = "Plugin estándar: avisos en el juego sobre plugins omitidos, el fallo anterior, el modo seguro, ironman, multijugador y, si lo activas, una versión más reciente de Anvil, una insignia con la versión de Anvil en el menú principal y un panel (Ctrl+Shift+F12 o un clic en la insignia) con el estado, el informe de fallo, el registro y los ajustes de cada plugin."
"Panel key" = "Tecla del panel"
"Opens and closes the Anvil panel." = "Abre y cierra el panel de Anvil."
"Show notifications" = "Mostrar avisos"
"Notices about skipped plugins, the previous crash and safe mode when the game is ready. The ironman notice is always shown; the multiplayer notice too, until you close it." = "Avisos sobre plugins omitidos, el fallo anterior y el modo seguro cuando el juego está listo. El aviso de ironman se muestra siempre; el de multijugador también, hasta que lo cierres."
"Notification time (s)" = "Duración de los avisos (s)"
"How long a notification stays; 0 keeps it until it is closed." = "Cuánto tiempo se queda un aviso; 0 lo mantiene hasta que se cierre."
"Scale" = "Escala"
"The size of the panel and the notifications." = "El tamaño del panel y de los avisos."
"Show Anvil in the main menu" = "Mostrar Anvil en el menú principal"
"A small badge with Anvil's version on the left edge of the game's main menu; a click opens the panel. Never shown in a game." = "Una pequeña insignia con la versión de Anvil en el borde izquierdo del menú principal del juego; un clic abre el panel. Nunca se muestra en una partida."
"Like the game" = "Como el juego"
"English" = "Inglés"
"French" = "Francés"
"German" = "Alemán"
"Spanish" = "Español"
"Chinese (Simplified)" = "Chino (simplificado)"
"Chinese (Traditional)" = "Chino (tradicional)"
"Japanese" = "Japonés"
"Korean" = "Coreano"
"Polish" = "Polaco"
"Language" = "Idioma"
"The language of the panel and the notices. Like the game: EU4's language, or with Mei the Chinese, Japanese or Korean of Steam or Windows, or Polish when Steam is in Polish. The Manager follows it too." = "El idioma del panel y de los avisos. Como el juego: el idioma de EU4, o con Mei el chino, japonés o coreano de Steam o Windows, o el polaco cuando Steam está en polaco. El Manager también lo sigue."
"Ask (or follow Anvil Manager)" = "Preguntar (o seguir a Anvil Manager)"
"On" = "Activado"
"Off" = "Desactivado"
"Check for new Anvil releases" = "Buscar nuevas versiones de Anvil"
"When the game is ready, ask GitHub (api.github.com) once for Anvil's latest release and, when it is newer, show a notice with a link to its page. Nothing is downloaded. Ask: follow your answer in Anvil Manager, or ask once in the game. A Manager that never asked follows On or Off here, and then also reads the list of the team's plugins at its start to show their updates." = "Cuando el juego está listo, pregunta una vez a GitHub (api.github.com) por la última versión de Anvil y, si es más reciente, muestra un aviso con un enlace a su página. No se descarga nada. Preguntar: seguir tu respuesta en Anvil Manager, o preguntar una vez en el juego. Un Manager que nunca preguntó sigue aquí Activado o Desactivado, y entonces también lee al iniciarse la lista de plugins del equipo para mostrar sus actualizaciones."
