# anvil-overlay's texts in Traditional Chinese (design §5.4), looked up by their English
# words in plugin.toml and settings.toml. Machine-drafted by the agent; a native speaker has not checked it yet.
status = "draft"

[text]
"Standard plugin: in-game notifications about skipped plugins, the previous crash, safe mode, ironman, multiplayer and, opt-in, a newer Anvil release, a badge with Anvil's version in the main menu, and a panel (Ctrl+Shift+F12 or a click on the badge) with the status, the crash report, the log and every plugin's settings." = "標準外掛：遊戲內關於被略過的外掛、上次當機、安全模式、鐵人、多人模式以及（可選）Anvil 新版本的通知，主選單中顯示 Anvil 版本的徽章，以及一個面板（Ctrl+Shift+F12 或點擊徽章），其中有狀態、當機報告、記錄和每個外掛的設定。"
"Panel key" = "面板快速鍵"
"Opens and closes the Anvil panel." = "開啟和關閉 Anvil 面板。"
"Show notifications" = "顯示通知"
"Notices about skipped plugins, the previous crash and safe mode when the game is ready. The ironman notice is always shown; the multiplayer notice too, until you close it." = "遊戲就緒時關於被略過的外掛、上次當機和安全模式的通知。鐵人通知一律顯示；多人模式通知也會顯示，直到你關閉它。"
"Notification time (s)" = "通知顯示時間（秒）"
"How long a notification stays; 0 keeps it until it is closed." = "通知停留多久；0 表示一直顯示到被關閉。"
"Scale" = "縮放"
"The size of the panel and the notifications." = "面板和通知的大小。"
"Show Anvil in the main menu" = "在主選單中顯示 Anvil"
"A small badge with Anvil's version on the left edge of the game's main menu; a click opens the panel. Never shown in a game." = "遊戲主選單左邊緣顯示 Anvil 版本的小徽章；點擊即可開啟面板。遊戲中從不顯示。"
"Like the game" = "跟隨遊戲"
"English" = "英文"
"French" = "法文"
"German" = "德文"
"Spanish" = "西班牙文"
"Chinese (Simplified)" = "簡體中文"
"Chinese (Traditional)" = "繁體中文"
"Japanese" = "日文"
"Korean" = "韓文"
"Polish" = "波蘭文"
"Language" = "語言"
"The language of the panel and the notices. Like the game: EU4's language, or with Mei the Chinese, Japanese or Korean of Steam or Windows, or Polish when Steam is in Polish. The Manager follows it too." = "面板和通知的語言。跟隨遊戲：EU4 的語言；使用 Mei 時為 Steam 或 Windows 的中文、日文或韓文；Steam 為波蘭文時為波蘭文。Manager 也會跟隨此設定。"
"Ask (or follow Anvil Manager)" = "詢問（或跟隨 Anvil Manager）"
"On" = "開"
"Off" = "關"
"Check for new Anvil releases" = "檢查 Anvil 的新版本"
"When the game is ready, ask GitHub (api.github.com) once for Anvil's latest release and, when it is newer, show a notice with a link to its page. Nothing is downloaded. Ask: follow your answer in Anvil Manager, or ask once in the game. A Manager that never asked follows On or Off here, and then also reads the list of the team's plugins at its start to show their updates." = "遊戲就緒時向 GitHub（api.github.com）查詢一次 Anvil 的最新版本，若較新，則顯示附有其頁面連結的通知。不會下載任何內容。詢問：跟隨你在 Anvil Manager 中的回答，或在遊戲中詢問一次。從未詢問過的 Manager 會跟隨這裡的開或關，並且在啟動時也會讀取團隊外掛清單以顯示它們的更新。"
