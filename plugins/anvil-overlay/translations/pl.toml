# anvil-overlay's texts in Polish (design §5.4), looked up by their English
# words in plugin.toml and settings.toml. Machine-drafted by the agent; a native speaker has not checked it yet.
status = "draft"

[text]
"Standard plugin: in-game notifications about skipped plugins, the previous crash, safe mode, ironman, multiplayer and, opt-in, a newer Anvil release, a badge with Anvil's version in the main menu, and a panel (Ctrl+Shift+F12 or a click on the badge) with the status, the crash report, the log and every plugin's settings." = "Wtyczka standardowa: powiadomienia w grze o pominiętych wtyczkach, poprzedniej awarii, trybie awaryjnym, ironmanie, grze wieloosobowej i, na życzenie, nowszym wydaniu Anvila, plakietka z wersją Anvila w menu głównym oraz panel (Ctrl+Shift+F12 albo kliknięcie plakietki) ze stanem, raportem awarii, logiem i ustawieniami każdej wtyczki."
"Panel key" = "Klawisz panelu"
"Opens and closes the Anvil panel." = "Otwiera i zamyka panel Anvila."
"Show notifications" = "Pokazuj powiadomienia"
"Notices about skipped plugins, the previous crash and safe mode when the game is ready. The ironman notice is always shown; the multiplayer notice too, until you close it." = "Komunikaty o pominiętych wtyczkach, poprzedniej awarii i trybie awaryjnym, gdy gra jest gotowa. Komunikat o ironmanie jest zawsze widoczny; o grze wieloosobowej też, dopóki go nie zamkniesz."
"Notification time (s)" = "Czas powiadomienia (s)"
"How long a notification stays; 0 keeps it until it is closed." = "Jak długo powiadomienie zostaje na ekranie; 0 zostawia je do zamknięcia."
"Scale" = "Skala"
"The size of the panel and the notifications." = "Wielkość panelu i powiadomień."
"Show Anvil in the main menu" = "Pokazuj Anvila w menu głównym"
"A small badge with Anvil's version on the left edge of the game's main menu; a click opens the panel. Never shown in a game." = "Mała plakietka z wersją Anvila przy lewej krawędzi menu głównego gry; kliknięcie otwiera panel. Nigdy nie widać jej w trakcie rozgrywki."
"Like the game" = "Jak w grze"
"English" = "Angielski"
"French" = "Francuski"
"German" = "Niemiecki"
"Spanish" = "Hiszpański"
"Chinese (Simplified)" = "Chiński (uproszczony)"
"Chinese (Traditional)" = "Chiński (tradycyjny)"
"Japanese" = "Japoński"
"Korean" = "Koreański"
"Polish" = "Polski"
"Language" = "Język"
"The language of the panel and the notices. Like the game: EU4's language, or with Mei the Chinese, Japanese or Korean of Steam or Windows, or Polish when Steam is in Polish. The Manager follows it too." = "Język panelu i komunikatów. Jak w grze: język EU4, z Mei chiński, japoński albo koreański ze Steama lub Windows, albo polski, gdy Steam jest po polsku. Manager też się do niego stosuje."
"Ask (or follow Anvil Manager)" = "Pytaj (albo jak w Anvil Manager)"
"On" = "Włączone"
"Off" = "Wyłączone"
"Check for new Anvil releases" = "Sprawdzaj nowe wydania Anvila"
"When the game is ready, ask GitHub (api.github.com) once for Anvil's latest release and, when it is newer, show a notice with a link to its page. Nothing is downloaded. Ask: follow your answer in Anvil Manager, or ask once in the game. A Manager that never asked follows On or Off here, and then also reads the list of the team's plugins at its start to show their updates." = "Gdy gra jest gotowa, raz pyta GitHub (api.github.com) o najnowsze wydanie Anvila i, jeśli jest nowsze, pokazuje komunikat z odnośnikiem do jego strony. Nic nie jest pobierane. Pytaj: według twojej odpowiedzi w Anvil Manager albo jedno pytanie w grze. Manager, który nigdy nie pytał, stosuje się tu do Włączone lub Wyłączone i wtedy przy starcie czyta też listę wtyczek zespołu, żeby pokazać ich aktualizacje."
