# anvil-overlay's settings. The player's values live in
# anvil/data/anvil-overlay/settings.toml; the panel edits them.

[setting.panel_key]
type = "key"
default = "Ctrl+Shift+F12"
label = "Panel key"
description = "Opens and closes the Anvil panel."
restart = false

[setting.notifications]
type = "bool"
default = true
label = "Show notifications"
description = "Notices about skipped plugins, the previous crash and safe mode when the game is ready. The ironman notice is always shown; the multiplayer notice too, until you close it."
restart = false

[setting.notification_seconds]
type = "int"
default = 30
min = 0
max = 600
step = 5
label = "Notification time (s)"
description = "How long a notification stays; 0 keeps it until it is closed."
restart = false

[setting.scale]
type = "float"
default = 1.0
min = 0.75
max = 2.5
step = 0.25
label = "Scale"
description = "The size of the panel and the notifications."
restart = false

[setting.menu_badge]
type = "bool"
default = true
label = "Show Anvil in the main menu"
description = "A small badge with Anvil's version on the left edge of the game's main menu; a click opens the panel. Never shown in a game."
restart = false

[setting.language]
type = "enum"
# The options are i18n::kLanguageSettingOptions, in that order. Each
# translation in translations/ names the languages in its own script, which
# its language's fonts draw.
values = [
    { name = "game", label = "Like the game" },
    { name = "en", label = "English" },
    { name = "fr", label = "French" },
    { name = "de", label = "German" },
    { name = "es", label = "Spanish" },
    { name = "zh_hans", label = "Chinese (Simplified)" },
    { name = "zh_hant", label = "Chinese (Traditional)" },
    { name = "ja", label = "Japanese" },
    { name = "ko", label = "Korean" },
    { name = "pl", label = "Polish" },
]
default = "game"
label = "Language"
description = "The language of the panel and the notices. Like the game: EU4's language, or with Mei the Chinese, Japanese or Korean of Steam or Windows, or Polish when Steam is in Polish. The Manager follows it too."
restart = false
[setting.release_check]
type = "enum"
values = [
    { name = "ask", label = "Ask (or follow Anvil Manager)" },
    { name = "on", label = "On" },
    { name = "off", label = "Off" },
]
default = "ask"
label = "Check for new Anvil releases"
description = "When the game is ready, ask GitHub (api.github.com) once for Anvil's latest release and, when it is newer, show a notice with a link to its page. Nothing is downloaded. Ask: follow your answer in Anvil Manager, or ask once in the game. A Manager that never asked follows On or Off here, and then also reads the list of the team's plugins at its start to show their updates."
restart = false
