# --- the main menu ---
# Outside a game the root's session (root+0x1E00) is the front end, whose state
# machine shows the main menu in state 0 (the nation selection is state 3).
# Checked live on Steam (anvil#184).

[symbol.frontend_vtable]
memory = "read"
note = "slot 0 of the front end's vtable: its scalar deleting destructor; the front end's Idle is slot 0x20"
build."eu4-1.37.5-steam-win64" = { rva = 0x1D5A8C8, points_to = 0x10D2C00 }
build."eu4-1.37.5.2-gog-win64" = { rva = 0x1D43318, points_to = 0x10D1400 }   # CFrontEnd::`vftable'

[symbol.frontend_state]
memory = "code"
values.state = { at = 3, size = 4 }
note = "front end state change: the old state's exit (slot 0x18) and the new state stored at frontend+0x900 (Steam) or +0x8F0 (GOG); 0 is the main menu"

