# The game code and data anvil-game reads, for EU4 1.37.5 (Steam and GOG
# 1.37.5.2, win64). Every offset it uses is a value taken from verified bytes,
# so a different build or a changed function skips the plugin instead of
# misreading memory. Sources: EU4 engine lab, docs/reverse-engineering.md, and
# Tongs (the frame hook, the session and the ironman/multiplayer gate, checked
# live there on Steam). The GOG addresses were found by the Steam bytes and
# named by the eu4.pdb GOG ships next to eu4.exe (anvil#160).
builds = ["eu4-1.37.5-steam-win64", "eu4-1.37.5.2-gog-win64"]

# --- the main loop ---

[symbol.frame]
# mov [rsp+8],rbx; mov [rsp+10h],rbp; mov [rsp+18h],rsi; mov [rsp+20h],rdi; push r14; sub rsp,70h
bytes = "48 89 5C 24 08 48 89 6C 24 10 48 89 74 24 18 48 89 7C 24 20 41 56 48 83 EC 70"
memory = "code"
signature = "uintptr_t (void* app, uint8_t outer)"
note = "one frame: outer = 1 from the main loop (and the first-start language loop), 0 for frames drawn inside a game update or a save load"
build."eu4-1.37.5-steam-win64" = { rva = 0x14C25A0 }
build."eu4-1.37.5.2-gog-win64" = { rva = 0x14BC400 }       # CApplication::UpdateOneFrame

[symbol.frame_counter]
bytes = "48 FF 87 20 03 00 00"                    # inc qword [rdi+320h]
memory = "code"
values.counter = { at = 3, size = 4 }
note = "inside the frame function: the frame counter app+0x320, once per frame"
build."eu4-1.37.5-steam-win64" = { rva = 0x14C2A23 }
build."eu4-1.37.5.2-gog-win64" = { rva = 0x14BC87D }

[symbol.main_loop_frame]
bytes = "B2 01 48 8B CE E8 88 F7 FF FF 44 38 B6 83 00 00 00"   # mov dl,1; mov rcx,rsi; call frame; cmp [rsi+83h],r14b
memory = "code"
values.quit = { at = 13, size = 4 }
note = "main loop: frame(app, 1), then the quit flag app+0x83"
build."eu4-1.37.5-steam-win64" = { rva = 0x14C2E0E }
build."eu4-1.37.5.2-gog-win64" = { rva = 0x14BCC6E }       # CApplication::Run

[symbol.main_loop_quit]
bytes = "44 38 B6 F8 02 00 00 75 48"              # cmp [rsi+2F8h],r14b; jne exit
memory = "code"
values.quit_request = { at = 3, size = 4 }
note = "main loop: the second quit flag app+0x2F8, checked before each frame"
build."eu4-1.37.5-steam-win64" = { rva = 0x14C2DD0 }
build."eu4-1.37.5.2-gog-win64" = { rva = 0x14BCC30 }

# --- readiness ---

[symbol.ready_store]
memory = "code"
values.ready_flag = { at = 9, rip_relative = 14, type = "uint8_t" }
note = "end of start-up: the ready byte becomes 1 (the lab's ready marker, with 'Running application')"

