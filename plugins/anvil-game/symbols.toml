build."eu4-1.37.5-steam-win64" = { rva = 0x14C2500 }
build."eu4-1.37.5.2-gog-win64" = { rva = 0x14BC360 }
build."eu4-1.37.5.0-gog-win64" = { rva = 0x14BC360 }

