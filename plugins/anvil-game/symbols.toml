# --- the game's own restart (ADR 0012) ---
# The main loop leaves on app+0x83 and, with app+0x84 set, starts eu4.exe
# again with its own command line. In a campaign the in-game session's
# resign flag runs the game's Exit to Menu (the multiplayer exit, the
# ironman save, the restart). Optional: a build that declares them absent
# answers restart() with ANVIL_ERROR_UNSUPPORTED.

[symbol.restart_store]
sha256 = "E410D7DDC98E6144E15434746C7D52F473A698180DC665A235186DA58825B4C5"
size = 16
memory = "code"
values.flags = { at = 3, size = 4, is = 0x83 }
