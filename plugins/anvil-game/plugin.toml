id = "anvil-game"
name = "Anvil game"
version = "1.3.0"
authors = ["Happy Dwarf Team"]
description = "Standard plugin: game readiness, a frame event, work on the main thread, and a session event with ironman and multiplayer, which Anvil uses to suspend gameplay plugins."
api = 2
entry = "anvil_game.dll"
# Early, so that early plugins can depend on it; its frame hook is placed
# before the game's code runs.
phase = "early"
symbols = "symbols.toml"
affects_gameplay = false
issues = "https://github.com/happy-dwarf-team/anvil/issues"
repository = "https://github.com/happy-dwarf-team/anvil"
