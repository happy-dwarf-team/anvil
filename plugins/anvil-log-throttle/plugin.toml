id = "anvil-log-throttle"
name = "Anvil log throttle"
version = "1.6.1"
authors = ["Happy Dwarf Team"]
description = "Standard plugin: a line that repeats in the game's error.log is written a few times, then counted, with a report of the count every minute and when the game closes the log."
api = 2
entry = "anvil_log_throttle.dll"
# Early, so that its swaps are in place before the game opens its logs.
phase = "early"
symbols = "symbols.toml"
settings = "settings.toml"
# It changes only which lines reach the game's log files, which the game
# never reads back.
affects_gameplay = false
issues = "https://github.com/happy-dwarf-team/anvil/issues"
repository = "https://github.com/happy-dwarf-team/anvil"
