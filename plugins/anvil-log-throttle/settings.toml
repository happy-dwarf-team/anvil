# anvil-log-throttle's settings. The player's values live in
# anvil/data/anvil-log-throttle/settings.toml; the overlay's panel edits them.

[setting.full_log]
type = "bool"
default = false
label = "Write every line"
description = "Turns throttling off: every line reaches the log, and repeats counted so far are reported."
restart = false

[setting.repeats]
type = "int"
default = 10
min = 1
max = 1000000
label = "Lines kept per message"
description = "How many times a line is written before its repeats are only counted."
restart = false

[setting.report_seconds]
type = "int"
default = 60
min = 1
max = 3600
step = 10
label = "Report every (s)"
description = "How often the count of a throttled line is written to the log, while the log is written; the last count is written when the game closes the log."
restart = false

[setting.logs]
type = "string"
default = "error.log"
label = "Logs"
description = "The game's log files to throttle, separated by commas (e.g. \"error.log, game.log\"), or * for all of them."
restart = true
