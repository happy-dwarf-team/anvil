bytes = "B9 70 00 00 00 E8 88 A7 E6 00 48 8B D8 48 89 44 24 30 48 8B C8 E8 E4 56 FD FF 48 8D 05 DD D0 14 01 48 89 03 48 8D 05 AB 1E 0E 01 48 89 43 38 81 63 68 00 00 00 80"
