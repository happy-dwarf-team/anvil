# The game code anvil-script uses, for EU4 1.37.5 (Steam, GOG 1.37.5.2 and
# 1.37.5.0 with the same addresses, win64): the start of CEffect::ReadMember,
# which parses every member of every container effect, and what a CEffect of
# the plugin's needs to be built, appended, described and destroyed like the
# game's own. Every offset is a value taken from verified bytes. Sources: EU4 engine lab
# docs/research/script-effect-statics.md (GOG's eu4.pdb, the Steam bytes) and
# its prototype docs/script-effect-game-test.md (eu4-engine-lab#77);
# docs/spec/script-effects-v1.md section 7. The Day end: CGameState::
# HandleDailyTick and the date it advances (lab docs/research/
# chisel-path-recompute.md, eu4-engine-lab#131; docs/spec/day-end-v1.md
# section 7).
builds = ["eu4-1.37.5-steam-win64", "eu4-1.37.5.2-gog-win64", "eu4-1.37.5.0-gog-win64"]

[symbol.effect_read_member]
# mov [rsp+8],rbx; mov [rsp+10h],rsi; push rbp; push rdi; push r12; push r14; push r15
bytes = "48 89 5C 24 08 48 89 74 24 10 55 57 41 54 41 56 41 57"
memory = "code"
signature = "void (void* effect, void* reader, int token)"
note = "CEffect::ReadMember(CReader&, int): a 31.5 kB switch over the lexer's tokens; every container effect parses its members here"
build."eu4-1.37.5-steam-win64" = { rva = 0x5DEC50 }
build."eu4-1.37.5.2-gog-win64" = { rva = 0x5DE720 }
build."eu4-1.37.5.0-gog-win64" = { rva = 0x5DE720 }

[symbol.effect_lhs_site]
bytes = "48 8D 5E 30 48 8B CB"                       # lea rbx,[rsi+30h]; mov rcx,rbx (then CToken::GetString)
memory = "code"
values.lhs = { at = 3, size = 1 }
note = "ReadMember's default branch takes the key's text from CReader::_Toklhs (CToken: id at +0, text at +4)"
build."eu4-1.37.5-steam-win64" = { rva = 0x5E4B04 }
build."eu4-1.37.5.2-gog-win64" = { rva = 0x5E45D4 }
build."eu4-1.37.5.0-gog-win64" = { rva = 0x5E45D4 }

[symbol.effect_assign_site]
# lea rcx,[rdi+10h]; lea rdx,[rsp+20h]; call CArray::Append; mov rcx,[rsp+20h]; mov rax,[rcx];
# lea rdx,[rsi+440h]; call [rax+48h]
bytes = "48 8D 4F 10 48 8D 54 24 20 E8 ?? ?? ?? ?? 48 8B 4C 24 20 48 8B 01 48 8D 96 40 04 00 00 FF 50 48"
memory = "code"
values.children = { at = 3, size = 1 }
values.rhs = { at = 25, size = 4 }
values.assign = { at = 31, size = 1 }
note = "a simple effect's case in ReadMember: append to the parent's children (CEffect+0x10), Assign(CReader::_Tokrhs) through vtable slot 0x48"
build."eu4-1.37.5-steam-win64" = { rva = 0x5E0F43 }
build."eu4-1.37.5.2-gog-win64" = { rva = 0x5E0A13 }
build."eu4-1.37.5.0-gog-win64" = { rva = 0x5E0A13 }

[symbol.effect_set_token]
bytes = "89 51 28 C3"                                # mov [rcx+28h],edx; ret
memory = "code"
values.token = { at = 2, size = 1 }
note = "CEffect::SetToken(int): CEffect::_Token"
build."eu4-1.37.5-steam-win64" = { rva = 0x5EF140 }
build."eu4-1.37.5.2-gog-win64" = { rva = 0x5EEC10 }
build."eu4-1.37.5.0-gog-win64" = { rva = 0x5EEC10 }

[symbol.effect_ctor]
bytes = "48 89 5C 24 20 48 89 4C 24 08 57 48 83 EC 40 48 8B D9 33 C0"
memory = "code"
signature = "void* (void* effect)"
note = "CEffect::CEffect(): the vtable, token -1, and the effect registered in CEffectDataBase under its mutex"
build."eu4-1.37.5-steam-win64" = { rva = 0x5DE770 }
build."eu4-1.37.5.2-gog-win64" = { rva = 0x5DE240 }
build."eu4-1.37.5.0-gog-win64" = { rva = 0x5DE240 }

[symbol.effect_vtable_site]
memory = "code"
values.vtable = { at = 3, rip_relative = 7, type = "void*" }
note = "lea rax,[CEffect::vftable]; mov [rcx],rax in CEffect::CEffect: 19 slots, 0x98 bytes"

[symbol.effect_vtable_site.build."eu4-1.37.5-steam-win64"]
rva = 0x5DE797
bytes = "48 8D 05 AA FD 6B 01 48 89 01"

[symbol.effect_vtable_site.build."eu4-1.37.5.2-gog-win64"]
rva = 0x5DE267
bytes = "48 8D 05 5A 90 6A 01 48 89 01"

[symbol.effect_vtable_site.build."eu4-1.37.5.0-gog-win64"]
rva = 0x5DE267
bytes = "48 8D 05 5A 90 6A 01 48 89 01"

[symbol.effect_dtor]
bytes = "48 89 5C 24 08 48 89 74 24 10 48 89 7C 24 18 41 56 48 83 EC 40 4C 8B F1"
memory = "code"
signature = "void (void* effect)"
note = "CEffect::~CEffect(): unregisters the effect and deletes its children through slot 0; frees nothing of the effect itself"
build."eu4-1.37.5-steam-win64" = { rva = 0x5DE8D0 }
build."eu4-1.37.5.2-gog-win64" = { rva = 0x5DE3A0 }
build."eu4-1.37.5.0-gog-win64" = { rva = 0x5DE3A0 }

[symbol.array_append]
bytes = "4C 8B C2 48 8B 51 08 48 3B 51 10 74 0C 49 8B 00 48 89 02 48 83 41 08 08 C3"
memory = "code"
signature = "void (void* array, void** item)"
note = "CArray<T*>::Append, a std::vector<void*> push_back with the game's heap"
build."eu4-1.37.5-steam-win64" = { rva = 0xC9F10 }
build."eu4-1.37.5.2-gog-win64" = { rva = 0xC9F40 }
build."eu4-1.37.5.0-gog-win64" = { rva = 0xC9F40 }

[symbol.scope_province_site]
bytes = "48 8B DA 48 8B F9 83 7A 28 00"                  # mov rbx,rdx; mov rdi,rcx; cmp dword [rdx+28h],0
memory = "code"
values.province = { at = 8, size = 1 }
note = "CProvinceCultureEffect::Execute+0x1F: a province effect reads the scope's own province (CEventScope+0x28); CEffect::GetScopeProvinceId answers only for ROOT, FROM and event targets"
build."eu4-1.37.5-steam-win64" = { rva = 0x62367F }
build."eu4-1.37.5.2-gog-win64" = { rva = 0x62314F }
build."eu4-1.37.5.0-gog-win64" = { rva = 0x62314F }

[symbol.scope_country_site]
# movzx r8d,byte [rdx+4Bh]; mov edx,44h; mov eax,edx; mov r9d,2Ch; test r8b,r8b; cmove eax,r9d
bytes = "44 0F B6 42 4B BA 44 00 00 00 8B C2 41 B9 2C 00 00 00 45 84 C0 41 0F 44 C1"
memory = "code"
values.override_valid = { at = 4, size = 1 }
values.override = { at = 6, size = 4 }
values.tag = { at = 14, size = 4 }
note = "CTreasuryEffect::Execute+0x25: a country effect's country is the scope's tag at +0x44 when +0x4B is set, else the tag at +0x2C (CCountryTag: text, then valid at +7)"
build."eu4-1.37.5-steam-win64" = { rva = 0x5EFC55 }
build."eu4-1.37.5.2-gog-win64" = { rva = 0x5EF725 }
build."eu4-1.37.5.0-gog-win64" = { rva = 0x5EF725 }

[symbol.cstring_from_text]
bytes = "40 53 48 83 EC 20 33 C0 48 C7 41 18 0F 00 00 00 48 89 01 48 8B D9 88 01"
memory = "code"
signature = "void* (void* string, const char* text)"
note = "CString::CString(const char*): the game's std::string, with the game's heap"
build."eu4-1.37.5-steam-win64" = { rva = 0x1703550 }
build."eu4-1.37.5.2-gog-win64" = { rva = 0x16ED320 }
build."eu4-1.37.5.0-gog-win64" = { rva = 0x16ED320 }

[symbol.daily_tick]
# mov rax,rsp; push rbp; push rbx; push rsi; push rdi; push r12; push r13; push r14; push r15;
# lea rbp,[rax-138h]; sub rsp,1F8h
bytes = "48 8B C4 55 53 56 57 41 54 41 55 41 56 41 57 48 8D A8 C8 FE FF FF 48 81 EC F8 01 00 00"
memory = "code"
signature = "void (void* game_state)"
note = "CGameState::HandleDailyTick(): the whole day; one caller, CDailyTickCommand::Execute, which after the return only logs and calls COOSHandler::MakeSyncCheck"
build."eu4-1.37.5-steam-win64" = { rva = 0x758430 }
build."eu4-1.37.5.2-gog-win64" = { rva = 0x7575F0 }
build."eu4-1.37.5.0-gog-win64" = { rva = 0x7575F0 }

[symbol.daily_tick_date_site]
# lea r15,[rsi+1DD0h]; mov rcx,r15; call; lea r12,[days per month]; ...; mov [rbp+140h],eax; add dword [r15],18h
bytes = "4C 8D BE D0 1D 00 00 49 8B CF E8 ?? ?? ?? ?? 4C 8D 25 ?? ?? ?? ?? 83 E8 1F 78 0F 49 8B CC 90 41 FF C5 48 8D 49 04 2B 01 79 F5 49 8B CF E8 ?? ?? ?? ?? 89 85 40 01 00 00 41 83 07 18"
memory = "code"
values.date = { at = 3, size = 4 }
note = "HandleDailyTick+0x91: the date (CGameState+0x1DD0, int32 hours) gets the day's 24 hours at the start of the day"
build."eu4-1.37.5-steam-win64" = { rva = 0x7584C1 }
build."eu4-1.37.5.2-gog-win64" = { rva = 0x757681 }
build."eu4-1.37.5.0-gog-win64" = { rva = 0x757681 }

# --- has_dlc for plugin names (anvil#316) ---
# CHasDLCTrigger keeps one bit per DLC the game knows, set by Assign from the
# name (a strcmp chain, nothing logged and nothing kept for another name), and
# Evaluate tests them: no bit is false. A name "anvil:<id>" becomes a trigger
# of the plugin's own vtable instead, whose Evaluate answers from a table fixed
# at the session's start.

[symbol.has_dlc_assign]
# mov [rsp+8],rbx; mov [rsp+10h],rsi; mov [rsp+18h],rdi; mov [rsp+20h],r14; push rbp; mov rbp,rsp; sub rsp,40h
bytes = "48 89 5C 24 08 48 89 74 24 10 48 89 7C 24 18 4C 89 74 24 20 55 48 8B EC 48 83 EC 40"
memory = "code"
signature = "bool (void* trigger, const void* token)"
note = "CHasDLCTrigger::Assign(const CToken&): the DLC's name (token text at +4) to the trigger's bits; vtable slot 7"
build."eu4-1.37.5-steam-win64" = { rva = 0xCC5BA0 }
build."eu4-1.37.5.2-gog-win64" = { rva = 0xCC4350 }
build."eu4-1.37.5.0-gog-win64" = { rva = 0xCC4350 }

[symbol.has_dlc_make]
memory = "code"
values.trigger_size = { at = 1, size = 4 }
values.dlc_vtable = { at = 29, rip_relative = 33, type = "void*" }
values.dlc_bits = { at = 49, size = 1 }
note = "std::make_unique<CHasDLCTrigger>: 0x70 bytes, the vtable (16 slots, Evaluate in slot 6), the DLC bits at +0x68 cleared but bit 31; +0x6C to the end is padding"

[symbol.has_dlc_make.build."eu4-1.37.5-steam-win64"]
rva = 0xBB4012
bytes = "B9 70 00 00 00 E8 B8 F2 E7 00 48 8B D8 48 89 44 24 30 48 8B C8 E8 E4 56 FD FF 48 8D 05 7D 32 16 01 48 89 03 48 8D 05 DB 7A 0F 01 48 89 43 38 81 63 68 00 00 00 80"

[symbol.has_dlc_make.build."eu4-1.37.5.2-gog-win64"]
rva = 0xBB27C2
bytes = "B9 70 00 00 00 E8 88 A7 E6 00 48 8B D8 48 89 44 24 30 48 8B C8 E8 E4 56 FD FF 48 8D 05 DD D0 14 01 48 89 03 48 8D 05 AB 1E 0E 01 48 89 43 38 81 63 68 00 00 00 80"

[symbol.has_dlc_make.build."eu4-1.37.5.0-gog-win64"]
