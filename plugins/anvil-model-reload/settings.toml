# anvil-model-reload's settings. The player's values live in
# anvil/data/anvil-model-reload/settings.toml; the overlay's panel edits them.

[setting.window]
type = "bool"
default = false
label = "Model reload window"
description = "For model modders: a window of the overlay that lists the files of your enabled mods saved since the last reload and reloads them in the running game. On: the window opens, at every start too; once closed, it is in the Status tab of the Anvil panel. Off: the plugin does nothing."
restart = false
