# anvil-model-reload's texts in Polish (design §5.4), looked up by their English
# words in plugin.toml and settings.toml. Machine-drafted by the agent; a native speaker has not checked it yet.
status = "draft"

[text]
"Standard plugin for modders: a window of the overlay that reloads the meshes, model textures, animations, entities and .gfx mesh entries of your mod that you saved, while the game runs. Not in ironman or multiplayer, and off until you turn it on." = "Wtyczka standardowa dla modderów: okno nakładki, które w działającej grze wczytuje ponownie zapisane siatki, tekstury modeli, animacje, encje i wpisy siatek w plikach .gfx Twojego moda. Nie w grach ironman ani wieloosobowych i wyłączona, dopóki jej nie włączysz."
"Model reload window" = "Okno przeładowania modeli"
"For model modders: a window of the overlay that lists the files of your enabled mods saved since the last reload and reloads them in the running game. On: the window opens, at every start too; once closed, it is in the Status tab of the Anvil panel. Off: the plugin does nothing." = "Dla modderów modeli: okno nakładki, które wymienia pliki Twoich włączonych modów zapisane od ostatniego przeładowania i wczytuje je ponownie w działającej grze. Włączone: okno się otwiera, także przy każdym uruchomieniu; zamknięte jest w zakładce Status panelu Anvila. Wyłączone: wtyczka nic nie robi."
