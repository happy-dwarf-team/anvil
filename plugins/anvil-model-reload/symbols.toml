# --- Units on the map (after `reload assets`) ---------------------------------
#
# CProvinceGraphics (0x1400 bytes in every build) keeps the 3D instances of the
# units shown in a province in _Units (EntityInstanceENTITY*[21], +0x1E0).
# CProvinceGraphics::UpdateProvinceUnits creates a slot's instance when it is
# empty and deletes it with EntityInstanceDestroy when its unit is gone, so a
# slot emptied between frames is created again, from the reloaded entity, the
# next time the province's units are drawn.

[symbol.province_units]
memory = "code"
values.game_state = { at = 3, rip_relative = 7, type = "uintptr_t" }
values.graphics_owner = { at = 21, size = 4, is = 0x1E00 }
values.application = { at = 28, size = 4 }
values.map = { at = 35, size = 4, is = 0x360 }
values.units = { at = 42, size = 4, is = 0x1E0 }
values.unit_slots = { at = 47, size = 4, is = 0x15 }
note = "CProvinceGraphics::Clear+0x24: mov rax,[CGameState*]; ...; mov rax,[rax+0x1E00] (_pGraphicsOwner, CEU3Idler*); mov rdx,[rax+0x330] (Steam) or [rax+0x328] (GOG), the CEU4Application; mov r12,[rdx+0x360] (_pMap, CEU3GraphicalMap*); lea rbx,[r14+0x1E0] (_Units); mov esi,21"

