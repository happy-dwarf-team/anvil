# --- Units on the map (after `reload assets`) ---------------------------------
#
# A province's graphics object (0x1400 bytes in every build) keeps the 3D
# instances of the units shown in the province in 21 slots at +0x1E0 (entity
# instance pointers). Its unit update creates a slot's instance when it is
# empty and destroys it when its unit is gone, so a slot emptied between
# frames is created again, from the reloaded entity, the next time the
# province's units are drawn.

[symbol.province_units]
memory = "code"
values.game_state = { at = 3, rip_relative = 7, type = "uintptr_t" }
values.graphics_owner = { at = 21, size = 4, is = 0x1E00 }
values.application = { at = 28, size = 4 }
values.map = { at = 35, size = 4, is = 0x360 }
values.units = { at = 42, size = 4, is = 0x1E0 }
values.unit_slots = { at = 47, size = 4, is = 0x15 }
note = "+0x24 in province_graphics_clear: the game state's global; its graphics owner, the in-game session, at +0x1E00; the application at session+0x330 (Steam) or +0x328 (GOG); the graphical map at application+0x360; the 21 unit slots at +0x1E0 of the province's graphics"

