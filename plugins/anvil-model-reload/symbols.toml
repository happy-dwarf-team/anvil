# --- Map objects outside the province's own slots ------------------------------
#
# province_graphics_clear and create_province_sprites leave three kinds of
# entity instance on the map: the envoys travelling between provinces
# (merchants, missionaries, colonists, diplomats), the trade goods moving along
# trade routes and the ambient objects (eagles, windmills, whales). For each
# the game has a function or a flag with which it creates the instance again
# itself.
#
# Field offsets read with them (the same in every build; Steam's code uses
# the same ones in the functions below): a province's envoy entry (0x18
# bytes) points to its envoy graphics at +0x8; an envoy object (0xC8 bytes)
# has its province at +0x48, its entity instance at +0x50 and the owner tag's
# valid byte at +0x65; a moving trade good (0x90 bytes) has its type at +0x10
# and its entity instance at +0x78; an ambient object has its entity
# instance at +0x8 and its remove flag at +0x10.

[symbol.province_envoys]
sha256 = "B35EA0D88062C25CF738766788C701328DE0ACFB08A3D887ED44657DDACA2973"
size = 17
memory = "code"
values.envoy_graphics = { at = 3, size = 4, is = 0x2A0 }
note = "the province graphics' envoy update: reads the array of the province's envoy entries at +0x2A0 (begin/end/capacity)"
build."eu4-1.37.5-steam-win64" = { rva = 0x132C4E5 }
build."eu4-1.37.5.2-gog-win64" = { rva = 0x1326645 }   # +0x125 in the province graphics' envoy update
build."eu4-1.37.5.0-gog-win64" = { rva = 0x1326645 }

