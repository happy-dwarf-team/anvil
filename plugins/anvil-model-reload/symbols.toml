# --- Map objects outside the province's own slots ------------------------------
#
# Clear and CreateProvinceSprites leave three kinds of entity instance on the
# map: the envoys travelling between provinces (merchants, missionaries,
# colonists, diplomats), the trade goods moving along trade routes and the
# ambient objects (eagles, windmills, whales). For each the game has a function
# or a flag with which it creates the instance again itself.
#
# Field offsets read with them (PDB layouts, the same in every build; Steam's
# code uses the same ones in the functions below): STemporaryEnvoyGraphics
# (0x18 bytes) _pEnvoyGraphics +0x8; CEnvoyObject (0xC8 bytes) _pProvince
# +0x48, _EntityInstance +0x50, the owner tag's valid byte +0x65;
# CTradeRouteGoods (0x90 bytes) _Type +0x10, _EntityInstance +0x78;
# CAmbientObjectInstance _EntityInstance +0x8, _bShouldRemove +0x10.

