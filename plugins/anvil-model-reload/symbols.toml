# What anvil-model-reload reads, writes and calls in EU4 1.37.5 (Steam and GOG
# 1.37.5.2 and 1.37.5.0, win64). Source: EU4 engine lab,
# docs/anvil-470-gfx-reload-2026-11-18.md (anvil#470). Steam's addresses are
# the GOG functions found in Steam's eu4.exe. The two GOG builds have these
# bytes at the same addresses.
#
# Field offsets the plugin uses (the same in every build): a 3D type's key
# +0x10 (the game's string), its scale +0x30 (float) and its cull distance
# +0x34 (float, the square); a mesh type's file name +0xA0 (the game's
# string) and its animation lookup +0xC0 (an array, begin/end/capacity),
# entries of 0x40 bytes with a hash at +0x10 and a name at +0x20.
builds = ["eu4-1.37.5-steam-win64", "eu4-1.37.5.2-gog-win64", "eu4-1.37.5.0-gog-win64"]

# --- The gfx type table ------------------------------------------------------

[symbol.graphics_types]
memory = "code"
values.graphics = { at = 3, rip_relative = 7, type = "uintptr_t" }
values.bucket_count = { at = 15, size = 4, is = 0x554 }
values.buckets = { at = 26, size = 4, is = 0x558 }
note = "in the mesh reloader (a list of names): reads the graphics object's global, its bucket count at +0x554 and its buckets at +0x558: the hash table of 3D types by name, buckets of nodes {type, next}"

