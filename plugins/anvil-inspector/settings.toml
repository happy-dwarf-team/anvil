# anvil-inspector's settings. The player's values live in
# anvil/data/anvil-inspector/settings.toml; the overlay's panel edits them.

[setting.window]
type = "bool"
default = false
label = "Inspector window"
description = "For modders: a window of the overlay with the flags, variables and timed modifiers of the province whose view is open, of its owner and of your country, read from the running game. On: the window opens, at every start too; once closed, it is in the Status tab of the Anvil panel. Off: the plugin does nothing."
restart = false
