# anvil-inspector's texts in French (design §5.4), looked up by their English
# words in plugin.toml and settings.toml. Machine-drafted by the agent; a native speaker has not checked it yet.
status = "draft"

[text]
"Standard plugin for modders: a window of the overlay with the flags, variables and timed modifiers of the province whose view is open, of its owner and of your country, with their rulers, heirs and consorts. It only reads, and it is off until you turn it on." = "Plugin standard pour les moddeurs : une fenêtre de l'overlay avec les drapeaux, les variables et les modificateurs temporaires de la province dont la vue est ouverte, de son propriétaire et de votre pays, avec leurs souverains, héritiers et consorts. Il ne fait que lire et reste désactivé tant que vous ne l'activez pas."
"Inspector window" = "Fenêtre de l'inspecteur"
"For modders: a window of the overlay with the flags, variables and timed modifiers of the province whose view is open, of its owner and of your country, read from the running game. On: the window opens, at every start too; once closed, it is in the Status tab of the Anvil panel. Off: the plugin does nothing." = "Pour les moddeurs : une fenêtre de l'overlay avec les drapeaux, les variables et les modificateurs temporaires de la province dont la vue est ouverte, de son propriétaire et de votre pays, lus dans la partie en cours. Activé : la fenêtre s'ouvre, à chaque démarrage aussi ; une fois fermée, elle se trouve dans l'onglet Statut du panneau d'Anvil. Désactivé : le plugin ne fait rien."
