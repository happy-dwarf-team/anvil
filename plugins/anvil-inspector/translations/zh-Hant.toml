# anvil-inspector's texts in Traditional Chinese (design §5.4), looked up by their English
# words in plugin.toml and settings.toml. Machine-drafted by the agent; a native speaker has not checked it yet.
status = "draft"

[text]
"Standard plugin for modders: a window of the overlay with the flags, variables and timed modifiers of the province whose view is open, of its owner and of your country, with their rulers, heirs and consorts. It only reads, and it is off until you turn it on." = "面向模組作者的標準外掛：疊加層中的一個視窗，顯示目前開啟檢視的省份、其擁有者以及你的國家的標記、變數和限時修正，以及它們的統治者、繼承人和配偶。它只讀取資料，在你開啟之前不會運作。"
"Inspector window" = "檢查器視窗"
"For modders: a window of the overlay with the flags, variables and timed modifiers of the province whose view is open, of its owner and of your country, read from the running game. On: the window opens, at every start too; once closed, it is in the Status tab of the Anvil panel. Off: the plugin does nothing." = "面向模組作者：疊加層中的一個視窗，顯示目前開啟檢視的省份、其擁有者以及你的國家的標記、變數和限時修正，資料讀取自正在執行的遊戲。開啟：視窗會開啟，每次啟動時也會開啟；關閉視窗後，可在 Anvil 面板的「狀態」分頁中找到它。關閉：外掛不做任何事。"
