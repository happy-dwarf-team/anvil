# anvil-inspector's texts in German (design §5.4), looked up by their English
# words in plugin.toml and settings.toml. Machine-drafted by the agent; a native speaker has not checked it yet.
status = "draft"

[text]
"Standard plugin for modders: a window of the overlay with the flags, variables and timed modifiers of the province whose view is open, of its owner and of your country, with their rulers, heirs and consorts. It only reads, and it is off until you turn it on." = "Standard-Plugin für Modder: ein Fenster des Overlays mit den Flags, Variablen und zeitlich begrenzten Modifikatoren der Provinz, deren Ansicht offen ist, ihres Besitzers und Ihres Landes, mit ihren Herrschern, Erben und Gemahlen. Es liest nur und bleibt aus, bis Sie es einschalten."
"Inspector window" = "Inspektorfenster"
"For modders: a window of the overlay with the flags, variables and timed modifiers of the province whose view is open, of its owner and of your country, read from the running game. On: the window opens, at every start too; once closed, it is in the Status tab of the Anvil panel. Off: the plugin does nothing." = "Für Modder: ein Fenster des Overlays mit den Flags, Variablen und zeitlich begrenzten Modifikatoren der Provinz, deren Ansicht offen ist, ihres Besitzers und Ihres Landes, gelesen aus dem laufenden Spiel. Ein: Das Fenster öffnet sich, auch bei jedem Start; geschlossen findet es sich im Tab Status des Anvil-Panels. Aus: Das Plugin tut nichts."
