# anvil-inspector's texts in Spanish (design §5.4), looked up by their English
# words in plugin.toml and settings.toml. Machine-drafted by the agent; a native speaker has not checked it yet.
status = "draft"

[text]
"Standard plugin for modders: a window of the overlay with the flags, variables and timed modifiers of the province whose view is open, of its owner and of your country, with their rulers, heirs and consorts. It only reads, and it is off until you turn it on." = "Plugin estándar para modders: una ventana del overlay con las marcas, las variables y los modificadores temporales de la provincia cuya vista está abierta, de su propietario y de su país, con sus gobernantes, herederos y consortes. Solo lee y está desactivado hasta que lo active."
"Inspector window" = "Ventana del inspector"
"For modders: a window of the overlay with the flags, variables and timed modifiers of the province whose view is open, of its owner and of your country, read from the running game. On: the window opens, at every start too; once closed, it is in the Status tab of the Anvil panel. Off: the plugin does nothing." = "Para modders: una ventana del overlay con las marcas, las variables y los modificadores temporales de la provincia cuya vista está abierta, de su propietario y de su país, leídos de la partida en curso. Activado: la ventana se abre, también en cada inicio; una vez cerrada, está en la pestaña Estado del panel de Anvil. Desactivado: el plugin no hace nada."
