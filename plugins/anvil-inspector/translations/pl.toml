# anvil-inspector's texts in Polish (design §5.4), looked up by their English
# words in plugin.toml and settings.toml. Machine-drafted by the agent; a native speaker has not checked it yet.
status = "draft"

[text]
"Standard plugin for modders: a window of the overlay with the flags, variables and timed modifiers of the province whose view is open, of its owner and of your country, with their rulers, heirs and consorts. It only reads, and it is off until you turn it on." = "Wtyczka standardowa dla modderów: okno nakładki z flagami, zmiennymi i modyfikatorami czasowymi prowincji, której widok jest otwarty, jej właściciela i Twojego kraju, z ich władcami, następcami i małżonkami. Tylko czyta i jest wyłączona, dopóki jej nie włączysz."
"Inspector window" = "Okno inspektora"
"For modders: a window of the overlay with the flags, variables and timed modifiers of the province whose view is open, of its owner and of your country, read from the running game. On: the window opens, at every start too; once closed, it is in the Status tab of the Anvil panel. Off: the plugin does nothing." = "Dla modderów: okno nakładki z flagami, zmiennymi i modyfikatorami czasowymi prowincji, której widok jest otwarty, jej właściciela i Twojego kraju, odczytanymi z działającej gry. Włączone: okno się otwiera, także przy każdym uruchomieniu; zamknięte jest w zakładce Status panelu Anvila. Wyłączone: wtyczka nic nie robi."
