# The game code and data anvil-map hooks, calls and reads, for EU4 1.37.5
# (Steam and GOG 1.37.5.2, win64): plugin map modes (docs/spec/map-modes-v1.md
# §8, ADR 0007). The functions were found in GOG's eu4.exe and matched to
# Steam by their bytes; GOG 1.37.5.0 has the same addresses and bytes in all
# of them. Every offset is a value taken from verified bytes.
builds = ["eu4-1.37.5-steam-win64", "eu4-1.37.5.2-gog-win64", "eu4-1.37.5.0-gog-win64"]

# --- the hooks ---

[symbol.map_color]
# the prologue: three argument saves and six pushes
sha256 = "B6220858F99362C88AEA807433310BDF58EF493AC7B43E24D3352CD081732A08"
size = 22
memory = "code"
signature = "void (uint8_t* colors, uint32_t kind, int32_t mode)"
note = "the map color update (colors, kind, mode): fills BGRA per province ID for a map mode; a jump table over the 85 modes"
build."eu4-1.37.5-steam-win64" = { rva = 0x12F0B40 }
build."eu4-1.37.5.2-gog-win64" = { rva = 0x12EACA0 }
build."eu4-1.37.5.0-gog-win64" = { rva = 0x12EACA0 }

[symbol.map_color_count]
memory = "code"
values.map_global = { at = 3, rip_relative = 7, type = "uintptr_t" }
values.provinces = { at = 10, size = 4, is = 0x6F0 }
values.shift = { at = 31, size = 1, is = 0x4 }
values.magic = { at = 34, size = 8, is = "0x8A3F37EC8C54C121" }
note = "inside map_color: the provinces it paints, ((map+0x6F0).end - begin) >> 4 * inverse of 737 (one province object is 0x2E10 bytes)"

[symbol.map_color_count.build."eu4-1.37.5-steam-win64"]
