# The game code and data anvil-map hooks, calls and reads, for EU4 1.37.5
# (Steam and GOG 1.37.5.2, win64): plugin map modes (docs/spec/map-modes-v1.md
# §8, ADR 0007). The functions were named by the eu4.pdb GOG ships next to
# eu4.exe and matched to Steam by their bytes; GOG 1.37.5.0 has the same
# addresses and bytes in all of them. Every offset is a value taken from
# verified bytes.
builds = ["eu4-1.37.5-steam-win64", "eu4-1.37.5.2-gog-win64", "eu4-1.37.5.0-gog-win64"]

# --- the hooks ---

[symbol.map_color]
# mov [rsp+18h],r8d; mov [rsp+10h],edx; mov [rsp+8],rcx; push rbp; push rbx; push rsi; push rdi; push r12; push r13
bytes = "44 89 44 24 18 89 54 24 10 48 89 4C 24 08 55 53 56 57 41 54 41 55"
memory = "code"
signature = "void (uint8_t* colors, uint32_t kind, int32_t mode)"
note = "UpdateMapColorProvinceBuffer(uchar*, uint, EPdxMapColorUpdateMode): fills BGRA per province ID for a map mode; cmp 0x54 + jump table of 85"
build."eu4-1.37.5-steam-win64" = { rva = 0x12F0B40 }
build."eu4-1.37.5.2-gog-win64" = { rva = 0x12EACA0 }
build."eu4-1.37.5.0-gog-win64" = { rva = 0x12EACA0 }

