id = "anvil-script-profiler"
name = "Anvil script profiler"
version = "1.22.0"
authors = ["Happy Dwarf Team"]
description = "Standard plugin for modders: a window of the overlay that times the game's triggers and effects by the event, decision, on_action, casus belli, triggered modifier or mission they belong to, and writes the results to a CSV file. It hooks nothing until you start a measurement, and the game runs slower while it measures."
api = 2
entry = "anvil_script_profiler.dll"
symbols = "symbols.toml"
settings = "settings.toml"
# It only times the game's script blocks; it changes nothing the game computes,
# so it also works in ironman and multiplayer.
affects_gameplay = false
issues = "https://github.com/happy-dwarf-team/anvil/issues"
repository = "https://github.com/happy-dwarf-team/anvil"

# Days, sessions and work on the game's main thread.
[[dependencies]]
id = "anvil-game"
version = "^1"

# The window. Without it the plugin measures only through the lab's control file.
[[dependencies]]
id = "anvil-overlay"
version = "^1"
optional = true
