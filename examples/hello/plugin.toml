id = "hello"
name = "Hello Anvil"
version = "0.1.0"
authors = ["Happy Dwarf Team"]
description = "Example plugin: logs, publishes a service and waits for the game to be ready."
api = 2
entry = "hello.dll"
phase = "main"
# Required: true if the plugin can change the simulation's state or results.
affects_gameplay = false
issues = "https://github.com/happy-dwarf-team/anvil/issues"
repository = "https://github.com/happy-dwarf-team/anvil"

# No `symbols`: hello uses no game addresses, so it runs on every game build.
# A plugin that does declares them in symbols.toml, tied to one build:
# symbols = "symbols.toml"
