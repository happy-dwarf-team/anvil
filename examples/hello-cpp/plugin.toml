id = "hello-cpp"
name = "Hello (C++)"
version = "0.1.0"
authors = ["Happy Dwarf Team"]
description = "Example plugin in C++: logs the first game-speed object and each return to the menu."
api = 2
anvil = ">=1.10.0"   # the first Anvil that verifies symbols by sha256 and size
entry = "hello_cpp.dll"
phase = "main"
symbols = "symbols.toml"   # the game build comes from here
settings = "settings.toml"
# Required: true if the plugin can change the simulation's state or results.
affects_gameplay = false
issues = "https://github.com/happy-dwarf-team/anvil/issues"
repository = "https://github.com/happy-dwarf-team/anvil"
