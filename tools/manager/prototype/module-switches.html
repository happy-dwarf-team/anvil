<!doctype html>
<!--
  PROTOTYPE, throwaway (branch prototype/module-switches; never merge to main).
  Question: what should the Manager's module switches and ironman / multiplayer opt-ins look like?
  Variant 0 is the Manager as it is today; A, B and C are proposals. Switch via ?variant=0|A|B|C, the bar at the
  bottom, or the arrow keys. The Plugins and Settings tabs both work. A, B and C also show a module's settings
  next to the module, which needs a new optional `module` key in settings.toml (today there is only `group`).
  The real Manager is Dear ImGui; this page imitates its dark style and density in HTML so the variants
  can be compared without a build. Plugins and modules below are sample data, not real manifests.
  State lives in memory: the anvil.toml lists and the overlay preview follow every click.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module switches prototype</title>
<style>
:root{
  --win:#0f0f0f; --child:#141416; --text:#ffffff; --weak:#808080;
  --frame:rgba(41,74,122,.54); --frame-h:rgba(66,150,250,.40); --check:#4296fa;
  --btn:rgba(66,150,250,.40); --btn-h:#4296fa; --hdr:#303033;
  --bs:#4f4f59; --bl:#3b3b40; --rowalt:rgba(255,255,255,.06); --sel:rgba(66,150,250,.31);
  --good:#66c773; --warn:#f5b842; --bad:#f26b61; --info:#6fa8ff;
}
*{box-sizing:border-box}
html,body{margin:0;background:#1b1b1d;color:var(--text);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
.app{max-width:1100px;margin:0 auto;background:var(--win);min-height:100vh;padding:0 0 90px}
.titlebar{padding:6px 12px;background:#202022;font-size:12px;color:#ccc;display:flex;justify-content:space-between}
.gamebar{padding:8px 12px;border-bottom:1px solid var(--bl);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:2px;padding:6px 12px 0;border-bottom:1px solid var(--check)}
.tab{padding:4px 12px;background:rgba(46,89,148,.86);border-radius:4px 4px 0 0;font-size:13px}
.tab.cur{background:var(--check)}
.pane{padding:10px 12px}
.weak{color:var(--weak)} .good{color:var(--good)} .warn{color:var(--warn)} .bad{color:var(--bad)} .info{color:var(--info)}
button{font:inherit;color:var(--text);background:var(--btn);border:0;border-radius:3px;padding:3px 10px;cursor:pointer}
button:hover:not(:disabled){background:var(--btn-h)}
button:disabled{opacity:.45;cursor:default}
button.small{padding:1px 7px;font-size:13px}
.cb{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;white-space:nowrap}
.cb .box{width:16px;height:16px;background:var(--frame);border-radius:2px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.cb:hover .box{background:var(--frame-h)}
.cb.on .box::after{content:"";width:8px;height:8px;background:var(--check);border-radius:1px}
.cb.dis{opacity:.4;cursor:default}
.cb.dis:hover .box{background:var(--frame)}
.dash{color:var(--weak);cursor:help;padding-left:4px}
.tag{font-size:11px;padding:0 6px;border-radius:3px;border:1px solid rgba(245,184,66,.55);color:var(--warn);margin-left:6px;white-space:nowrap;vertical-align:1px}
.pending{font-size:12px;color:var(--info);white-space:nowrap}
table.im{width:100%;border-collapse:collapse;border:1px solid var(--bs)}
table.im th{background:var(--hdr);text-align:left;font-weight:400;padding:4px 6px;border:1px solid var(--bs);white-space:nowrap}
table.im td{padding:4px 6px;border-left:1px solid var(--bl);border-right:1px solid var(--bl);vertical-align:top}
table.im tr:nth-child(even) td{background:var(--rowalt)}
.child td:first-child,.child td.indent{padding-left:26px}
.tree{color:var(--bs);margin-right:4px}
.section{margin:14px 0 6px;color:#ddd;border-bottom:1px solid var(--bl);padding-bottom:3px}
.banner{background:rgba(111,168,255,.10);border:1px solid rgba(111,168,255,.35);border-radius:3px;padding:6px 10px;margin:0 0 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.split{display:grid;grid-template-columns:minmax(200px,280px) minmax(0,1fr);gap:10px}
.list{border:1px solid var(--bs);background:var(--child)}
.li{padding:6px 8px;border-bottom:1px solid var(--bl);cursor:pointer}
.li:hover{background:rgba(66,150,250,.18)} .li.sel{background:var(--sel)}
.detail{border:1px solid var(--bs);background:var(--child);padding:10px 12px}
.seg{display:inline-flex;border:1px solid var(--bs);border-radius:3px;overflow:hidden;flex-wrap:wrap}
.seg button{border-radius:0;background:#26262a;padding:3px 10px;border-right:1px solid var(--bl)}
.seg button.cur{background:var(--check)}
.seg button:disabled{opacity:.35}
.mod{padding:8px 0;border-bottom:1px solid var(--bl)}
.modes{display:flex;gap:0;margin:0 0 10px;border:1px solid var(--bs);border-radius:3px;overflow:hidden;width:max-content;max-width:100%;flex-wrap:wrap}
.modes button{border-radius:0;background:var(--frame);padding:6px 16px;border-right:1px solid var(--bl)}
.modes button.cur{background:var(--check)}
.modes button.cur .weak{color:#e6eefc}
.row{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--bl);flex-wrap:wrap}
.row .nm{min-width:220px}
.overlay{margin:18px 12px 0;border:1px solid var(--bs);background:rgba(15,15,15,.94)}
.overlay .ttl{background:#29497a;padding:3px 8px;font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.overlay .body{padding:8px}
select,input{font:inherit;background:var(--frame);color:var(--text);border:0;padding:2px 6px;border-radius:2px}
input[type=number],input[type=text]{width:10em}
input:disabled,select:disabled{opacity:.4}
.sep{display:flex;align-items:center;gap:8px;margin:12px 0 6px;color:#ddd}
.sep::after{content:"";flex:1;border-top:1px solid var(--bs)}
.set{display:flex;align-items:center;gap:8px;padding:3px 0;flex-wrap:wrap}
.set .lab{min-width:12em}
.setbox{border-left:2px solid var(--bs);margin:4px 0 4px 2px;padding:2px 0 2px 12px}
.tab{cursor:pointer}
.expander{background:none;color:var(--info);padding:0 4px;font-size:12px}
.expander:hover:not(:disabled){background:rgba(111,168,255,.15)}
pre.toml{margin:12px;padding:8px 10px;background:#000;border:1px solid var(--bl);font:12px/1.5 Consolas,monospace;white-space:pre-wrap}
pre.toml .chg{color:var(--info)}
.switcher{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#f4f4f4;color:#111;border-radius:999px;padding:6px 8px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 18px rgba(0,0,0,.6);font:13px system-ui,sans-serif;z-index:10;max-width:calc(100vw - 32px)}
.switcher button{background:#111;color:#fff;border-radius:999px;width:30px;height:30px;padding:0;font-size:15px}
.switcher button:hover{background:#333}
.switcher .lbl{min-width:0;text-align:center;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:720px){.split{grid-template-columns:1fr}.row .nm{min-width:0}}
</style>
</head>
<body>
<div class="app">
  <div class="titlebar"><span>Anvil Manager 1.22.0</span><span>PROTOTYPE &middot; sample data</span></div>
  <div class="gamebar">
    <span>EU4 1.37.5.0 &middot; <span class="weak">...\Europa Universalis IV</span> &middot; <span class="good">Anvil 1.22.0 installed</span></span>
    <span style="flex:1"></span>
    <button data-act="start">Start EU4</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="pane">
    <div id="pending"></div>
    <div id="variant"></div>
  </div>
  <div class="overlay">
    <div class="ttl"><span>Overlay preview: Plugins tab in your next game</span>
      <label>Game: <select id="session">
        <option value="sp">Single-player</option><option value="im" selected>Ironman</option>
        <option value="mp">Multiplayer</option><option value="immp">Ironman multiplayer</option></select></label></div>
    <div class="body" id="overlay"></div>
  </div>
  <pre class="toml" id="toml"></pre>
</div>
<div class="switcher" id="switcher"></div>

<script>
const PLUGINS = [
  {id:'anvil-inspector', name:'Anvil Inspector', version:'1.22.0', standard:true, gameplay:false, modules:[]},
  {id:'bellows', name:'Bellows', version:'1.6.0', gameplay:false, modules:[]},
  {id:'europagiga', name:'Europagiga', version:'0.3.0', gameplay:false, modules:[
    {id:'whetstone', name:'Whetstone', desc:'Extra tooltips and ledger columns.', gameplay:false, def:true},
    {id:'sieve', name:'Sieve', desc:'Filters for the outliner.', gameplay:false, def:true},
    {id:'muster', name:'Muster', desc:'Recruits and merges armies on a hotkey.', gameplay:true, ironman:true, mp:true, def:true},
    {id:'automata', name:'Automata', desc:'Lets the AI run your trade and estates.', gameplay:true, ironman:false, mp:false, def:false},
    {id:'lifespan', name:'Lifespan fix', desc:'Fixes the lifespan of long-lived races in Anbennar.', gameplay:true, ironman:true, mp:false, def:true},
  ]},
  {id:'trade-helper', name:'Trade helper', version:'0.9.2', gameplay:true, ironman:true, mp:false, modules:[]},
];
const LISTS = ['disabled_plugins','enabled_modules','disabled_modules','allow_ironman','allow_multiplayer'];
let toml = {disabled_plugins:[], enabled_modules:[], disabled_modules:[], allow_ironman:['europagiga.lifespan'], allow_multiplayer:[]};
let lastStart = JSON.parse(JSON.stringify(toml));
// settings.toml of each plugin. `module` is the PROPOSED key that ties a setting to a module;
// today's settings.toml has no such key, only `group`, and the Manager ignores it in variant 0.
const SETTINGS = {
  europagiga: [
    {name:'panel_key', type:'key', label:'Panel key', def:'Ctrl+Shift+E', group:''},
    {name:'ledger_cols', type:'bool', label:'Extra ledger columns', def:true, group:'Whetstone', module:'whetstone'},
    {name:'merge_key', type:'key', label:'Merge hotkey', def:'Ctrl+M', group:'Muster', module:'muster'},
    {name:'keep_one', type:'bool', label:'Keep one regiment home', def:true, group:'Muster', module:'muster'},
    {name:'trade_steer', type:'enum', label:'Trade steering', def:'balanced', group:'Automata', module:'automata',
     values:[['off','Off'],['balanced','Balanced'],['greedy','Greedy']]},
  ],
  bellows: [{name:'ram_prefetch_budget_mb', type:'int', label:'RAM prefetch budget (MB)', def:1024, group:'RAM prefetch'}],
  'trade-helper': [{name:'highlight', type:'bool', label:'Highlight the best node', def:true, group:''}],
};
let values = {}, lastValues = {};
let ui = {selected:'europagiga', mode:'ironman', tab:'plugins', settingsPlugin:'europagiga', open:new Set()};

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const has = (t, list, k) => t[list].includes(k);
function setListed(list, k, on){ const a = toml[list].filter(x => x !== k); if (on) a.push(k); toml[list] = a; }

// Every switchable thing: a plugin, or a module of a plugin.
function items(){
  const out = [];
  for (const p of PLUGINS){
    out.push({key:p.id, plugin:p, mod:null, name:p.name, gameplay:p.gameplay, ironman:!!p.ironman, mp:!!p.mp});
    for (const m of p.modules) out.push({key:p.id+'.'+m.id, plugin:p, mod:m, name:m.name, gameplay:m.gameplay, ironman:!!m.ironman, mp:!!m.mp});
  }
  return out;
}
const item = k => items().find(i => i.key === k);
function pluginOn(t, p){ return !has(t,'disabled_plugins',p.id); }
function isOn(t, it){
  if (!pluginOn(t, it.plugin)) return false;
  if (!it.mod) return true;
  return !has(t,'disabled_modules',it.key) && (it.mod.def || has(t,'enabled_modules',it.key));
}
function setOn(it, on){
  if (!it.mod){ setListed('disabled_plugins', it.key, !on); return; }
  if (on){ setListed('disabled_modules', it.key, false); if (!it.mod.def) setListed('enabled_modules', it.key, true); }
  else if (it.mod.def) setListed('disabled_modules', it.key, true);
  else setListed('enabled_modules', it.key, false);
}
const allowed = (t, it, mode) => has(t, mode === 'ironman' ? 'allow_ironman' : 'allow_multiplayer', it.key);
const setAllowed = (it, mode, on) => setListed(mode === 'ironman' ? 'allow_ironman' : 'allow_multiplayer', it.key, on);
const offers = (it, mode) => mode === 'ironman' ? it.ironman : it.mp;
const MODE = {ironman:'ironman', mp:'multiplayer'};

// Why it does not act in a session, in player words; '' when it acts.
function keptOut(t, it, s){
  if (!it.gameplay) return '';
  for (const mode of ['ironman','mp']){
    if (!s[mode]) continue;
    if (!offers(it, mode)) return 'kept out of this game: its author keeps it out of ' + MODE[mode];
    if (!allowed(t, it, mode)) return 'kept out of this game: not allowed in ' + MODE[mode] + ' (Manager, Plugins tab)';
  }
  return '';
}
const sig = (t, it) => [isOn(t,it), allowed(t,it,'ironman'), allowed(t,it,'mp')].join();
const isPending = it => sig(toml, it) !== sig(lastStart, it);
function hash(keys){ let h = 2166136261; for (const c of keys.join('|')){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; } return h.toString(16).padStart(8,'0'); }

// ---- shared bits ---------------------------------------------------------------------
function cb(label, on, act, key, extra = {}){
  const dis = extra.disabled ? ' dis' : '';
  return `<span class="cb${on ? ' on' : ''}${dis}" role="checkbox" aria-checked="${on}" tabindex="0" title="${esc(extra.title || '')}"
    ${extra.disabled ? 'aria-disabled="true"' : `data-act="${act}" data-key="${esc(key)}" ${extra.mode ? `data-mode="${extra.mode}"` : ''}`}>
    <span class="box"></span>${label ? esc(label) : ''}</span>`;
}
const tag = it => it.gameplay ? '<span class="tag">changes the game</span>' : '';
const pend = it => isPending(it) ? '<span class="pending">&#9679; at the next start</span>' : '';
const POLICY = 'Plugins and modules that <b>change the game</b> are kept out of ironman and multiplayer games unless you allow them there.';
function stateWord(it){
  if (!pluginOn(toml, it.plugin)) return it.mod ? '<span class="weak">off with its plugin</span>' : '<span class="weak">off</span>';
  if (!isOn(toml, it)) return '<span class="weak">off</span>';
  return '<span class="good">on</span>';
}

// ---- Variant A: one matrix table ------------------------------------------------------
function variantA(){
  let h = `<p class="weak" style="margin:0 0 8px">${POLICY} Changes apply at the next start.</p>
  <table class="im"><tr><th style="width:44px">On</th><th>Plugin / module</th><th style="width:80px">Version</th>
  <th style="width:82px">Ironman</th><th style="width:100px">Multiplayer</th><th style="width:170px">State</th><th style="width:150px"></th></tr>`;
  for (const it of items()){
    const p = it.plugin, on = isOn(toml, it), parentOff = it.mod && !pluginOn(toml, p);
    const opt = mode => {
      if (!it.gameplay) return '';
      if (!offers(it, mode)) return `<span class="dash" title="Its author keeps it out of ${MODE[mode]}.">&mdash;</span>`;
      return cb('', allowed(toml, it, mode), 'allow', it.key, {mode, disabled: !on, title: on ? '' : 'Turn it on first; your choice is kept.'});
    };
    h += `<tr class="${it.mod ? 'child' : ''}">
      <td>${p.standard && !it.mod ? cb('', true, '', '', {disabled:true, title:'Comes with Anvil.'}) : cb('', on, 'on', it.key, {disabled: parentOff, title: parentOff ? 'Its plugin is off.' : ''})}</td>
      <td class="${it.mod ? 'indent' : ''}">${it.mod ? '<span class="tree">&#9492;</span>' : ''}<span title="${esc(it.key)}">${esc(it.name)}</span>${tag(it)}
        ${!it.mod && p.modules.length ? `<span class="weak"> &middot; ${p.modules.length} modules</span>` : ''}
        ${it.mod ? `<div class="weak" style="font-size:12px;padding-left:16px">${esc(it.mod.desc)}</div>` : ''}</td>
      <td>${it.mod ? '' : esc(p.version)}</td>
      <td>${opt('ironman')}</td><td>${opt('mp')}</td>
      <td>${stateWord(it)} ${pend(it)}</td>
      <td style="white-space:nowrap">${expander(it.key, settingsOf(p.id, it.mod ? it.mod.id : null).length)} ${it.mod || p.standard ? '' : '<button class="small">Remove</button>'}</td></tr>`;
    if (ui.open.has(it.key)) h += `<tr class="${it.mod ? 'child' : ''}"><td></td><td colspan="6" class="${it.mod ? 'indent' : ''}">${settingsBlock(p.id, it.mod ? it.mod.id : null, !isOn(toml, it), offNoteFor(it))}</td></tr>`;
  }
  return h + '</table>';
}

// ---- Variant B: list and detail, one "where it runs" choice per module -----------------
function whereChoices(it){
  if (!it.gameplay) return [{k:'off', l:'Off'}, {k:'on', l:'On'}];
  return [
    {k:'off', l:'Off'}, {k:'normal', l:'Normal games'},
    {k:'im', l:'+ Ironman', need:['ironman']}, {k:'mp', l:'+ Multiplayer', need:['mp']},
    {k:'all', l:'Everywhere', need:['ironman','mp']},
  ];
}
function whereNow(it){
  if (!isOn(toml, it)) return 'off';
  if (!it.gameplay) return 'on';
  const i = allowed(toml, it, 'ironman'), m = allowed(toml, it, 'mp');
  return i && m ? 'all' : i ? 'im' : m ? 'mp' : 'normal';
}
function whereText(it){
  const w = whereNow(it);
  if (w === 'off') return 'Does not load.';
  if (!it.gameplay) return 'Runs in every game; it does not change the game.';
  const parts = {normal:'Runs in normal games. Kept out of ironman and multiplayer.',
    im:'Runs in normal and ironman games. Kept out of multiplayer.',
    mp:'Runs in normal and multiplayer games. Kept out of ironman.',
    all:'Runs in every game, ironman and multiplayer included.'};
  let t = parts[w];
  const locked = ['ironman','mp'].filter(m => !offers(it, m)).map(m => MODE[m]);
  if (locked.length) t += ` Its author keeps it out of ${locked.join(' and ')}.`;
  return t;
}
function segment(it, disabled){
  const cur = whereNow(it);
  return `<div class="seg" role="radiogroup">${whereChoices(it).map(c => {
    const missing = (c.need || []).filter(m => !offers(it, m));
    const dis = disabled || missing.length > 0;
    const title = disabled ? 'Its plugin is off.' : missing.length ? `Its author keeps it out of ${missing.map(m => MODE[m]).join(' and ')}.` : '';
    return `<button role="radio" aria-checked="${c.k === cur}" class="${c.k === cur ? 'cur' : ''}" ${dis ? 'disabled' : ''} title="${esc(title)}" data-act="where" data-key="${esc(it.key)}" data-where="${c.k}">${esc(c.l)}</button>`;
  }).join('')}</div>`;
}
function variantB(){
  const all = items();
  let list = '';
  for (const p of PLUGINS){
    const mods = all.filter(i => i.mod && i.plugin === p);
    const g = mods.filter(i => i.gameplay).length;
    const pi = all.find(i => i.key === p.id);
    const anyPending = all.some(i => i.plugin === p && isPending(i));
    const summary = mods.length ? `${mods.length} modules${g ? `, ${g} change the game` : ''}` : (p.gameplay ? 'changes the game' : 'does not change the game');
    list += `<div class="li ${ui.selected === p.id ? 'sel' : ''}" data-act="select" data-key="${p.id}">
      <div>${esc(p.name)} <span class="weak">${esc(p.version)}</span> <span style="float:right">${stateWord(pi)}</span></div>
      <div class="weak" style="font-size:12px">${summary}${anyPending ? ' &middot; <span class="pending">changes at the next start</span>' : ''}</div></div>`;
  }
  const p = PLUGINS.find(x => x.id === ui.selected), pi = all.find(i => i.key === p.id), pOn = pluginOn(toml, p);
  let d = `<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><div style="font-size:16px">${esc(p.name)} <span class="weak">${esc(p.version)} &middot; ${esc(p.id)}</span></div>
    <div>${p.standard ? '' : '<button class="small">Remove</button>'}</div></div>
    <div style="margin:8px 0">${p.standard ? '<span class="weak">Comes with Anvil; always loads.</span>' : cb('Load this plugin', pOn, 'on', p.id)} ${pend(pi)}</div>
    ${settingsOf(p.id, null).length ? `<div class="section">Settings</div>${settingsBlock(p.id, null, !pOn, 'The plugin is off; its settings are kept.')}` : ''}`;
  if (p.gameplay && !p.modules.length){
    d += `<div class="mod"><div style="margin-bottom:6px">Where it runs ${tag(pi)}</div>${segment(pi, !pOn)}<div class="weak" style="margin-top:4px">${whereText(pi)}</div></div>`;
  }
  if (p.modules.length){
    d += `<div class="section">Modules</div><p class="weak" style="margin:0 0 4px">${POLICY}</p>`;
    for (const it of all.filter(i => i.mod && i.plugin === p)){
      d += `<div class="mod"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span>${esc(it.name)}${tag(it)}</span>${pend(it)}</div>
        <div class="weak" style="font-size:12px;margin-bottom:6px">${esc(it.mod.desc)}</div>
        ${segment(it, !pOn)}<div class="weak" style="margin-top:4px;font-size:13px">${pOn ? whereText(it) : 'Off with its plugin.'}</div>
        ${settingsBlock(p.id, it.mod.id, !isOn(toml, it), offNoteFor(it))}</div>`;
    }
  }
  if (!p.gameplay && !p.modules.length) d += '<p class="weak">It does not change the game, so it runs in every game, ironman and multiplayer included.</p>';
  return `<div class="split"><div class="list">${list}</div><div class="detail">${d}</div></div>`;
}

// ---- Variant C: by game mode ----------------------------------------------------------
function variantC(){
  const all = items(), mode = ui.mode;
  const g = all.filter(i => i.gameplay);
  const runs = m => g.filter(i => isOn(toml, i) && offers(i, m) && allowed(toml, i, m)).length;
  const onCount = all.filter(i => isOn(toml, i)).length;
  let h = `<div class="modes" role="tablist">
    <button role="tab" class="${mode === 'normal' ? 'cur' : ''}" data-act="mode" data-key="normal">Normal games <span class="weak">&middot; ${onCount} on</span></button>
    <button role="tab" class="${mode === 'ironman' ? 'cur' : ''}" data-act="mode" data-key="ironman">Ironman <span class="weak">&middot; ${runs('ironman')} allowed</span></button>
    <button role="tab" class="${mode === 'mp' ? 'cur' : ''}" data-act="mode" data-key="mp">Multiplayer <span class="weak">&middot; ${runs('mp')} allowed</span></button></div>`;
  if (mode === 'normal'){
    h += `<p class="weak" style="margin:0 0 6px">What loads at the next start. Choose what may run in ironman and multiplayer in their tabs.</p>`;
    for (const it of all){
      const parentOff = it.mod && !pluginOn(toml, it.plugin);
      h += `<div class="row" style="${it.mod ? 'padding-left:26px' : ''}"><span class="nm">${it.plugin.standard && !it.mod ? cb(it.name, true, '', '', {disabled:true, title:'Comes with Anvil.'}) : cb(it.name, isOn(toml, it), 'on', it.key, {disabled: parentOff, title: parentOff ? 'Its plugin is off.' : ''})}${tag(it)}</span>
        <span class="weak" style="font-size:12px;flex:1">${it.mod ? esc(it.mod.desc) : esc(it.plugin.version)}</span>${pend(it)}${expander(it.key, settingsOf(it.plugin.id, it.mod ? it.mod.id : null).length)}</div>`;
      if (ui.open.has(it.key)) h += `<div style="padding-left:${it.mod ? 34 : 8}px">${settingsBlock(it.plugin.id, it.mod ? it.mod.id : null, !isOn(toml, it), offNoteFor(it))}</div>`;
    }
    return h;
  }
  const m = mode, word = MODE[m];
  h += `<p style="margin:0 0 6px">In ${word} games Anvil keeps out everything that changes the game, except what you allow here.</p>`;
  for (const it of g){
    const on = isOn(toml, it), path = it.mod ? `${esc(it.plugin.name)} <span class="weak">&rsaquo;</span> ${esc(it.name)}` : esc(it.name);
    let control, note;
    if (!offers(it, m)){ control = cb('', false, '', '', {disabled:true, title:`Its author keeps it out of ${word}.`}); note = `<span class="weak">its author keeps it out of ${word}</span>`; }
    else if (!on){ control = cb('', allowed(toml, it, m), '', '', {disabled:true, title:'Turn it on in Normal games first.'}); note = '<span class="weak">off in every game</span>'; }
    else { control = cb('', allowed(toml, it, m), 'allow', it.key, {mode:m}); note = allowed(toml, it, m) ? `<span class="good">runs in ${word}</span>` : `<span class="warn">kept out of ${word}</span>`; }
    h += `<div class="row"><span class="nm">${control} ${path}</span><span style="flex:1">${note}</span>${pend(it)}</div>`;
  }
  const quiet = all.filter(i => !i.gameplay && isOn(toml, i)).length;
  h += `<p class="weak" style="margin:8px 0 0">${quiet} plugins and modules that do not change the game run in ${word} too.</p>`;
  if (m === 'mp'){
    const acting = g.filter(i => isOn(toml, i) && offers(i, 'mp') && allowed(toml, i, 'mp')).map(i => i.key);
    h += `<div class="banner" style="margin-top:10px">Players in one game compare this code in the overlay: <b>${hash(acting)}</b>. It matches when everyone allows the same things.</div>`;
  }
  return h;
}

// ---- settings ----------------------------------------------------------------------------
const valKey = (pid, s) => pid + '/' + s.name;
const getVal = (pid, s, v = values) => valKey(pid, s) in v ? v[valKey(pid, s)] : s.def;
const setPending = (pid, s) => getVal(pid, s) !== getVal(pid, s, lastValues);
const settingsOf = (pid, moduleId) => (SETTINGS[pid] || []).filter(s => (s.module || null) === moduleId);
function control(pid, s, disabled){
  const v = getVal(pid, s), k = esc(valKey(pid, s)), dis = disabled ? 'disabled' : '';
  let c;
  if (s.type === 'bool') c = cb(s.label, v, 'set', valKey(pid, s), {disabled});
  else if (s.type === 'enum') c = `<select data-set="${k}" ${dis}>${s.values.map(([n, l]) => `<option value="${n}" ${n === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select> <span>${esc(s.label)}</span>`;
  else c = `<input type="${s.type === 'int' ? 'number' : 'text'}" data-set="${k}" value="${esc(v)}" ${dis}> <span>${esc(s.label)}</span>`;
  return `<div class="set">${c}${setPending(pid, s) ? '<span class="pending">&#9679; at the next start</span>' : ''}</div>`;
}
function settingsBlock(pid, moduleId, disabled, offNote){
  const list = settingsOf(pid, moduleId);
  if (!list.length) return '';
  return `<div class="setbox">${disabled && offNote ? `<div class="weak" style="font-size:12px">${offNote}</div>` : ''}${list.map(s => control(pid, s, disabled)).join('')}</div>`;
}
function expander(key, count){
  if (!count) return '';
  return `<button class="expander" data-act="toggle" data-key="${esc(key)}">${ui.open.has(key) ? '&#9662;' : '&#9656;'} Settings (${count})</button>`;
}
const offNoteFor = it => !pluginOn(toml, it.plugin) ? 'Its plugin is off; these settings are kept.' : `${esc(it.name)} is off; its settings are kept and apply when you turn it on.`;

// The Settings tab. Today: a plugin picker and its settings by `group`, unrelated to modules.
// Proposed: the plugin's own settings first, then a section per module with its state.
function settingsTab(today){
  const pid = ui.settingsPlugin, p = PLUGINS.find(x => x.id === pid);
  let h = `<div class="set"><select data-act-select="plugin">${PLUGINS.filter(x => SETTINGS[x.id]).map(x => `<option value="${x.id}" ${x.id === pid ? 'selected' : ''}>${esc(x.id)}</option>`).join('')}</select> Plugin</div>`;
  if (today){
    let group = null;
    const list = [...SETTINGS[pid]].sort((a, b) => (a.group ? 1 : 0) - (b.group ? 1 : 0));
    for (const s of list){
      if (s.group !== group){ group = s.group; if (group) h += `<div class="sep">${esc(group)}</div>`; }
      h += control(pid, s, false);
    }
    return h + '<p class="weak">Plugins with a settings.toml can be set up here. The values go to anvil/data/&lt;plugin&gt;/settings.toml and apply when the game starts.</p>';
  }
  h += settingsBlock(pid, null, !pluginOn(toml, p), 'The plugin is off; its settings are kept.');
  for (const it of items().filter(i => i.mod && i.plugin === p)){
    if (!settingsOf(pid, it.mod.id).length) continue;
    h += `<div class="sep">${esc(it.name)} ${tag(it)} ${stateWord(it)}</div>` + settingsBlock(pid, it.mod.id, !isOn(toml, it), offNoteFor(it));
  }
  return h;
}

// ---- Variant 0: the Manager as it is today (manager_app.cpp, draw_plugins_tab / draw_modules) ----
function todaySummary(it){
  const label = `${it.name} (${it.key})`;
  if (!it.gameplay) return `${label}: does not change the game.`;
  if (it.ironman && it.mp) return `${label}: changes the game; you can allow it in ironman and multiplayer.`;
  if (it.ironman) return `${label}: changes the game; you can allow it in ironman, not in multiplayer.`;
  if (it.mp) return `${label}: changes the game; you can allow it in multiplayer, not in ironman.`;
  return `${label}: changes the game; suspended in ironman and multiplayer.`;
}
function todayOptIns(it){
  let h = '';
  if (it.ironman) h += cb('Allow in ironman', allowed(toml, it, 'ironman'), 'allow', it.key, {mode:'ironman'}) + ' ';
  if (it.mp) h += cb('Allow in multiplayer', allowed(toml, it, 'mp'), 'allow', it.key, {mode:'mp'});
  return h;
}
function variant0(){
  let h = `<table class="im"><tr><th style="width:30px"></th><th style="width:22%">Plugin</th><th style="width:70px">Version</th><th>Status</th><th style="width:150px"></th></tr>`;
  for (const p of PLUGINS){
    const pi = items().find(i => i.key === p.id), on = pluginOn(toml, p);
    let status = on ? '<div class="good">loads</div>' : '<div class="weak">disabled</div>';
    if (p.gameplay){
      status += '<div class="weak">Changes the game: kept out of ironman and multiplayer unless allowed.</div>';
      status += `<div>${todayOptIns(pi)}</div>`;
    }
    for (const it of items().filter(i => i.mod && i.plugin === p)){
      const mon = isOn(toml, it);
      status += `<div style="display:flex;gap:6px;align-items:flex-start;margin-top:3px">${cb('', mon, 'on', it.key)}<span>${esc(todaySummary(it))}</span></div>`;
      if (mon && it.gameplay && (it.ironman || it.mp)) status += `<div style="padding-left:24px">${todayOptIns(it)}</div>`;
    }
    h += `<tr><td>${p.standard ? cb('', true, '', '', {disabled:true}) : cb('', on, 'on', p.id)}</td>
      <td><span title="id ${esc(p.id)}">${esc(p.name)}</span>${p.standard ? ' <span class="weak">(comes with Anvil)</span>' : ''}</td>
      <td>${esc(p.version)}</td><td>${status}</td>
      <td style="white-space:nowrap">${SETTINGS[p.id] ? `<button class="small" data-act="opensettings" data-key="${p.id}">Settings</button>` : ''} ${p.standard ? '' : '<button class="small">Remove</button>'}</td></tr>`;
  }
  return h + '</table>';
}

// ---- overlay preview, anvil.toml, pending ---------------------------------------------
function overlay(){
  const v = document.getElementById('session').value;
  const s = {ironman: v === 'im' || v === 'immp', mp: v === 'mp' || v === 'immp'};
  const acting = items().filter(i => i.gameplay && isOn(toml, i) && !keptOut(toml, i, s));
  const name = s.ironman && s.mp ? 'an ironman multiplayer game' : s.ironman ? 'an ironman game' : s.mp ? 'a multiplayer game' : 'a single-player game';
  let h = `<div style="margin-bottom:6px">In ${name}; ${acting.length ? `${acting.length} plugin(s) or module(s) that change the game act (${hash(acting.map(i => i.key))}).` : 'nothing that changes the game acts.'}</div>
    <table class="im"><tr><th>Plugin / module</th><th style="width:80px">Version</th><th style="width:160px">State</th><th>Details</th></tr>`;
  const today = variant === '0';
  for (const it of items()){
    let st, det = it.gameplay ? 'changes the game' : '';
    if (!isOn(toml, it)) st = today ? '<span class="weak">disabled</span>' : '<span class="weak">off</span>';
    else if (keptOut(toml, it, s)){
      if (today){ st = '<span class="good">loaded</span>'; det = 'suspended in this game; changes the game'; }
      else { st = '<span class="warn">kept out</span>'; det = keptOut(toml, it, s); }
    }
    else st = '<span class="good">loaded</span>';
    h += `<tr class="${it.mod ? 'child' : ''}"><td class="${it.mod ? 'indent' : ''}">${it.mod ? '<span class="tree">&#9492;</span>' : ''}${esc(it.name)}</td><td>${it.mod ? '' : esc(it.plugin.version)}</td><td>${st}</td><td>${esc(det)}</td></tr>`;
  }
  return h + '</table>';
}
function tomlText(){
  return '# anvil/anvil.toml (the lists the Manager writes)\n' + LISTS.map(l => {
    const changed = JSON.stringify([...toml[l]].sort()) !== JSON.stringify([...lastStart[l]].sort());
    const line = `${l} = [${toml[l].map(x => `"${x}"`).join(', ')}]`;
    return changed ? `<span class="chg">${esc(line)}   # changed since the last start</span>` : esc(line);
  }).join('\n');
}
function pendingBar(){
  const changedSettings = PLUGINS.flatMap(p => (SETTINGS[p.id] || []).filter(s => setPending(p.id, s)));
  const n = items().filter(isPending).length + changedSettings.length;
  if (!n || variant === '0') return '';
  return `<div class="banner"><span class="info">&#9679;</span><span>${n} change(s) apply at the next start of EU4.</span><span style="flex:1"></span><button class="small" data-act="undo">Undo changes</button></div>`;
}

// ---- wiring and the variant bar -------------------------------------------------------
const VARIANTS = {'0':['Today', variant0], A:['Matrix table', variantA], B:['List and detail, one choice per module', variantB], C:['By game mode', variantC]};
const KEYS = ['0', 'A', 'B', 'C'];
let variant = (new URLSearchParams(location.search).get('variant') || '0').toUpperCase();
if (!VARIANTS[variant]) variant = '0';

function render(){
  const TABS = ['Anvil', 'Catalog', 'Plugins', 'Mods', 'Settings', 'Benchmark', 'Crashes', 'Log', 'About'];
  document.getElementById('tabs').innerHTML = TABS.map(t => `<span class="tab ${ui.tab === t.toLowerCase() ? 'cur' : ''}" ${t === 'Plugins' || t === 'Settings' ? `data-act="tab" data-key="${t.toLowerCase()}"` : ''}>${t}</span>`).join('');
  document.getElementById('pending').innerHTML = pendingBar();
  document.getElementById('variant').innerHTML = ui.tab === 'settings' ? settingsTab(variant === '0') : VARIANTS[variant][1]();
  document.getElementById('overlay').innerHTML = overlay();
  document.getElementById('toml').innerHTML = tomlText();
  document.getElementById('switcher').innerHTML = `<button data-act="prev" aria-label="Previous variant">&larr;</button>
    <span class="lbl">${variant} (${esc(VARIANTS[variant][0])})</span><button data-act="next" aria-label="Next variant">&rarr;</button>`;
}
function go(step){
  variant = KEYS[(KEYS.indexOf(variant) + step + KEYS.length) % KEYS.length];
  const u = new URL(location.href); u.searchParams.set('variant', variant); history.replaceState(null, '', u);
  render();
}
function act(el){
  const a = el.dataset.act, k = el.dataset.key;
  if (a === 'prev') return go(-1);
  if (a === 'next') return go(1);
  if (a === 'on'){ const it = item(k); setOn(it, !isOn(toml, it)); }
  else if (a === 'allow'){ const it = item(k), m = el.dataset.mode; setAllowed(it, m, !allowed(toml, it, m)); }
  else if (a === 'where'){
    const it = item(k), w = el.dataset.where;
    if (w === 'off') setOn(it, false);
    else { setOn(it, true); if (it.gameplay){ setAllowed(it, 'ironman', w === 'im' || w === 'all'); setAllowed(it, 'mp', w === 'mp' || w === 'all'); } }
  }
  else if (a === 'select') ui.selected = k;
  else if (a === 'mode') ui.mode = k;
  else if (a === 'tab') ui.tab = k;
  else if (a === 'opensettings'){ ui.tab = 'settings'; ui.settingsPlugin = k; }
  else if (a === 'toggle'){ ui.open.has(k) ? ui.open.delete(k) : ui.open.add(k); }
  else if (a === 'set'){ const [pid, name] = k.split('/'); const s = SETTINGS[pid].find(x => x.name === name); values[k] = !getVal(pid, s); }
  else if (a === 'undo'){ toml = JSON.parse(JSON.stringify(lastStart)); values = {...lastValues}; }
  else if (a === 'start'){ lastStart = JSON.parse(JSON.stringify(toml)); lastValues = {...values}; }
  else return;
  render();
}
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.actSelect === 'plugin'){ ui.settingsPlugin = t.value; return render(); }
  if (t.dataset.set){
    const [pid, name] = t.dataset.set.split('/'), s = SETTINGS[pid].find(x => x.name === name);
    values[t.dataset.set] = s.type === 'int' ? Number(t.value) : t.value;
    render();
  }
});
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && !el.disabled) act(el); });
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.matches && t.matches('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === 'ArrowRight') go(1);
  else if ((e.key === ' ' || e.key === 'Enter') && t.dataset && t.dataset.act){ e.preventDefault(); act(t); }
});
document.getElementById('session').addEventListener('change', render);
render();
</script>
</body>
</html>
