<!doctype html>
<!--
  PROTOTYPE, throwaway (branch prototype/module-switches; never merge to main).
  Question: what should module switches, ironman / multiplayer opt-ins and plugin settings look like,
  in the Manager and in the in-game overlay?
  Variant 0 is Anvil 1.22 as it is today (manager_app.cpp, anvil-overlay ui.cpp); A, B and C are proposals in which
  both apps draw the same model the same way. Switch via ?variant=0|A|B|C, the bar at the bottom, or the arrow keys.
  "Start EU4" starts a pretend game: the overlay appears, the Manager turns read-only (as it does today), settings
  with restart = false apply at once and everything else waits for the next start.
  A, B and C tie settings to modules with a new optional `module` key in settings.toml (today there is only `group`).
  The real apps are Dear ImGui; this page imitates their dark style. Plugins, modules and settings are read from
  the team's plugin.toml and settings.toml files (anvil standard plugins, Bellows, Smithy, Whetstone, Sieve, Hoard,
  Lodestone, Mei, Tongs); versions are the checkouts', not releases.
-->

const valKey = (pid, s) => pid + '/' + s.name;
const getVal = (pid, s, v = values) => valKey(pid, s) in v ? v[valKey(pid, s)] : s.def;
const setPending = (pid, s) => getVal(pid, s) !== getVal(pid, s, lastValues);
const settingsOf = (pid, moduleId) => (SETTINGS[pid] || []).filter(s => (s.module || null) === moduleId);
const show = v => v === true ? 'on' : v === false ? 'off' : String(v);
const pendingCount = () => items().filter(isPending).length + PLUGINS.flatMap(p => (SETTINGS[p.id] || []).filter(s => setPending(p.id, s))).length;

// ---- shared bits ---------------------------------------------------------------------
function cb(label, on, act, key, extra = {}){
  const dis = extra.disabled ? ' dis' : '';
  return `<span class="cb${on ? ' on' : ''}${dis}" role="checkbox" aria-checked="${on}" tabindex="0" title="${esc(extra.title || '')}"
    ${extra.disabled ? 'aria-disabled="true"' : `data-act="${act}" data-key="${esc(key)}" ${extra.mode ? `data-mode="${extra.mode}"` : ''}`}>
    <span class="box"></span>${label ? esc(label) : ''}</span>`;
}
const help = d => d ? `<span class="help" title="${esc(d)}">(?)</span>` : '';
const tag = it => it.gameplay ? '<span class="tag">changes the game</span>' : '';
const pend = it => isPending(it) ? '<span class="pending">&#9679; at the next start</span>' : '';
const POLICY = 'Plugins and modules that <b>change the game</b> are kept out of ironman and multiplayer games unless you allow them there.';
const inGame = () => CTX === 'overlay';
// Manager: what the next start does. Overlay: what this game does, plus what changes at the next start.
function stateWord(it){
  if (inGame()){
    if (!isOn(lastStart, it)) return '<span class="weak">off in this game</span>';
    const r = keptOut(lastStart, it, SESSION);
    return r ? `<span class="warn">kept out of this game</span><div class="weak" style="font-size:12px">${r}</div>` : '<span class="good">on in this game</span>';
  }
  if (!pluginOn(toml, it.plugin)) return it.mod ? '<span class="weak">off with its plugin</span>' : '<span class="weak">off</span>';
  return isOn(toml, it) ? '<span class="good">on</span>' : '<span class="weak">off</span>';
}
const removeBtn = p => !inGame() && !p.standard ? '<button class="small">Remove</button>' : '';

// One setting, the same in both apps (proposal).
function control(pid, s, disabled){
  const v = getVal(pid, s), k = esc(valKey(pid, s)), dis = disabled ? 'disabled' : '';
  let c;
  if (s.type === 'bool') c = cb(s.label, v, 'set', valKey(pid, s), {disabled});
  else if (s.type === 'enum') c = `<select data-set="${k}" ${dis}>${s.values.map(([n, l]) => `<option value="${n}" ${n === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select> <span>${esc(s.label)}</span>`;
  else c = `<input type="${s.type === 'int' ? 'number' : 'text'}" data-set="${k}" value="${esc(v)}" ${dis}> <span>${esc(s.label)}</span>`;
  const p = setPending(pid, s) ? `<span class="pending">&#9679; at the next start${running ? ` (now ${esc(show(getVal(pid, s, lastValues)))})` : ''}</span>` : '';
  const when = `<span class="weak" style="font-size:12px">${s.restart ? 'next start' : 'applies at once'}</span>`;
  const reset = v !== s.def && !disabled ? `<button class="small" data-act="reset" data-key="${k}">Reset</button>` : '';
  return `<div class="set">${c}${help(s.desc)}${p || when}${reset}</div>`;
}
function settingsBlock(pid, moduleId, disabled, offNote){
  const list = settingsOf(pid, moduleId);
  if (!list.length) return '';
  return `<div class="setbox">${disabled && offNote ? `<div class="weak" style="font-size:12px">${offNote}</div>` : ''}${list.map(s => control(pid, s, disabled)).join('')}</div>`;
}
const openKey = key => CTX + ':' + key;
function expander(key, count){
  if (!count) return '';
  return `<button class="expander" data-act="toggle" data-key="${esc(openKey(key))}">${ui.open.has(openKey(key)) ? '&#9662;' : '&#9656;'} Settings (${count})</button>`;
}
const offNoteFor = it => !pluginOn(toml, it.plugin) ? 'Its plugin is off; these settings are kept.' : `${esc(it.name)} is off; its settings are kept and apply when you turn it on.`;

// ---- Variant 0: Anvil 1.22 as it is today -------------------------------------------------
// Manager, Plugins tab (manager_app.cpp: draw_plugins_tab, draw_modules, module_summary).
function todaySummary(it){
  const label = `${it.name} (${it.key})`;
  if (!it.gameplay) return `${label}: does not change the game.`;
  if (it.ironman && it.mp) return `${label}: changes the game; you can allow it in ironman and multiplayer.`;
  if (it.ironman) return `${label}: changes the game; you can allow it in ironman, not in multiplayer.`;
  if (it.mp) return `${label}: changes the game; you can allow it in multiplayer, not in ironman.`;
  return `${label}: changes the game; suspended in ironman and multiplayer.`;
}
function todayOptIns(it){
  let h = '';
  if (it.ironman) h += cb('Allow in ironman', allowed(toml, it, 'ironman'), 'allow', it.key, {mode:'ironman'}) + ' ';
  if (it.mp) h += cb('Allow in multiplayer', allowed(toml, it, 'mp'), 'allow', it.key, {mode:'mp'});
  return h;
}
function variant0(){
  let h = `<table class="im"><tr><th style="width:30px"></th><th style="width:22%">Plugin</th><th style="width:70px">Version</th><th>Status</th><th style="width:150px"></th></tr>`;
  for (const p of PLUGINS){
    const pi = item(p.id), on = pluginOn(toml, p);
    let status = on ? '<div class="good">loads</div>' : '<div class="weak">disabled</div>';
    if (p.gameplay) status += '<div class="weak">Changes the game: kept out of ironman and multiplayer unless allowed.</div>' + `<div>${todayOptIns(pi)}</div>`;
    for (const it of items().filter(i => i.mod && i.plugin === p)){
      const mon = isOn(toml, it);
      status += `<div style="display:flex;gap:6px;align-items:flex-start;margin-top:3px">${cb('', mon, 'on', it.key)}<span>${esc(todaySummary(it))}</span></div>`;
      if (mon && it.gameplay && (it.ironman || it.mp)) status += `<div style="padding-left:24px">${todayOptIns(it)}</div>`;
    }
    h += `<tr><td>${p.standard ? cb('', true, '', '', {disabled:true}) : cb('', on, 'on', p.id)}</td>
      <td><span title="id ${esc(p.id)}">${esc(p.name)}</span>${p.standard ? ' <span class="weak">(comes with Anvil)</span>' : ''}</td>
      <td>${esc(p.version)}</td><td>${status}</td>
      <td style="white-space:nowrap">${SETTINGS[p.id] ? `<button class="small" data-act="opensettings" data-key="${p.id}">Settings</button>` : ''} ${removeBtn(p)}</td></tr>`;
  }
  return h + '</table>';
}
// Manager, Settings tab (draw_settings_tab): a plugin picker, its settings under `group` headers.
function todayGroups(pid, draw){
  let h = '', group = null;
  const list = [...SETTINGS[pid]].sort((a, b) => (a.group ? 1 : 0) - (b.group ? 1 : 0));
  for (const s of list){
    if (s.group !== group){ group = s.group; if (group) h += `<div class="sep">${esc(group)}</div>`; }
    h += draw(s);
  }
  return h;
}
function todayManagerSettings(){
  const pid = ui.settingsPlugin;
  return `<div class="set"><select data-pick="manager">${PLUGINS.filter(x => SETTINGS[x.id]).map(x => `<option value="${x.id}" ${x.id === pid ? 'selected' : ''}>${esc(x.id)}</option>`).join('')}</select> Plugin</div>`
    + todayGroups(pid, s => todayControl(pid, s, false))
    + '<p class="weak">Plugins with a settings.toml can be set up here. The values go to anvil/data/&lt;plugin&gt;/settings.toml and apply when the game starts.</p>';
}
// One setting as both apps draw it today: control, (?) help, "(now X; applies at the next start)", Reset.
function todayControl(pid, s){
  const v = getVal(pid, s), k = esc(valKey(pid, s));
  let c;
  if (s.type === 'bool') c = cb(s.label, v, 'set', valKey(pid, s));
  else if (s.type === 'enum') c = `<select data-set="${k}">${s.values.map(([n, l]) => `<option value="${n}" ${n === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select> <span>${esc(s.label)}</span>`;
  else if (s.type === 'key' && inGame()) c = `<button class="small" style="min-width:12em">${esc(v)}</button> <span>${esc(s.label)}</span> <button class="small">Clear</button>`;
  else c = `<input type="${s.type === 'int' ? 'number' : 'text'}" data-set="${k}" value="${esc(v)}"> <span>${esc(s.label)}</span>`;
  const now = inGame() && s.restart && setPending(pid, s) ? `<span class="weak">(now ${esc(show(getVal(pid, s, lastValues)))}; applies at the next start)</span>` : '';
  const reset = inGame() && v !== s.def ? `<button class="small" data-act="reset" data-key="${k}">Reset</button>` : '';
  return `<div class="set">${c}${help(s.desc)}${now}${reset}</div>`;
}
// Overlay, Status tab (draw_status): the modules are rows to read, not to switch.
function todayOverlayStatus(){
  const g = lastStart, s = SESSION;
  const acting = items().filter(i => i.gameplay && isOn(g, i) && !keptOut(g, i, s));
  const kind = s.ironman && s.mp ? 'an ironman multiplayer game' : s.ironman ? 'an ironman game' : s.mp ? 'a multiplayer game' : 'a single-player game';
  const loaded = PLUGINS.filter(p => pluginOn(g, p)).length;
  let h = `<div>Anvil 1.22.0, game build 1.37.5.0</div>
    <div>In ${kind}; ${acting.length ? `${acting.length} gameplay plugin(s) act (${hash(acting.map(i => i.key))}).` : 'no gameplay plugin acts.'}</div>
    <div style="margin-bottom:6px">${loaded} loaded, 0 failed, 0 skipped</div>
    <table class="im"><tr><th>Plugin</th><th style="width:70px">Version</th><th style="width:80px">State</th><th>Details</th><th style="width:150px">Next start</th></tr>`;
  for (const it of items()){
    const on = isOn(g, it);
    const st = on ? '<span class="good">loaded</span>' : '<span class="warn">disabled</span>';
    const det = [on && keptOut(g, it, s) ? 'suspended in this game' : '', it.gameplay ? 'changes the game' : ''].filter(Boolean).join('; ');
    let next = '';
    if (!it.mod) next = has(toml, 'disabled_plugins', it.key) ? '<span class="weak">disabled</span>' : `<button class="small" data-act="disablenext" data-key="${it.key}">Disable at next start</button>`;
    h += `<tr class="${it.mod ? 'child' : ''}"><td class="${it.mod ? 'indent' : ''}">${esc(it.mod ? it.key : it.plugin.id)}</td><td>${it.mod ? '' : esc(it.plugin.version)}</td><td>${st}</td><td>${esc(det)}</td><td>${next}</td></tr>`;
  }
  return h + '</table>';
}
// Overlay, Settings tab (draw_settings): plugin ids on the left, the editor on the right.
function todayOverlaySettings(){
  const pid = ui.osettings;
  const list = PLUGINS.filter(p => SETTINGS[p.id]).map(p => `<div class="li ${p.id === pid ? 'sel' : ''}" data-act="opick" data-key="${p.id}">${esc(p.id)}</div>`).join('');
  return `<div class="split"><div class="list">${list}</div><div class="detail">${todayGroups(pid, s => todayControl(pid, s))}</div></div>
    <div class="weak" style="margin-top:6px">Values are saved in anvil\\data\\${esc(pid)}\\settings.toml.</div>`;
}

// ---- Variant A: one matrix table -------------------------------------------------------
function variantA(){
  let h = `<p class="weak" style="margin:0 0 8px">${POLICY} ${inGame() ? 'Switches apply at the next start; settings marked "applies at once" apply now.' : 'Changes apply at the next start.'}</p>
  <table class="im"><tr><th style="width:44px">On</th><th>Plugin / module</th><th style="width:70px">Version</th>
  <th style="width:76px">Ironman</th><th style="width:96px">Multiplayer</th><th style="width:170px">${inGame() ? 'This game' : 'State'}</th><th style="width:150px"></th></tr>`;
  for (const it of items()){
    const p = it.plugin, on = isOn(toml, it), parentOff = it.mod && !pluginOn(toml, p);
    const opt = mode => {
      if (!it.gameplay) return '';
      if (!offers(it, mode)) return `<span class="dash" title="Its author keeps it out of ${MODE[mode]}.">&mdash;</span>`;
      return cb('', allowed(toml, it, mode), 'allow', it.key, {mode, disabled: !on, title: on ? '' : 'Turn it on first; your choice is kept.'});
    };
    h += `<tr class="${it.mod ? 'child' : ''}">
      <td>${p.standard && !it.mod ? cb('', true, '', '', {disabled:true, title:'Comes with Anvil.'}) : cb('', on, 'on', it.key, {disabled: parentOff, title: parentOff ? 'Its plugin is off.' : ''})}</td>
      <td class="${it.mod ? 'indent' : ''}">${it.mod ? '<span class="tree">&#9492;</span>' : ''}<span title="${esc(it.key)}">${esc(it.name)}</span>${tag(it)}
        ${!it.mod && p.modules.length ? `<span class="weak"> &middot; ${p.modules.length} modules</span>` : ''}
        ${it.mod ? `<div class="weak" style="font-size:12px;padding-left:16px">${esc(it.mod.desc)}</div>` : ''}</td>
      <td>${it.mod ? '' : esc(p.version)}</td>
      <td>${opt('ironman')}</td><td>${opt('mp')}</td>
      <td>${stateWord(it)} ${pend(it)}</td>
      <td style="white-space:nowrap">${expander(it.key, settingsOf(p.id, it.mod ? it.mod.id : null).length)} ${it.mod ? '' : removeBtn(p)}</td></tr>`;
    if (ui.open.has(openKey(it.key))) h += `<tr class="${it.mod ? 'child' : ''}"><td></td><td colspan="6" class="${it.mod ? 'indent' : ''}">${settingsBlock(p.id, it.mod ? it.mod.id : null, !isOn(toml, it), offNoteFor(it))}</td></tr>`;
  }
  return h + '</table>';
}

// ---- Variant B: list and detail, one "where it runs" choice per module -----------------
function whereChoices(it){
  if (!it.gameplay) return [{k:'off', l:'Off'}, {k:'on', l:'On'}];
  return [{k:'off', l:'Off'}, {k:'normal', l:'Normal games'}, {k:'im', l:'+ Ironman', need:['ironman']},
          {k:'mp', l:'+ Multiplayer', need:['mp']}, {k:'all', l:'Everywhere', need:['ironman','mp']}];
}
function whereNow(it){
  if (!isOn(toml, it)) return 'off';
  if (!it.gameplay) return 'on';
  const i = allowed(toml, it, 'ironman'), m = allowed(toml, it, 'mp');
  return i && m ? 'all' : i ? 'im' : m ? 'mp' : 'normal';
}
function whereText(it){
  const w = whereNow(it);
  if (w === 'off') return 'Does not load.';
  if (!it.gameplay) return 'Runs in every game; it does not change the game.';
  let t = {normal:'Runs in normal games. Kept out of ironman and multiplayer.', im:'Runs in normal and ironman games. Kept out of multiplayer.',
           mp:'Runs in normal and multiplayer games. Kept out of ironman.', all:'Runs in every game, ironman and multiplayer included.'}[w];
  const locked = ['ironman','mp'].filter(m => !offers(it, m)).map(m => MODE[m]);
  if (locked.length) t += ` Its author keeps it out of ${locked.join(' and ')}.`;
  return t;
}
function segment(it, disabled){
  const cur = whereNow(it);
  return `<div class="seg" role="radiogroup">${whereChoices(it).map(c => {
    const missing = (c.need || []).filter(m => !offers(it, m)), dis = disabled || missing.length > 0;
    const title = disabled ? 'Its plugin is off.' : missing.length ? `Its author keeps it out of ${missing.map(m => MODE[m]).join(' and ')}.` : '';
    return `<button role="radio" aria-checked="${c.k === cur}" class="${c.k === cur ? 'cur' : ''}" ${dis ? 'disabled' : ''} title="${esc(title)}" data-act="where" data-key="${esc(it.key)}" data-where="${c.k}">${esc(c.l)}</button>`;
  }).join('')}</div>`;
}
function variantB(){
  const all = items(), sel = inGame() ? ui.oselected : ui.selected;
  let list = '';
  for (const p of PLUGINS){
    const mods = all.filter(i => i.mod && i.plugin === p), g = mods.filter(i => i.gameplay).length;
    const anyPending = all.some(i => i.plugin === p && isPending(i)) || (SETTINGS[p.id] || []).some(s => setPending(p.id, s));
    const summary = mods.length ? `${mods.length} modules${g ? `, ${g} change the game` : ''}` : (p.gameplay ? 'changes the game' : 'does not change the game');
    list += `<div class="li ${sel === p.id ? 'sel' : ''}" data-act="select" data-key="${CTX}:${p.id}">
      <div>${esc(p.name)} <span class="weak">${esc(p.version)}</span> <span style="float:right">${stateWord(item(p.id))}</span></div>
      <div class="weak" style="font-size:12px;clear:both">${summary}${anyPending ? ' &middot; <span class="pending">changes at the next start</span>' : ''}</div></div>`;
  }
  const p = PLUGINS.find(x => x.id === sel), pi = item(p.id), pOn = pluginOn(toml, p);
  let d = `<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><div style="font-size:16px">${esc(p.name)} <span class="weak">${esc(p.version)} &middot; ${esc(p.id)}</span></div><div>${removeBtn(p)}</div></div>
    <div style="margin:8px 0">${p.standard ? '<span class="weak">Comes with Anvil; always loads.</span>' : cb('Load this plugin', pOn, 'on', p.id)} ${pend(pi)}</div>
    ${settingsOf(p.id, null).length ? `<div class="section">Settings</div>${settingsBlock(p.id, null, !pOn, 'The plugin is off; its settings are kept.')}` : ''}`;
  if (p.gameplay && !p.modules.length) d += `<div class="mod"><div style="margin-bottom:6px">Where it runs ${tag(pi)}</div>${segment(pi, !pOn)}<div class="weak" style="margin-top:4px">${whereText(pi)}</div>${inGame() ? `<div style="margin-top:4px">${stateWord(pi)}</div>` : ''}</div>`;
  if (p.modules.length){
    d += `<div class="section">Modules</div><p class="weak" style="margin:0 0 4px">${POLICY}</p>`;
    for (const it of all.filter(i => i.mod && i.plugin === p)){
      d += `<div class="mod"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span>${esc(it.name)}${tag(it)}</span><span>${inGame() ? stateWord(it) : ''} ${pend(it)}</span></div>
        <div class="weak" style="font-size:12px;margin-bottom:6px">${esc(it.mod.desc)}</div>
        ${segment(it, !pOn)}<div class="weak" style="margin-top:4px;font-size:13px">${pOn ? whereText(it) : 'Off with its plugin.'}</div>
        ${settingsBlock(p.id, it.mod.id, !isOn(toml, it), offNoteFor(it))}</div>`;
    }
  }
  if (!p.gameplay && !p.modules.length && !settingsOf(p.id, null).length) d += '<p class="weak">It does not change the game, so it runs in every game, ironman and multiplayer included.</p>';
  return `<div class="split"><div class="list">${list}</div><div class="detail">${d}</div></div>`;
}

// ---- Variant C: by game mode ----------------------------------------------------------
function variantC(){
  const all = items(), mode = inGame() ? ui.omode : ui.mode, g = all.filter(i => i.gameplay);
  const runs = m => g.filter(i => isOn(toml, i) && offers(i, m) && allowed(toml, i, m)).length;
  const thisGame = m => inGame() && ((m === 'normal' && !SESSION.ironman && !SESSION.mp) || (m === 'ironman' && SESSION.ironman) || (m === 'mp' && SESSION.mp)) ? ' &middot; <b>this game</b>' : '';
  const tabBtn = (m, label, extra) => `<button role="tab" class="${mode === m ? 'cur' : ''}" data-act="mode" data-key="${CTX}:${m}">${label} <span class="weak">&middot; ${extra}</span>${thisGame(m)}</button>`;
  let h = `<div class="modes" role="tablist">${tabBtn('normal', 'Normal games', all.filter(i => isOn(toml, i)).length + ' on')}${tabBtn('ironman', 'Ironman', runs('ironman') + ' allowed')}${tabBtn('mp', 'Multiplayer', runs('mp') + ' allowed')}</div>`;
  if (mode === 'normal'){
    h += `<p class="weak" style="margin:0 0 6px">What loads at the next start, and the settings of each. Choose what may run in ironman and multiplayer in their tabs.</p>`;
    for (const it of all){
      const parentOff = it.mod && !pluginOn(toml, it.plugin);
      h += `<div class="row" style="${it.mod ? 'padding-left:26px' : ''}"><span class="nm">${it.plugin.standard && !it.mod ? cb(it.name, true, '', '', {disabled:true, title:'Comes with Anvil.'}) : cb(it.name, isOn(toml, it), 'on', it.key, {disabled: parentOff, title: parentOff ? 'Its plugin is off.' : ''})}${tag(it)}</span>
        <span class="weak" style="font-size:12px;flex:1">${it.mod ? esc(it.mod.desc) : esc(it.plugin.version)}</span>${inGame() ? stateWord(it) : ''}${pend(it)}${expander(it.key, settingsOf(it.plugin.id, it.mod ? it.mod.id : null).length)}</div>`;
      if (ui.open.has(openKey(it.key))) h += `<div style="padding-left:${it.mod ? 34 : 8}px">${settingsBlock(it.plugin.id, it.mod ? it.mod.id : null, !isOn(toml, it), offNoteFor(it))}</div>`;
    }
    return h;
  }
  const word = MODE[mode];
  h += `<p style="margin:0 0 6px">In ${word} games Anvil keeps out everything that changes the game, except what you allow here.</p>`;
  for (const it of g){
    const on = isOn(toml, it), path = it.mod ? `${esc(it.plugin.name)} <span class="weak">&rsaquo;</span> ${esc(it.name)}` : esc(it.name);
    let control, note;
    if (!offers(it, mode)){ control = cb('', false, '', '', {disabled:true, title:`Its author keeps it out of ${word}.`}); note = `<span class="weak">its author keeps it out of ${word}</span>`; }
    else if (!on){ control = cb('', allowed(toml, it, mode), '', '', {disabled:true, title:'Turn it on in Normal games first.'}); note = '<span class="weak">off in every game</span>'; }
    else { control = cb('', allowed(toml, it, mode), 'allow', it.key, {mode}); note = allowed(toml, it, mode) ? `<span class="good">runs in ${word}</span>` : `<span class="warn">kept out of ${word}</span>`; }
    h += `<div class="row"><span class="nm">${control} ${path}</span><span style="flex:1">${note}</span>${inGame() ? stateWord(it) : ''}${pend(it)}</div>`;
  }
  h += `<p class="weak" style="margin:8px 0 0">${all.filter(i => !i.gameplay && isOn(toml, i)).length} plugins and modules that do not change the game run in ${word} too.</p>`;
  if (mode === 'mp'){
    const acting = g.filter(i => isOn(toml, i) && offers(i, 'mp') && allowed(toml, i, 'mp')).map(i => i.key);
    h += `<div class="banner" style="margin-top:10px">Players in one game compare this code in the overlay: <b>${hash(acting)}</b>. It matches when everyone allows the same things.</div>`;
  }
  return h;
}

// ---- the two apps --------------------------------------------------------------------
const VARIANTS = {'0':['Today', variant0], A:['Matrix table', variantA], B:['List and detail, one choice per module', variantB], C:['By game mode', variantC]};
const KEYS = ['0', 'A', 'B', 'C'];
let variant = (new URLSearchParams(location.search).get('variant') || '0').toUpperCase();
if (!VARIANTS[variant]) variant = '0';
const today = () => variant === '0';

function pendingBar(){
  const n = pendingCount();
  if (!n || today()) return '';
  return `<div class="banner"><span class="info">&#9679;</span><span>${n} change(s) apply at the next start of EU4.</span><span style="flex:1"></span><button class="small" data-act="undo">Undo changes</button></div>`;
}
function sessionLine(){
  const s = SESSION, g = lastStart, acting = items().filter(i => i.gameplay && isOn(g, i) && !keptOut(g, i, s));
  const kind = s.ironman && s.mp ? 'an ironman multiplayer game' : s.ironman ? 'an ironman game' : s.mp ? 'a multiplayer game' : 'a single-player game';
  return `<div style="margin-bottom:6px">In ${kind}: ${acting.length ? `${acting.length} plugin(s) or module(s) that change the game act. Multiplayer code <b>${hash(acting.map(i => i.key))}</b>.` : 'nothing that changes the game acts.'}</div>`;
}
function manager(){
  CTX = 'manager';
  const tabs = today() ? ['Anvil','Catalog','Plugins','Mods','Settings','Benchmark','Crashes','Log','About'] : ['Anvil','Catalog','Plugins','Mods','Benchmark','Crashes','Log','About'];
  if (!today() && ui.tab === 'settings') ui.tab = 'plugins';
  document.getElementById('tabs').innerHTML = tabs.map(t => `<span class="tab ${ui.tab === t.toLowerCase() ? 'cur' : ''}" ${t === 'Plugins' || t === 'Settings' ? `data-act="tab" data-key="${t.toLowerCase()}"` : ''}>${t}</span>`).join('');
  document.getElementById('mbanner').innerHTML = running ? `<div class="banner amber">EU4 is running from this folder. Close it to change plugins here${today() ? '' : '; the overlay changes the same things in the game'}.</div>` : '';
  document.getElementById('pending').innerHTML = running ? '' : pendingBar();
  const body = ui.tab === 'settings' ? todayManagerSettings() : VARIANTS[variant][1]();
  document.getElementById('variant').innerHTML = `<div class="${running ? 'ro' : ''}">${body}</div>`;
  document.getElementById('startbtn').innerHTML = running ? '<span class="weak">EU4 is running</span>' : '<button data-act="start">Start EU4</button>';
}
function overlay(){
  CTX = 'overlay';
  const map = document.getElementById('map');
  document.getElementById('quitbtn').innerHTML = running ? '<button class="small" data-act="quit">Quit to desktop</button>' : '';
  if (!running){ map.innerHTML = `<div style="text-align:center;padding:60px 0"><p>EU4 is not running.</p><button data-act="start">Start EU4</button></div>`; CTX = 'manager'; return; }
  const tabs = today() ? [['status','Status'],['mods','Mods'],['settings','Settings'],['crash','Crash report'],['log','Log']]
                       : [['plugins','Plugins'],['mods','Mods'],['crash','Crash report'],['log','Log']];
  if (!tabs.some(([k]) => k === ui.otab)) ui.otab = tabs[0][0];
  let body;
  if (today()) body = ui.otab === 'settings' ? todayOverlaySettings() : ui.otab === 'status' ? todayOverlayStatus() : '<p class="weak">Not part of this prototype.</p>';
  else body = ui.otab === 'plugins' ? sessionLine() + pendingBar() + VARIANTS[variant][1]() : '<p class="weak">Not part of this prototype.</p>';
  const msg = message ? `<div class="msg"><span class="${message.error ? 'bad' : 'good'}">${esc(message.text)}</span><button class="small" data-act="okmsg">OK</button></div>` : '';
  map.innerHTML = `<div class="owin"><div class="otitle"><span>Anvil</span><span>&times;</span></div>
    <div class="tabs" style="padding:6px 8px 0">${tabs.map(([k, l]) => `<span class="tab ${ui.otab === k ? 'cur' : ''}" ${['status','settings','plugins'].includes(k) ? `data-act="otab" data-key="${k}"` : ''}>${l}</span>`).join('')}</div>
    <div class="obody">${msg}${body}</div></div>`;
  CTX = 'manager';
}
function tomlText(){
  const lines = ['# anvil/anvil.toml (the switches and opt-ins)'];
  for (const l of LISTS){
    const changed = JSON.stringify([...toml[l]].sort()) !== JSON.stringify([...lastStart[l]].sort());
    const line = `${l} = [${toml[l].map(x => `"${x}"`).join(', ')}]`;
    lines.push(changed ? `<span class="chg">${esc(line)}   # changed since the game started</span>` : esc(line));
  }
  for (const p of PLUGINS){
    const set = (SETTINGS[p.id] || []).filter(s => getVal(p.id, s) !== s.def);
    if (!set.length) continue;
    lines.push('', `# anvil/data/${p.id}/settings.toml (values that differ from the defaults)`);
    for (const s of set){
      const line = `${s.name} = ${JSON.stringify(getVal(p.id, s))}`;
      lines.push(setPending(p.id, s) ? `<span class="chg">${esc(line)}   # waits for the next start</span>` : esc(line));
    }
  }
  return lines.join('\n');
}
function render(){
  manager(); overlay();
  document.getElementById('toml').innerHTML = tomlText();
  document.getElementById('switcher').innerHTML = `<button data-act="prev" aria-label="Previous variant">&larr;</button>
    <span class="lbl">${variant} (${esc(VARIANTS[variant][0])})</span><button data-act="next" aria-label="Next variant">&rarr;</button>`;
}

// ---- actions --------------------------------------------------------------------------
function go(step){
  variant = KEYS[(KEYS.indexOf(variant) + step + KEYS.length) % KEYS.length];
  const u = new URL(location.href); u.searchParams.set('variant', variant); history.replaceState(null, '', u);
  render();
}
function setSetting(k, v){
  const [pid, name] = k.split('/'), s = SETTINGS[pid].find(x => x.name === name);
  values[k] = v;
  if (running && !s.restart) lastValues[k] = v;   // the game takes a restart = false value at once
  if (running) message = {text: `${s.label}: ${s.restart ? 'saved; applies at the next start' : 'applied'}`, error:false};
}
function act(el){
  const a = el.dataset.act, k = el.dataset.key;
  if (a === 'prev') return go(-1);
  if (a === 'next') return go(1);
  if (a === 'on'){ const it = item(k); setOn(it, !isOn(toml, it)); }
  else if (a === 'allow'){ const it = item(k), m = el.dataset.mode; setAllowed(it, m, !allowed(toml, it, m)); }
  else if (a === 'where'){
    const it = item(k), w = el.dataset.where;
    if (w === 'off') setOn(it, false);
    else { setOn(it, true); if (it.gameplay){ setAllowed(it, 'ironman', w === 'im' || w === 'all'); setAllowed(it, 'mp', w === 'mp' || w === 'all'); } }
  }
  else if (a === 'select'){ const [c, id] = k.split(':'); if (c === 'overlay') ui.oselected = id; else ui.selected = id; }
  else if (a === 'mode'){ const [c, m] = k.split(':'); if (c === 'overlay') ui.omode = m; else ui.mode = m; }
  else if (a === 'tab') ui.tab = k;
  else if (a === 'otab') ui.otab = k;
  else if (a === 'opick') ui.osettings = k;
  else if (a === 'opensettings'){ ui.tab = 'settings'; ui.settingsPlugin = k; }
  else if (a === 'toggle'){ ui.open.has(k) ? ui.open.delete(k) : ui.open.add(k); }
  else if (a === 'set'){ const [pid, name] = k.split('/'); setSetting(k, !getVal(pid, SETTINGS[pid].find(x => x.name === name))); }
  else if (a === 'reset'){ const [pid, name] = k.split('/'); setSetting(k, SETTINGS[pid].find(x => x.name === name).def); }
  else if (a === 'disablenext'){ setListed('disabled_plugins', k, true); message = {text:`${k} is disabled from the next start.`, error:false}; }
  else if (a === 'okmsg') message = null;
  else if (a === 'undo'){ toml = JSON.parse(JSON.stringify(lastStart)); values = {...lastValues}; }
  else if (a === 'start'){ lastStart = JSON.parse(JSON.stringify(toml)); lastValues = {...values}; running = true; message = null; }
  else if (a === 'quit'){ running = false; message = null; }
  else return;
  render();
}
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && !el.disabled) act(el); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'session'){
    SESSION = {ironman: t.value === 'im' || t.value === 'immp', mp: t.value === 'mp' || t.value === 'immp'};
    ui.omode = SESSION.ironman ? 'ironman' : SESSION.mp ? 'mp' : 'normal';
    return render();
  }
  if (t.dataset.pick === 'manager'){ ui.settingsPlugin = t.value; return render(); }
  if (t.dataset.set){
    const [pid, name] = t.dataset.set.split('/'), s = SETTINGS[pid].find(x => x.name === name);
    setSetting(t.dataset.set, s.type === 'int' ? Number(t.value) : t.value);
    render();
  }
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.matches && t.matches('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === 'ArrowRight') go(1);
  else if ((e.key === ' ' || e.key === 'Enter') && t.dataset && t.dataset.act){ e.preventDefault(); act(t); }
});
render();
</script>
</body>
</html>
