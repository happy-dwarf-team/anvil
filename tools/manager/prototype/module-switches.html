<!doctype html>
<!--
  PROTOTYPE, throwaway (branch prototype/module-switches; never merge to main).
  Question: what should module switches, ironman / multiplayer opt-ins and plugin settings look like,
  in the Manager and in the in-game overlay?
  Variant 0 is Anvil 1.22 as it is today (manager_app.cpp, anvil-overlay ui.cpp); A, B and C are proposals in which
  both apps draw the same model the same way. Switch via ?variant=0|A|B|C, the bar at the bottom, or the arrow keys.
  "Start EU4" starts a pretend game: the overlay appears, the Manager turns read-only (as it does today), settings
  with restart = false apply at once and everything else waits for the next start.
  A, B and C tie settings to modules with a new optional `module` key in settings.toml (today there is only `group`).
  The real apps are Dear ImGui; this page imitates their dark style. Plugins, modules and settings are read from
  the team's plugin.toml and settings.toml files (anvil standard plugins, Bellows, Smithy, Whetstone, Sieve, Hoard,
  Lodestone, Mei, Tongs); versions are the checkouts', not releases.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module switches prototype</title>
<style>
:root{
  --win:#0f0f0f; --child:#141416; --text:#ffffff; --weak:#808080;
  --frame:rgba(41,74,122,.54); --frame-h:rgba(66,150,250,.40); --check:#4296fa;
  --btn:rgba(66,150,250,.40); --btn-h:#4296fa; --hdr:#303033;
  --bs:#4f4f59; --bl:#3b3b40; --rowalt:rgba(255,255,255,.06); --sel:rgba(66,150,250,.31);
  --good:#66c773; --warn:#f5b842; --bad:#f26b61; --info:#6fa8ff;
}
*{box-sizing:border-box}
html,body{margin:0;background:#1b1b1d;color:var(--text);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
.app{max-width:1100px;margin:0 auto;background:var(--win);padding:0 0 10px}
.cap{max-width:1100px;margin:0 auto;padding:10px 12px 4px;color:#aaa;font-size:12px;text-transform:none;letter-spacing:.02em}
.titlebar{padding:6px 12px;background:#202022;font-size:12px;color:#ccc;display:flex;justify-content:space-between}
.gamebar{padding:8px 12px;border-bottom:1px solid var(--bl);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:2px;padding:6px 12px 0;border-bottom:1px solid var(--check);flex-wrap:wrap}
.tab{padding:4px 12px;background:rgba(46,89,148,.86);border-radius:4px 4px 0 0;font-size:13px}
.tab[data-act]{cursor:pointer}
.tab.cur{background:var(--check)}
.pane{padding:10px 12px}
.weak{color:var(--weak)} .good{color:var(--good)} .warn{color:var(--warn)} .bad{color:var(--bad)} .info{color:var(--info)}
button{font:inherit;color:var(--text);background:var(--btn);border:0;border-radius:3px;padding:3px 10px;cursor:pointer}
button:hover:not(:disabled){background:var(--btn-h)}
button:disabled{opacity:.45;cursor:default}
button.small{padding:1px 7px;font-size:13px}
.cb{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;white-space:nowrap}
.cb .box{width:16px;height:16px;background:var(--frame);border-radius:2px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.cb:hover .box{background:var(--frame-h)}
.cb.on .box::after{content:"";width:8px;height:8px;background:var(--check);border-radius:1px}
.cb.dis{opacity:.4;cursor:default}
.cb.dis:hover .box{background:var(--frame)}
.dash{color:var(--weak);cursor:help;padding-left:4px}
.help{color:var(--weak);cursor:help;margin-left:4px}
.tag{font-size:11px;padding:0 6px;border-radius:3px;border:1px solid rgba(245,184,66,.55);color:var(--warn);margin-left:6px;white-space:nowrap;vertical-align:1px}
.pending{font-size:12px;color:var(--info);white-space:nowrap}
table.im{width:100%;border-collapse:collapse;border:1px solid var(--bs)}
table.im th{background:var(--hdr);text-align:left;font-weight:400;padding:4px 6px;border:1px solid var(--bs);white-space:nowrap}
table.im td{padding:4px 6px;border-left:1px solid var(--bl);border-right:1px solid var(--bl);vertical-align:top}
table.im tr:nth-child(even) td{background:var(--rowalt)}
.child td:first-child,.child td.indent{padding-left:26px}
.tree{color:var(--bs);margin-right:4px}
.section{margin:14px 0 6px;color:#ddd;border-bottom:1px solid var(--bl);padding-bottom:3px}
.banner{background:rgba(111,168,255,.10);border:1px solid rgba(111,168,255,.35);border-radius:3px;padding:6px 10px;margin:0 0 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.amber{background:rgba(245,184,66,.08);border-color:rgba(245,184,66,.4)}
.split{display:grid;grid-template-columns:minmax(180px,260px) minmax(0,1fr);gap:10px}
.list{border:1px solid var(--bs);background:var(--child)}
.li{padding:6px 8px;border-bottom:1px solid var(--bl);cursor:pointer}
.li:hover{background:rgba(66,150,250,.18)} .li.sel{background:var(--sel)}
.detail{border:1px solid var(--bs);background:var(--child);padding:10px 12px}
.seg{display:inline-flex;border:1px solid var(--bs);border-radius:3px;overflow:hidden;flex-wrap:wrap}
.seg button{border-radius:0;background:#26262a;padding:3px 10px;border-right:1px solid var(--bl)}
.seg button.cur{background:var(--check)}
.seg button:disabled{opacity:.35}
.mod{padding:8px 0;border-bottom:1px solid var(--bl)}
.modes{display:flex;margin:0 0 10px;border:1px solid var(--bs);border-radius:3px;overflow:hidden;width:max-content;max-width:100%;flex-wrap:wrap}
.modes button{border-radius:0;background:var(--frame);padding:6px 16px;border-right:1px solid var(--bl)}
.modes button.cur{background:var(--check)}
.modes button.cur .weak{color:#e6eefc}
.row{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--bl);flex-wrap:wrap}
.row .nm{min-width:220px}
select,input{font:inherit;background:var(--frame);color:var(--text);border:0;padding:2px 6px;border-radius:2px}
input[type=number],input[type=text]{width:10em}
input:disabled,select:disabled{opacity:.4}
.sep{display:flex;align-items:center;gap:8px;margin:12px 0 6px;color:#ddd}
.sep::after{content:"";flex:1;border-top:1px solid var(--bs)}
.set{display:flex;align-items:center;gap:8px;padding:3px 0;flex-wrap:wrap}
.setbox{border-left:2px solid var(--bs);margin:4px 0 4px 2px;padding:2px 0 2px 12px}
.expander{background:none;color:var(--info);padding:0 4px;font-size:12px}
.expander:hover:not(:disabled){background:rgba(111,168,255,.15)}
.ro{pointer-events:none;opacity:.5}
.game{max-width:1100px;margin:0 auto;background:#1d2a1f}
.gametitle{padding:6px 12px;background:#202022;font-size:12px;color:#ccc;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.map{padding:28px 16px;min-height:200px;background:repeating-linear-gradient(135deg,#24361f 0 22px,#21321d 22px 44px)}
.owin{max-width:860px;margin:0 auto;background:rgba(15,15,15,.94);border:1px solid #6e6e80}
.otitle{background:#29497a;padding:3px 8px;font-size:13px;display:flex;justify-content:space-between}
.obody{padding:8px;min-height:240px}
.msg{display:flex;gap:8px;align-items:center;margin:0 0 6px}
pre.toml{max-width:1100px;margin:0 auto;padding:8px 12px;background:#000;border:1px solid var(--bl);font:12px/1.5 Consolas,monospace;white-space:pre-wrap}
pre.toml .chg{color:var(--info)}
.switcher{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#f4f4f4;color:#111;border-radius:999px;padding:6px 8px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 18px rgba(0,0,0,.6);font:13px system-ui,sans-serif;z-index:10;max-width:calc(100vw - 32px)}
.switcher button{background:#111;color:#fff;border-radius:999px;width:30px;height:30px;padding:0;font-size:15px}
.switcher button:hover{background:#333}
.switcher .lbl{min-width:0;text-align:center;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lhdr{padding:5px 8px;background:var(--hdr);cursor:pointer;font-size:13px;border-bottom:1px solid var(--bl)}
.mrow{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.mdesc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;color:var(--weak);margin:2px 0 0 22px}
.gsep{display:flex;align-items:center;gap:8px;margin:14px 0 4px;color:#ddd;cursor:pointer}
.gsep::after{content:"";flex:1;border-top:1px solid var(--bs);order:2}
.gsep .acts{order:3}
.note{font-size:12px;color:var(--weak);margin:4px 0}
.seg.small button{padding:1px 8px;font-size:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlg{background:#1e1e22;border:1px solid #6e6e80;max-width:560px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.6)}
.dlg .dt{background:#2a2a30;padding:6px 12px;font-size:12px;color:#ccc}
.dlg .db{padding:12px}
.dlg .da{display:flex;gap:8px;justify-content:flex-end;padding:0 12px 12px}
.dlg ul{margin:6px 0;padding-left:20px}
.facts{display:grid;grid-template-columns:max-content 1fr;gap:2px 12px;font-size:13px;margin:8px 0}
.facts .k{color:var(--weak)}
.banner.warn{background:rgba(245,184,66,.08);border-color:rgba(245,184,66,.4)}
.li.held{opacity:.6}
.chg{font-size:11px;padding:0 5px;border-radius:3px;border:1px solid var(--bs);color:#ccc;white-space:nowrap}
.split.fixed{height:560px}
.split.fixed .list,.split.fixed .detail{overflow-y:auto;min-height:0}
.lcol{display:flex;flex-direction:column;min-height:0;gap:6px}
.lcol .list{flex:1}
.lsearch{display:flex;flex-direction:column;gap:6px}
.find{display:flex;align-items:center;gap:8px}
.find input{flex:1;min-width:0}
.find input::placeholder{color:#8a8a96}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:12px;padding:1px 8px;border-radius:10px;background:transparent;border:1px solid var(--bs);color:#ccc}
.chip:hover:not(:disabled){background:rgba(66,150,250,.18)}
.chip.on{background:var(--frame);border-color:var(--check);color:#fff}
.chip .n{color:var(--weak)}
.chip.on .n{color:#cfe0f7}
mark{background:rgba(245,184,66,.35);color:inherit;border-radius:2px;padding:0 1px}
.mod.hit{box-shadow:inset 3px 0 0 var(--warn);padding-left:6px !important}
.empty{padding:12px 10px}
/* Scrollbars as the apps' ImGui style will draw them (ui-guidelines §3): thin, no track, a neutral grab
   that brightens on hover and takes the accent while dragged. */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:#4f4f59;border-radius:6px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background-color:#6e6e80}
::-webkit-scrollbar-thumb:active{background-color:rgba(66,150,250,.67)}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:#4f4f59 transparent}}
.held{opacity:.55}
.held .cb.dis{opacity:1}
.held .seg button:disabled{opacity:1}
.cb.mixed .box::after{content:"";width:8px;height:2px;background:var(--check)}
.more{font-size:12px;color:#aaa;margin:4px 0 0 22px;border-left:2px solid var(--bl);padding-left:8px}
.mdesc.full{display:block;-webkit-line-clamp:unset;overflow:visible}
/* ---- Skin "Forge": the proposed design system (docs/ui-design-system.md). Warm graphite surfaces, one ember
   accent for what the player acts on (selection, focus, the main action), the state colours unchanged in meaning.
   Every value maps to an ImGui style colour or variable; nothing here needs a custom widget except the status glyphs. */
body.forge{
  --bg0:#0d0c0b; --win:#121110; --child:#181716; --raise:#1f1d1b; --frame:#242220; --frame-h:#2e2b28; --frame-a:#38342f;
  --line:#2c2926; --bs:#4a4540; --bl:#2c2926; --text:#ece8e1; --weak:#a39e96; --dim:#8a857e;
  --ember:#e8853d; --ember-h:#f09a57; --ember-t:rgba(232,133,61,.16); --ember-tt:rgba(232,133,61,.28); --on-ember:#1a1209;
  --check:var(--ember); --sel:var(--ember-t); --hdr:#1f1d1b; --rowalt:rgba(255,255,255,.03);
  --btn:#2a2724; --btn-h:#36322e;
  --good:#6cc48a; --warn:#e5c04b; --bad:#ef6a5e; --info:#7aa7e0;
  background:var(--bg0);
}
.forge .app{background:var(--win);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.forge .titlebar,.forge .gametitle{background:var(--bg0);color:var(--weak);border-bottom:1px solid var(--line)}
.forge .titlebar>span:first-child::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--ember);margin-right:8px;vertical-align:1px}
.forge .gamebar{border-bottom:1px solid var(--line)}
/* Tabs: flat text, the current one carries an ember overline-style bar (ImGuiCol_TabSelectedOverline). */
.forge .tabs{border-bottom:1px solid var(--line);gap:4px}
.forge .tab{background:transparent;color:var(--weak);border-radius:4px 4px 0 0;padding:6px 12px;box-shadow:inset 0 -2px 0 transparent}
.forge .tab[data-act]:hover{background:var(--raise);color:var(--text)}
.forge .tab.cur{background:var(--raise);color:var(--text);box-shadow:inset 0 -2px 0 var(--ember)}
.forge .tab .warn{color:var(--warn)}
/* Buttons: secondary by default, one primary (ember) per view, quiet text buttons for "More" and "Clear". */
.forge button{background:var(--btn);border:1px solid var(--bs);border-radius:4px;padding:4px 12px}
.forge button:hover:not(:disabled){background:var(--btn-h);border-color:#5c564f}
.forge button.small{padding:1px 8px}
.forge button.primary,.forge [data-act="confirmOk"],.forge [data-act="start"],.forge [data-act="askApprove"]{background:var(--ember);border-color:var(--ember);color:var(--on-ember);font-weight:600}
.forge button.primary:hover:not(:disabled),.forge [data-act="confirmOk"]:hover,.forge [data-act="start"]:hover,.forge [data-act="askApprove"]:hover{background:var(--ember-h)}
.forge [data-act="confirmCancel"]{background:var(--btn) !important}
.forge .expander{border:0;background:none;color:var(--info);padding:0 4px}
.forge .expander:hover:not(:disabled){background:rgba(122,167,224,.12)}
.forge :focus-visible{outline:2px solid var(--ember);outline-offset:2px;border-radius:3px}
/* Checkbox: a framed box, ember when on, with a tick (ImGui draws its own tick in CheckMark). */
.forge .cb .box{background:var(--frame);border:1px solid var(--bs);border-radius:3px}
.forge .cb:hover .box{background:var(--frame-h);border-color:#5c564f}
.forge .cb.on .box{background:var(--ember);border-color:var(--ember)}
.forge .cb.on .box::after{width:4px;height:8px;background:none;border:solid var(--on-ember);border-width:0 2px 2px 0;border-radius:0;transform:rotate(45deg) translate(-1px,-1px)}
.forge .cb.dis:hover .box{background:var(--frame);border-color:var(--bs)}
.forge .held .cb.on .box{background:#6b5440;border-color:#6b5440}
/* Segmented choices: a track, the chosen segment raised and outlined in ember. */
.forge .seg,.forge .modes{background:var(--frame);border:1px solid var(--bs);border-radius:5px;padding:2px;gap:2px}
.forge .seg button,.forge .modes button{background:transparent;border:1px solid transparent;border-radius:3px}
.forge .seg button:hover:not(:disabled),.forge .modes button:hover:not(:disabled){background:var(--frame-h)}
.forge .seg button.cur,.forge .modes button.cur{background:var(--ember-tt);border-color:var(--ember);color:var(--text)}
/* Inputs. */
.forge select,.forge input{background:var(--frame);border:1px solid var(--bs);border-radius:4px;padding:3px 8px}
.forge select:hover,.forge input:hover{border-color:#5c564f}
.forge .find input{padding:5px 10px}
/* List and detail: panels on the window, the selection a tinted row with an ember bar. */
.forge .list,.forge .detail{background:var(--child);border:1px solid var(--line);border-radius:6px}
.forge .li{border-bottom:1px solid var(--line);padding:8px 10px 8px 12px;box-shadow:inset 3px 0 0 transparent}
.forge .li:hover{background:var(--raise)}
.forge .li.sel{background:var(--ember-t);box-shadow:inset 3px 0 0 var(--ember)}
.forge .li .mrow>span:first-child{font-weight:600}
.forge .lhdr{background:transparent;color:var(--weak);font-size:12px;letter-spacing:.04em;padding:10px 10px 4px;border-bottom:1px solid var(--line)}
.forge .lhdr:hover{color:var(--text)}
.forge .detail{padding:0 16px 12px}
.forge .detail>.mrow:first-child{position:sticky;top:0;z-index:2;background:var(--child);padding:12px 0 8px;margin-bottom:2px;border-bottom:1px solid var(--line)}
.forge .detail>.mrow:first-child>div:first-child{font-weight:600}
.forge .gsep{color:var(--text);font-weight:600;margin:18px 0 6px}
.forge .gsep::after,.forge .sep::after{border-top-color:var(--line)}
.forge .mod{border-bottom:1px solid var(--line)}
.forge .mod.hit{box-shadow:inset 3px 0 0 var(--ember)}
.forge .setbox{border-left-color:var(--line)}
.forge mark{background:var(--ember-tt);color:var(--text);box-shadow:0 1px 0 var(--ember)}
/* Status: a word and a glyph of its own shape, so state never rests on colour (ui-guidelines §3). */
.forge .li .mrow>span:last-child>span::before{display:inline-block;width:1.1em;text-align:center}
.forge .li .mrow>span:last-child>.good::before{content:"\2713"}
.forge .li .mrow>span:last-child>.weak::before{content:"\25CB"}
.forge .li .mrow>span:last-child>.warn::before{content:"\25B2";font-size:10px;vertical-align:1px}
.forge .li .mrow>span:last-child>.bad::before{content:"\2715"}
/* Tags and chips: pills with a hairline, the state colour only on the word. */
.forge .tag{border-radius:999px;border-color:rgba(229,192,75,.45);background:rgba(229,192,75,.07);padding:0 8px}
.forge .chg{border-radius:999px;border-color:var(--bs);color:var(--weak);padding:0 7px}
.forge .chip{border-radius:999px;border-color:var(--bs);background:transparent;color:var(--weak);padding:2px 10px}
.forge .chip:hover:not(:disabled){background:var(--raise);color:var(--text)}
.forge .chip.on{background:var(--ember-t);border-color:var(--ember);color:var(--text)}
.forge .chip.on .n{color:var(--text)}
/* Banners: a left bar in the state colour, the surface barely tinted. */
.forge .banner{background:var(--raise);border:1px solid var(--line);border-left:3px solid var(--info);border-radius:4px;padding:8px 12px}
.forge .banner.warn,.forge .banner.amber{background:rgba(229,192,75,.06);border-color:var(--line);border-left-color:var(--warn);color:var(--text)}
.forge .banner.warn>b:first-child{color:var(--warn)}
.forge .banner .facts{background:var(--child);border:1px solid var(--line);border-radius:4px;padding:8px 10px;margin:10px 0}
/* Dialog. */
.forge .modal{background:rgba(5,4,3,.66)}
.forge .dlg{background:var(--raise);border:1px solid var(--bs);border-radius:8px;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.6)}
.forge .dlg .dt{background:transparent;border-bottom:1px solid var(--line);color:var(--weak)}
.forge .dlg .db>div:first-child{font-weight:600}
.forge .dlg .da{flex-direction:row-reverse;justify-content:flex-start}
/* The overlay: an opaque panel over the map, an ember line instead of a blue title bar. */
.forge .owin{background:rgba(18,17,16,.97);border:1px solid var(--bs);border-radius:8px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.55)}
.forge .otitle{background:var(--bg0);border-top:2px solid var(--ember);color:var(--weak);padding:5px 10px}
.forge .otitle>span:first-child{color:var(--text);font-weight:600}
.forge pre.toml{background:var(--bg0);border-color:var(--line);border-radius:6px}
.forge .cap{color:var(--dim)}
.forge ::-webkit-scrollbar-thumb{background-color:#3d3935}
.forge ::-webkit-scrollbar-thumb:hover{background-color:#5c564f}
.forge ::-webkit-scrollbar-thumb:active{background-color:var(--ember)}
@media (max-width:720px){.split{grid-template-columns:1fr}.row .nm{min-width:0}}
</style>
</head>
<body>
<div class="cap">ANVIL MANAGER</div>
<div class="app">
  <div class="titlebar"><span>Anvil Manager 1.22.0</span><span>PROTOTYPE &middot; real manifests, 2026-11-14</span></div>
  <div class="gamebar">
    <span>EU4 1.37.5.0 &middot; <span class="weak">...\Europa Universalis IV</span> &middot; <span class="good">Anvil 1.22.0 installed</span></span>
    <span style="flex:1"></span>
    <span id="startbtn"></span>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="pane"><div id="mbanner"></div><div id="pending"></div><div id="variant"></div></div>
</div>
<div class="cap">IN THE GAME: THE OVERLAY</div>
<div class="game">
  <div class="gametitle"><span>Europa Universalis IV</span>
    <label>Game: <select id="session">
      <option value="sp">Single-player</option><option value="im" selected>Ironman</option>
      <option value="mp">Multiplayer</option><option value="immp">Ironman multiplayer</option></select></label>
    <span style="flex:1"></span><span id="quitbtn"></span></div>
  <div class="map" id="map"></div>
</div>
<div class="cap">anvil/anvil.toml AND THE SETTINGS FILES</div>
<pre class="toml" id="toml"></pre>
<div style="height:80px"></div>
<div class="switcher" id="switcher"></div>

<script>
// ---- real data: plugin.toml and settings.toml of the team's plugins (read 2026-11-14) ----------
// `module` on a setting is the PROPOSED key; here it is guessed from the setting's name
// (Bellows: a setting named as its module or prefixed by it; Smithy: by its group). Variant 0 ignores it.
let PLUGINS = [
 {
  "id": "anvil-game",
  "name": "Anvil game",

const LISTS = ['disabled_plugins','enabled_modules','disabled_modules','allow_ironman','allow_multiplayer'];
let toml = {disabled_plugins:[], enabled_modules:[], disabled_modules:[], allow_ironman:['smithy.drill_all', 'tongs'], allow_multiplayer:[]};
let lastStart = JSON.parse(JSON.stringify(toml));   // what the running (or last) game started with
let values = {}, lastValues = {};                    // the player's settings: saved / in effect
let running = false, SESSION = {ironman:true, mp:false}, CTX = 'manager', message = null;

// ---- the model --------------------------------------------------------------------------
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const has = (t, list, k) => t[list].includes(k);
function setListed(list, k, on){ const a = toml[list].filter(x => x !== k); if (on) a.push(k); toml[list] = a; }
function items(){
  const out = [];
  for (const p of PLUGINS){
    out.push({key:p.id, plugin:p, mod:null, name:p.name, gameplay:p.gameplay, ironman:!!p.ironman, mp:!!p.mp});
    for (const m of p.modules) out.push({key:p.id+'.'+m.id, plugin:p, mod:m, name:m.name, gameplay:m.gameplay, ironman:!!m.ironman, mp:!!m.mp});
  }
  return out;
}
const item = k => items().find(i => i.key === k);
const pluginOn = (t, p) => !has(t,'disabled_plugins',p.id);
function isOn(t, it){
  if (!pluginOn(t, it.plugin)) return false;
  if (!it.mod) return true;
  return !has(t,'disabled_modules',it.key) && (it.mod.def || has(t,'enabled_modules',it.key));
}
// The module's own switch, whatever its plugin does (B4 shows it greyed under an off plugin).
const chosen = (t, it) => !it.mod || (!has(t,'disabled_modules',it.key) && (it.mod.def || has(t,'enabled_modules',it.key)));
function setOn(it, on){
  if (!it.mod){ setListed('disabled_plugins', it.key, !on); return; }
  if (on){ setListed('disabled_modules', it.key, false); if (!it.mod.def) setListed('enabled_modules', it.key, true); }
  else if (it.mod.def) setListed('disabled_modules', it.key, true);
  else setListed('enabled_modules', it.key, false);
}
const allowed = (t, it, mode) => has(t, mode === 'ironman' ? 'allow_ironman' : 'allow_multiplayer', it.key);
const setAllowed = (it, mode, on) => setListed(mode === 'ironman' ? 'allow_ironman' : 'allow_multiplayer', it.key, on);
const offers = (it, mode) => mode === 'ironman' ? it.ironman : it.mp;
const MODE = {ironman:'ironman', mp:'multiplayer'};
// Why it does not act in a session; '' when it acts.
function keptOut(t, it, s){
  if (!it.gameplay) return '';
  for (const mode of ['ironman','mp']){
    if (!s[mode]) continue;
    if (!offers(it, mode)) return 'its author keeps it out of ' + MODE[mode];
    if (!allowed(t, it, mode)) return 'not allowed in ' + MODE[mode];
  }
  return '';
}
// A change is pending where it was made: a plugin's switch on the plugin, not again on each of its modules.
const sig = (t, it) => [it.mod ? chosen(t,it) : pluginOn(t,it.plugin), allowed(t,it,'ironman'), allowed(t,it,'mp')].join();
const isPending = it => sig(toml, it) !== sig(lastStart, it);
function hash(keys){ let h = 2166136261; for (const c of keys.join('|')){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; } return h.toString(16).padStart(8,'0'); }
const valKey = (pid, s) => pid + '/' + s.name;
const getVal = (pid, s, v = values) => valKey(pid, s) in v ? v[valKey(pid, s)] : s.def;
const setPending = (pid, s) => getVal(pid, s) !== getVal(pid, s, lastValues);
const settingsOf = (pid, moduleId) => (SETTINGS[pid] || []).filter(s => (s.module || null) === moduleId);
const show = v => v === true ? 'on' : v === false ? 'off' : String(v);
const pendingCount = () => items().filter(isPending).length + PLUGINS.flatMap(p => (SETTINGS[p.id] || []).filter(s => setPending(p.id, s))).length
  + PLUGINS.filter(p => p.fromMod && trustOf(toml, p) !== trustOf(lastStart, p)).length;

// ---- shared bits ---------------------------------------------------------------------
function cb(label, on, act, key, extra = {}){
  const dis = extra.disabled ? ' dis' : '';
  return `<span class="cb${on ? ' on' : ''}${dis}" role="checkbox" aria-checked="${on}" tabindex="0" title="${esc(extra.title || '')}"
    ${extra.disabled ? 'aria-disabled="true"' : `data-act="${act}" data-key="${esc(key)}" ${extra.mode ? `data-mode="${extra.mode}"` : ''}`}>
    <span class="box"></span>${label ? esc(label) : ''}</span>`;
}
const help = d => d ? `<span class="help" title="${esc(d)}">(?)</span>` : '';
const tag = it => it.gameplay ? '<span class="tag">changes the game</span>' : '';
const pend = it => isPending(it) ? '<span class="pending">&#9679; at the next start</span>' : '';
const POLICY = 'Plugins and modules that <b>change the game</b> are kept out of ironman and multiplayer games unless you allow them there.';
const inGame = () => CTX === 'overlay';
// Manager: what the next start does. Overlay: what this game does, plus what changes at the next start.
function stateWord(it){
  if (inGame()){
    if (it.mod && !pluginOn(lastStart, it.plugin)) return '<span class="weak">off with its plugin in this game</span>';
    if (!isOn(lastStart, it)) return '<span class="weak">off in this game</span>';
    const r = keptOut(lastStart, it, SESSION);
    return r ? `<span class="warn">kept out of this game</span><div class="weak" style="font-size:12px">${r}</div>` : '<span class="good">on in this game</span>';
  }
  if (!pluginOn(toml, it.plugin)) return it.mod ? '<span class="weak">off with its plugin</span>' : '<span class="weak">off</span>';
  return isOn(toml, it) ? '<span class="good">on</span>' : '<span class="weak">off</span>';
}
const removeBtn = p => !inGame() && !p.standard ? '<button class="small">Remove</button>' : '';

// One setting, the same in both apps (proposal).
function control(pid, s, disabled){
  const v = getVal(pid, s), k = esc(valKey(pid, s)), dis = disabled ? 'disabled' : '';
  let c;
  if (s.type === 'bool') c = cb(s.label, v, 'set', valKey(pid, s), {disabled});
  else if (s.type === 'enum') c = `<select data-set="${k}" ${dis}>${s.values.map(([n, l]) => `<option value="${n}" ${n === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select> <span>${hl(s.label)}</span>`;
  else c = `<input type="${s.type === 'int' ? 'number' : 'text'}" data-set="${k}" value="${esc(v)}" ${dis}> <span>${hl(s.label)}</span>`;
  const p = setPending(pid, s) ? `<span class="pending">&#9679; at the next start${running ? ` (now ${esc(show(getVal(pid, s, lastValues)))})` : ''}</span>` : '';
  const when = `<span class="weak" style="font-size:12px">${s.restart ? 'next start' : 'applies at once'}</span>`;
  const def = esc(show(s.def) || 'none');
  // B5: a changed value says so in words and shows the default; the (?) always carries the default.
  const changed = v !== s.def && variant === 'B5' ? `<span class="chg">changed</span> <span class="weak" style="font-size:12px">default: ${def}</span>` : '';
  const reset = v !== s.def && !disabled ? `<button class="small" data-act="reset" data-key="${k}" title="Back to ${def}">Reset</button>` : '';
  return `<div class="set">${c}${help((s.desc ? s.desc + '\n' : '') + (variant === 'B5' ? 'Default: ' + def : ''))}${changed}${p || when}${reset}</div>`;
}
function settingsBlock(pid, moduleId, disabled, offNote){
  const list = settingsOf(pid, moduleId);
  if (!list.length) return '';
  return `<div class="setbox">${disabled && offNote ? `<div class="weak" style="font-size:12px">${offNote}</div>` : ''}${list.map(s => control(pid, s, disabled)).join('')}</div>`;
}
const openKey = key => CTX + ':' + key;
function expander(key, count){
  if (!count) return '';
  return `<button class="expander" data-act="toggle" data-key="${esc(openKey(key))}">${ui.open.has(openKey(key)) ? '&#9662;' : '&#9656;'} Settings (${count})</button>`;
}
const offNoteFor = it => !pluginOn(toml, it.plugin) ? 'Its plugin is off; these settings are kept.' : `${esc(it.name)} is off; its settings are kept and apply when you turn it on.`;

// ---- Variant 0: Anvil 1.22 as it is today -------------------------------------------------
// Manager, Plugins tab (manager_app.cpp: draw_plugins_tab, draw_modules, module_summary).
function todaySummary(it){
  const label = `${it.name} (${it.key})`;
  if (!it.gameplay) return `${label}: does not change the game.`;
  if (it.ironman && it.mp) return `${label}: changes the game; you can allow it in ironman and multiplayer.`;
  if (it.ironman) return `${label}: changes the game; you can allow it in ironman, not in multiplayer.`;
  if (it.mp) return `${label}: changes the game; you can allow it in multiplayer, not in ironman.`;
  return `${label}: changes the game; suspended in ironman and multiplayer.`;
}
function todayOptIns(it){
  let h = '';
  if (it.ironman) h += cb('Allow in ironman', allowed(toml, it, 'ironman'), 'allow', it.key, {mode:'ironman'}) + ' ';
  if (it.mp) h += cb('Allow in multiplayer', allowed(toml, it, 'mp'), 'allow', it.key, {mode:'mp'});
  return h;
}
function variant0(){
  let h = `<table class="im"><tr><th style="width:30px"></th><th style="width:22%">Plugin</th><th style="width:70px">Version</th><th>Status</th><th style="width:150px"></th></tr>`;
  for (const p of PLUGINS){
    const pi = item(p.id), on = pluginOn(toml, p);
    let status = on ? '<div class="good">loads</div>' : '<div class="weak">disabled</div>';
    if (p.gameplay) status += '<div class="weak">Changes the game: kept out of ironman and multiplayer unless allowed.</div>' + `<div>${todayOptIns(pi)}</div>`;
    for (const it of items().filter(i => i.mod && i.plugin === p)){
      const mon = isOn(toml, it);
      status += `<div style="display:flex;gap:6px;align-items:flex-start;margin-top:3px">${cb('', mon, 'on', it.key)}<span>${esc(todaySummary(it))}</span></div>`;
      if (mon && it.gameplay && (it.ironman || it.mp)) status += `<div style="padding-left:24px">${todayOptIns(it)}</div>`;
    }
    h += `<tr><td>${p.standard ? cb('', true, '', '', {disabled:true}) : cb('', on, 'on', p.id)}</td>
      <td><span title="id ${esc(p.id)}">${esc(p.name)}</span>${p.standard ? ' <span class="weak">(comes with Anvil)</span>' : ''}</td>
      <td>${esc(p.version)}</td><td>${status}</td>
      <td style="white-space:nowrap">${SETTINGS[p.id] ? `<button class="small" data-act="opensettings" data-key="${p.id}">Settings</button>` : ''} ${removeBtn(p)}</td></tr>`;
  }

// Manager, Settings tab (draw_settings_tab): a plugin picker, its settings under `group` headers.
function todayGroups(pid, draw){

  const list = [...SETTINGS[pid]].sort((a, b) => (a.group ? 1 : 0) - (b.group ? 1 : 0));
  for (const s of list){
    if (s.group !== group){ group = s.group; if (group) h += `<div class="sep">${esc(group)}</div>`; }
    h += draw(s);

}
function todayManagerSettings(){

// One setting as both apps draw it today: control, (?) help, "(now X; applies at the next start)", Reset.
function todayControl(pid, s){
  const v = getVal(pid, s), k = esc(valKey(pid, s));
  let c;
  if (s.type === 'bool') c = cb(s.label, v, 'set', valKey(pid, s));
  else if (s.type === 'enum') c = `<select data-set="${k}">${s.values.map(([n, l]) => `<option value="${n}" ${n === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select> <span>${esc(s.label)}</span>`;
  else if (s.type === 'key' && inGame()) c = `<button class="small" style="min-width:12em">${esc(v)}</button> <span>${esc(s.label)}</span> <button class="small">Clear</button>`;
  else c = `<input type="${s.type === 'int' ? 'number' : 'text'}" data-set="${k}" value="${esc(v)}"> <span>${esc(s.label)}</span>`;

  const reset = inGame() && v !== s.def ? `<button class="small" data-act="reset" data-key="${k}">Reset</button>` : '';

  if (today()) body = ui.otab === 'settings' ? todayOverlaySettings() : ui.otab === 'status' ? todayOverlayStatus() : '<p class="weak">Not part of this prototype.</p>';
  else body = ui.otab === 'plugins' ? sessionLine() + pendingBar() + VARIANTS[variant][1]() : '<p class="weak">Not part of this prototype.</p>';
  const msg = message ? `<div class="msg"><span class="${message.error ? 'bad' : 'good'}">${esc(message.text)}</span><button class="small" data-act="okmsg">OK</button></div>` : '';
  map.innerHTML = `<div class="owin"><div class="otitle"><span>Anvil</span><span>&times;</span></div>
    <div class="tabs" style="padding:6px 8px 0">${tabs.map(([k, l]) => `<span class="tab ${ui.otab === k ? 'cur' : ''}" ${['status','settings','plugins'].includes(k) ? `data-act="otab" data-key="${k}"` : ''}>${tabLabel(l)}</span>`).join('')}</div>
    <div class="obody">${msg}${body}</div></div>`;
  CTX = 'manager';
}
function tomlText(){
  const lines = ['# anvil/anvil.toml (the switches and opt-ins)'];
  for (const l of LISTS){
    const changed = JSON.stringify([...toml[l]].sort()) !== JSON.stringify([...lastStart[l]].sort());
    const line = `${l} = [${toml[l].map(x => `"${x}"`).join(', ')}]`;
    lines.push(changed ? `<span class="chg">${esc(line)}   # changed since the game started</span>` : esc(line));
  }
  for (const p of PLUGINS){
    const set = (SETTINGS[p.id] || []).filter(s => getVal(p.id, s) !== s.def);
    if (!set.length) continue;
    lines.push('', `# anvil/data/${p.id}/settings.toml (values that differ from the defaults)`);
    for (const s of set){
      const line = `${s.name} = ${JSON.stringify(getVal(p.id, s))}`;
      lines.push(setPending(p.id, s) ? `<span class="chg">${esc(line)}   # waits for the next start</span>` : esc(line));
    }
  }
  return lines.join('\n');
}
function render(){
  // Keep each pane's scroll across a redraw (ImGui keeps it); a new selection starts the detail at the top.
  const panes = ['#variant .list', '#variant .detail', '#map .list', '#map .detail'];
  const kept = panes.map(s => document.querySelector(s)?.scrollTop || 0);
  const sel = [ui.selected, ui.oselected];
  const focus = document.activeElement?.dataset?.search, caret = document.activeElement?.selectionStart;   // the field keeps focus while typing
  manager(); overlay();
  if (focus){ const f = document.querySelector(`[data-search="${focus}"]`); if (f){ f.focus(); f.setSelectionRange(caret, caret); } }
  panes.forEach((s, i) => { const el = document.querySelector(s); if (el) el.scrollTop = s.endsWith('detail') && sel[i >> 1] !== render.lastSel?.[i >> 1] ? 0 : kept[i]; });
  render.lastSel = sel;
  let m = document.getElementById('modal');
  if (!m){ m = document.createElement('div'); m.id = 'modal'; document.body.appendChild(m); }
  m.innerHTML = dialog();
  document.getElementById('toml').innerHTML = tomlText();
  document.getElementById('switcher').innerHTML = `<button data-act="prev" aria-label="Previous variant">&larr;</button>
    <span class="lbl">${variant} (${esc(VARIANTS[variant][0])})</span><button data-act="next" aria-label="Next variant">&rarr;</button>
    <button data-act="skin" style="width:auto;padding:0 12px;font-size:12px" title="Switch between today's colours and the proposed Forge design system">Skin: ${skin === 'forge' ? 'Forge' : 'today'}</button>`;
  document.body.classList.toggle('forge', skin === 'forge');
}

// ---- actions --------------------------------------------------------------------------
function go(step){
  variant = KEYS[(Math.max(0, KEYS.indexOf(variant)) + step + KEYS.length) % KEYS.length];
  useBellows(bellowsDefault(variant));
  useMods(variant === 'B5');
  if (!plug(ui.selected)) ui.selected = 'bellows';
  if (!plug(ui.oselected)) ui.oselected = 'bellows';
  ui.confirm = null;
  const u = new URL(location.href); u.searchParams.set('variant', variant); history.replaceState(null, '', u);
  render();
}
function setSetting(k, v){
  const [pid, name] = k.split('/'), s = SETTINGS[pid].find(x => x.name === name);
  values[k] = v;
  if (running && !s.restart) lastValues[k] = v;   // the game takes a restart = false value at once
  if (running) message = {text: `${s.label}: ${s.restart ? 'saved; applies at the next start' : 'applied'}`, error:false};
}
function act(el){
  const a = el.dataset.act, k = el.dataset.key;
  if (a === 'prev') return go(-1);
  if (a === 'next') return go(1);
  if (a === 'skin'){ skin = skin === 'forge' ? 'today' : 'forge'; const u = new URL(location.href); u.searchParams.set('skin', skin); history.replaceState(null, '', u); return render(); }
  if (a === 'on'){ const it = item(k); setOn(it, !isOn(toml, it)); }
  else if (a === 'allow'){ const it = item(k), m = el.dataset.mode; setAllowed(it, m, !allowed(toml, it, m)); }
  else if (a === 'where'){
    const it = item(k), w = el.dataset.where;
    if (w === 'off') setOn(it, false);
    else { setOn(it, true); if (it.gameplay){ setAllowed(it, 'ironman', w === 'im' || w === 'all'); setAllowed(it, 'mp', w === 'mp' || w === 'all'); } }
  }
  else if (a === 'select'){ const [c, id] = k.split(':'); if (c === 'overlay') ui.oselected = id; else ui.selected = id; }
  else if (a === 'mode'){ const [c, m] = k.split(':'); if (c === 'overlay') ui.omode = m; else ui.mode = m; }
  else if (a === 'bellows') useBellows(k);
  else if (a === 'confirmOk'){ const c = ui.confirm; ui.confirm = null; CTX = c.ctx; confirmed(c); CTX = 'manager'; }
  else if (a === 'confirmCancel') ui.confirm = null;
  else if (a === 'filter'){ const [c, f] = k.split(':'), s = ui.filters[c]; s.has(f) ? s.delete(f) : s.add(f); }
  else if (a === 'clearfind'){ ui.query[k] = ''; ui.filters[k].clear(); }
  else if (a === 'askOn' || a === 'askDeps'){
    CTX = el.closest('#map') ? 'overlay' : 'manager';
    const p = plug(k), chain = offChain(p);
    if (a === 'askDeps' && pluginOn(toml, p)) askOnChain(p, chain); else askOnChain(p, chain.includes(p) ? chain : chain.concat(p));
    CTX = 'manager';
  }
  else if (a === 'askApprove'){
    const p = plug(k), f = p.fromMod, ctx = el.closest('#map') ? 'overlay' : 'manager';
    ui.confirm = {ctx, act:'approve', key:k, ok:'Approve', title:`Approve ${esc(p.name)} ${esc(p.version)}?`,
      body:`<p>From the mod ${esc(f.mod)} (Workshop item ${esc(f.workshop)}), by ${esc(f.authors)}. It is native code: it runs with the same rights as the game.
        Anvil loads exactly the files with the hash <b>${esc(f.hash)}</b>; a change to them waits for a new approval.</p>
        <p class="note">It loads at the next start.${p.modules.some(m => m.gameplay) ? ' Its modules that change the game stay out of ironman and multiplayer unless you allow them.' : ''}</p>`};
  }
  else if (a === 'askRevoke'){
    const p = plug(k);
    ui.confirm = {ctx: el.closest('#map') ? 'overlay' : 'manager', act:'revoke', key:k, ok:'Revoke', title:`Revoke the approval of ${esc(p.name)}?`,
      body:`<p>It stops loading at the next start and waits for approval again. Its modules and settings are kept.</p>`};
  }
  else if (a === 'askReset'){
    const p = plug(k), ctx = el.closest('#map') ? 'overlay' : 'manager';
    CTX = ctx; const ch = changesOf(p); CTX = 'manager';
    const kinds = [...new Set(ch.map(c => c.kind))];
    ui.confirm = {ctx, act:'reset', key:k, ok:`Reset ${ch.length} change(s)`, title:`Reset ${esc(p.name)} to its defaults?`,
      body: kinds.map(kd => `<div style="margin-top:6px">${kd}</div>${listHtml(ch.filter(c => c.kind === kd).map(c => c.text))}`).join('')
        + `<p class="note">The plugin's own switch stays as it is. Settings that apply at once change now${running ? ' in this game' : ''}; the rest at the next start.</p>`};
  }
  else if (a === 'askResetMod'){
    const [pid] = k.split('.'), mid = k.slice(pid.length + 1), p = plug(pid), m = p.modules.find(x => x.id === mid);
    const list = changedSettings(pid, mid);
    ui.confirm = {ctx: el.closest('#map') ? 'overlay' : 'manager', act:'resetmod', key:`${pid}|${mid}`, ok:`Reset ${list.length} setting(s)`,
      title:`Reset the settings of ${esc(m.name)}?`, body: listHtml(list.map(s => `${esc(s.label)}: ${esc(show(getVal(pid, s)) || 'none')} &rarr; ${esc(show(s.def) || 'none')}`))
        + `<p class="note">The module stays on.</p>`};
  }
  else if (a === 'groupcb'){
    const [pid, g] = k.split('|'), its = items().filter(i => i.mod && i.plugin.id === pid && (i.mod.group || '') === g);
    const allOn = its.every(i => isOn(toml, i));
    for (const it of its) setOn(it, !allOn);
  }
  else if (a === 'groupon'){
    const [pid, g] = k.split('|'), on = el.dataset.on === '1';
    for (const it of items().filter(i => i.mod && i.plugin.id === pid && (i.mod.group || '') === g)) setOn(it, on);
  }
  else if (a === 'tab') ui.tab = k;
  else if (a === 'otab') ui.otab = k;
  else if (a === 'opick') ui.osettings = k;
  else if (a === 'opensettings'){ ui.tab = 'settings'; ui.settingsPlugin = k; }
  else if (a === 'toggle'){ ui.open.has(k) ? ui.open.delete(k) : ui.open.add(k); }
  else if (a === 'set'){ const [pid, name] = k.split('/'); setSetting(k, !getVal(pid, SETTINGS[pid].find(x => x.name === name))); }
  else if (a === 'reset'){ const [pid, name] = k.split('/'); setSetting(k, SETTINGS[pid].find(x => x.name === name).def); }
  else if (a === 'disablenext'){ setListed('disabled_plugins', k, true); message = {text:`${k} is disabled from the next start.`, error:false}; }
  else if (a === 'okmsg') message = null;
  else if (a === 'undo'){ toml = JSON.parse(JSON.stringify(lastStart)); values = {...lastValues}; }
  else if (a === 'start'){ lastStart = JSON.parse(JSON.stringify(toml)); lastValues = {...values}; running = true; message = null; }
  else if (a === 'quit'){ running = false; message = null; }
  else return;
  render();
}
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && !el.disabled) act(el); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'session'){
    SESSION = {ironman: t.value === 'im' || t.value === 'immp', mp: t.value === 'mp' || t.value === 'immp'};
    ui.omode = SESSION.ironman ? 'ironman' : SESSION.mp ? 'mp' : 'normal';
    return render();
  }
  if (t.dataset.pick === 'manager'){ ui.settingsPlugin = t.value; return render(); }
  if (t.dataset.set){
    const [pid, name] = t.dataset.set.split('/'), s = SETTINGS[pid].find(x => x.name === name);
    setSetting(t.dataset.set, s.type === 'int' ? Number(t.value) : t.value);
    render();
  }
});
// B5: the search field filters as the player types; Esc clears it; Ctrl+F finds it in the Manager.
document.addEventListener('input', e => {
  const c = e.target.dataset && e.target.dataset.search;
  if (c){ ui.query[c] = e.target.value; render(); }
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.dataset && t.dataset.search && e.key === 'Escape'){ ui.query[t.dataset.search] = ''; render(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f' && variant === 'B5'){
    const f = document.querySelector('[data-search="manager"]'); if (f){ e.preventDefault(); f.focus(); f.select(); return; }
  }
  if (t.matches && t.matches('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === 'ArrowRight') go(1);
  else if ((e.key === ' ' || e.key === 'Enter') && t.dataset && t.dataset.act){ e.preventDefault(); act(t); }
});
render();
</script>
</body>
</html>
