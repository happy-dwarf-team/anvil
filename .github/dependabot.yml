version: 2
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot moves the pins.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  # The benchmark receiver's npm packages; not shipped in an Anvil release.
  - package-ecosystem: npm
    directory: /services/bench-receiver
    schedule:
      interval: monthly
    groups:
      bench-receiver:
        patterns: ["*"]
    commit-message:
      prefix: chore
