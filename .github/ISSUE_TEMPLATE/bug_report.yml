name: Bug report
description: Anvil crashes, does not load a plugin, or the game behaves differently with Anvil installed.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Problems inside one plugin belong in that plugin's repository; security problems go through [private reporting](https://github.com/happy-dwarf-team/anvil/security/advisories/new).
        Before reporting, check whether the problem also happens with `enabled = false` in `anvil/anvil.toml` (Anvil loaded, no plugins; the `ANVIL_DISABLE=1` environment variable does the same for one start).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Install Anvil 0.2.0 and plugin X
        2. Start the game through Steam
        3. ...
    validations:
      required: true
  - type: input
    id: anvil-version
    attributes:
      label: Anvil version
      description: First line of `anvil/anvil.log`, e.g. `Anvil 0.2.0 (plugin API 1)`.
    validations:
      required: true
  - type: input
    id: game-build
    attributes:
      label: Game build
      description: The `game build:` line of `anvil/anvil.log`, and the game version shown in the launcher.
    validations:
      required: true
  - type: dropdown
    id: launch
    attributes:
      label: How the game was started
      options:
        - Steam
        - Paradox launcher
        - eu4.exe directly
        - Other (describe above)
    validations:
      required: true
  - type: textarea
    id: plugins
    attributes:
      label: Installed plugins and mods
      description: Folders in `anvil/plugins/` with their versions, and the enabled mods (or "none").
    validations:
      required: true
  - type: dropdown
    id: without-plugins
    attributes:
      label: Does it also happen without plugins?
      options:
        - "Yes, also with enabled = false (or ANVIL_DISABLE=1)"
        - "No, only with plugins"
        - Not tested
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: anvil/anvil.log
      description: The whole file from the start where the problem happened (`anvil.prev.log` holds the start before). Check it for anything you do not want to share, such as your Windows user name in paths.
      render: text
    validations:
      required: true
