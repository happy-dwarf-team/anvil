name: release

# release-please keeps a "chore: release x.y.z" pull request up to date from the
# Conventional Commits on main (version.txt + CHANGELOG.md). Merging it tags
# vX.Y.Z and creates a DRAFT GitHub release; the jobs below then build that
# commit, attach the package, AnvilManager.exe and the SDK archive to the draft
# and publish it, so the release is never public without its files.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # With the default token the release PR does not trigger CI (GitHub does not
      # start workflows from GITHUB_TOKEN events). A RELEASE_PLEASE_TOKEN secret
      # (fine-grained token or GitHub App token) makes the checks run on it.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  publish:
    needs: [release-please, build]
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: anvil-${{ github.sha }}
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: anvil-sdk-${{ github.sha }}
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: anvil-manager-${{ github.sha }}
          path: dist

      - name: Prepare release assets
        working-directory: dist
        run: |
          mv "anvil-${GITHUB_SHA}.zip" anvil-windows-x64.zip
          mv "anvil-sdk-windows-x64-${GITHUB_SHA}.zip" anvil-sdk-windows-x64.zip
          sha256sum anvil-windows-x64.zip AnvilManager.exe anvil-sdk-windows-x64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Signed build provenance: `gh attestation verify anvil-windows-x64.zip -R happy-dwarf-team/anvil`
      # (and the same for AnvilManager.exe and anvil-sdk-windows-x64.zip).
      # GitHub offers attestations to public repositories on every plan.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/anvil-windows-x64.zip
            dist/AnvilManager.exe
            dist/anvil-sdk-windows-x64.zip

      # gh finds a draft release by its tag too (contents: write can see drafts).
      - name: Upload release assets
        working-directory: dist
        run: gh release upload "$TAG" anvil-windows-x64.zip AnvilManager.exe anvil-sdk-windows-x64.zip SHA256SUMS.txt --clobber

      - name: Publish the release
        run: gh release edit "$TAG" --draft=false --latest

  # anvil-sys goes to crates.io once the package is built (the tests have passed).
  # Without a CARGO_REGISTRY_TOKEN secret the job only warns: add the secret (a
  # crates.io token with publish-new and publish-update for anvil-sys) and
  # publish the missing release by hand (`cargo publish -p anvil-sys` at the tag).
  publish-crate:
    needs: [release-please, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish anvil-sys to crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: |
          rustup toolchain install 1.99.1 --profile minimal --no-self-update
          rustup default 1.99.1
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "anvil-sys") | .version')"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::anvil-sys is ${version} but the release is ${TAG}"
            exit 1
          fi
          cargo publish -p anvil-sys

      - name: Skip crates.io (no CARGO_REGISTRY_TOKEN)
        if: env.CARGO_REGISTRY_TOKEN == ''
        run: echo "::warning::CARGO_REGISTRY_TOKEN is not set; anvil-sys ${TAG} was not published to crates.io"

  notify-website:
    needs: [release-please, publish]
    runs-on: ubuntu-24.04
    permissions: {}
    env:
      DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
    steps:
      - name: Trigger website rebuild
        if: env.DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.DISPATCH_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh api repos/happy-dwarf-team/anvil-website/dispatches \
            -f event_type=anvil-release \
            -f "client_payload[tag]=${TAG}"

      - name: Skip website rebuild (no WEBSITE_DISPATCH_TOKEN)
        if: env.DISPATCH_TOKEN == ''
        run: echo "::notice::WEBSITE_DISPATCH_TOKEN is not set; website rebuild not triggered"
