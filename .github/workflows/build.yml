name: build

on:
  push:
    branches: [main]
  pull_request:
  # Called by release.yml to build the package of a new release.
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # Microbenchmarks (design §17): three runs, gated on each case's ratio to a
      # plain call against bench/baseline-ci.json for this runner's CPU model.
      - name: Benchmark
        shell: pwsh
        run: |
          foreach ($i in 1, 2, 3) {
            build/Release/anvil_bench.exe --out "bench-$i.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          bench/check-regression.ps1 -Result bench-1.json, bench-2.json, bench-3.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: anvil-bench-${{ github.sha }}
          path: bench-*.json
          if-no-files-found: ignore

      - name: Package
        shell: pwsh
        run: |
          cmake --install build --config Release --component anvil --prefix dist/anvil-package
          Copy-Item build/Release/hello.dll -Destination dist/anvil-package/anvil/docs/example-hello.dll
          Copy-Item examples/hello/plugin.toml -Destination dist/anvil-package/anvil/docs/example-hello-plugin.toml
          $files = Get-ChildItem dist/anvil-package -Recurse -File
          $files | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath('dist/anvil-package', $_.FullName).Replace('\', '/')
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $relative
          } | Set-Content dist/anvil-package/SHA256SUMS.txt
          Compress-Archive -Path dist/anvil-package/* -DestinationPath dist/anvil-${{ github.sha }}.zip

      # Per-commit artifact; for a release, release.yml attaches it to the GitHub release.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anvil-${{ github.sha }}
          path: dist/anvil-${{ github.sha }}.zip
