name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          cmake --install build --config Release --component anvil --prefix dist/anvil-package
          Copy-Item build/Release/hello.dll -Destination dist/anvil-package/anvil/docs/example-hello.dll
          Copy-Item examples/hello/plugin.toml -Destination dist/anvil-package/anvil/docs/example-hello-plugin.toml
          $files = Get-ChildItem dist/anvil-package -Recurse -File
          $files | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath('dist/anvil-package', $_.FullName).Replace('\', '/')
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $relative
          } | Set-Content dist/anvil-package/SHA256SUMS.txt
          Compress-Archive -Path dist/anvil-package/* -DestinationPath dist/anvil-${{ github.sha }}.zip

      # Per-commit artifact; on tag builds it also hands the zip to the release job.
      - uses: actions/upload-artifact@v4
        with:
          name: anvil-${{ github.sha }}
          path: dist/anvil-${{ github.sha }}.zip

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: version.txt
          sparse-checkout-cone-mode: false

      # The tag must match version.txt, which is baked into version.dll.
      - name: Check tag matches version.txt
        run: |
          version=$(head -n 1 version.txt | tr -d '\r')
          base=${TAG#v}
          base=${base%%-*}
          if [ -z "$version" ] || [ "$base" != "$version" ]; then
            echo "::error::Tag $TAG does not match version.txt ($version)"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: anvil-${{ github.sha }}
          path: dist

      - name: Prepare release assets
        working-directory: dist
        run: |
          mv "anvil-${GITHUB_SHA}.zip" anvil-windows-x64.zip
          sha256sum anvil-windows-x64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Tags with a suffix (v0.2.0-rc.1) become prereleases, so releases/latest skips them.
      - name: Create or update release
        working-directory: dist
        run: |
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" anvil-windows-x64.zip SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" anvil-windows-x64.zip SHA256SUMS.txt \
              --verify-tag --title "Anvil $TAG" --generate-notes "${flags[@]}"
          fi

  notify-website:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: release
    runs-on: ubuntu-24.04
    permissions: {}
    env:
      DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
    steps:
      - name: Trigger website rebuild
        if: env.DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.DISPATCH_TOKEN }}
        run: |
          gh api repos/happy-dwarf-team/anvil-website/dispatches \
            -f event_type=anvil-release \
            -f "client_payload[tag]=${GITHUB_REF_NAME}"

      - name: Skip website rebuild (no WEBSITE_DISPATCH_TOKEN)
        if: env.DISPATCH_TOKEN == ''
        run: echo "::notice::WEBSITE_DISPATCH_TOKEN is not set; website rebuild not triggered"
