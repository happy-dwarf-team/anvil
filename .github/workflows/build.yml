name: build

on:
  push:
    branches: [main]
  pull_request:
  # Called by release.yml to build the package of a new release.
  workflow_call:
    inputs:
      ref:
        description: The commit or tag to build; empty builds the commit that started the run
        type: string
        default: ''

# A new push to a pull request cancels its older runs of this workflow. Other
# runs (main, the weekly scan, a release's build) get a group of their own and
# are never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Ninja with sccache in front of cl: a run compiles only the sources whose
      # inputs changed since the cached run. The MSVC environment (cl, link, rc on
      # PATH, INCLUDE, LIB) comes from vcvars64.bat, as a Developer prompt has it,
      # saved to msvc.env and loaded only by the steps that run cl: for the whole
      # job it would also make rustc in a bash step link with Git's link.exe.
      - name: sccache
        shell: pwsh
        env:
          SCCACHE_VERSION: v0.19.0
          SCCACHE_SHA256: 28be8c61f6b2c89b9eb2869f6af7f78e6f992e78a8abae0ce855fcc129cbeac1
        run: |
          $name = "sccache-$env:SCCACHE_VERSION-x86_64-pc-windows-msvc"
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest "https://github.com/mozilla/sccache/releases/download/$env:SCCACHE_VERSION/$name.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $env:SCCACHE_SHA256) { throw "$name.zip: SHA-256 mismatch" }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP $name | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          "SCCACHE_DIR=$(Join-Path $env:RUNNER_TEMP sccache)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "SCCACHE_CACHE_SIZE=1G" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: MSVC environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          # Only what vcvars64.bat adds or changes, not the runner's own GITHUB_* and the rest.
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            $name, $value = $_ -split '=', 2
            if ($name -and $null -ne $value -and [Environment]::GetEnvironmentVariable($name) -ne $value) { "$name=$value" }
          } | Out-File (Join-Path $env:RUNNER_TEMP msvc.env) -Encoding utf8

      # A release build (release.yml passes a ref) neither reads nor writes the
      # cache: its package is compiled from the sources alone.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ inputs.ref == '' }}
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: sccache-${{ runner.os }}-

      # The sources FetchContent downloads and their sub-builds, keyed on the CMake
      # files that pin them: Configure then skips the clones and downloads.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ inputs.ref == '' }}
        with:
          path: |
            build/_deps/*-src
            build/_deps/*-subbuild
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}

      - name: Configure
        shell: pwsh
        run: |
          Get-Content (Join-Path $env:RUNNER_TEMP msvc.env) |
            ForEach-Object { $name, $value = $_ -split '=', 2; Set-Item "env:$name" $value }
          cmake -S . -B build -G "Ninja Multi-Config" `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        shell: pwsh
        run: |
          Get-Content (Join-Path $env:RUNNER_TEMP msvc.env) |
            ForEach-Object { $name, $value = $_ -split '=', 2; Set-Item "env:$name" $value }
          cmake --build build --config Release
          sccache --show-stats

      # The plugin catalog (ADR 0002): every pinned zip has the size and SHA-256
      # of its entry, the build provenance of its plugin's repository and the
      # manifest the entry describes. The Manager trusts only these pins.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I catalog/update.py --check

      # Rust (design §9): the bindings match the headers, anvil gen's Rust output
      # compiles, both crates package, and the Rust examples build and load in the
      # tests below.
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt --no-self-update
          rustup default 1.99.1
          rustup target add x86_64-pc-windows-msvc
          cargo --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: bindgen
        with:
          path: ~/.cargo/bin/bindgen.exe
          key: bindgen-0.73.2-${{ runner.os }}

      - name: Install bindgen
        if: steps.bindgen.outputs.cache-hit != 'true'
        shell: bash
        run: cargo install bindgen-cli --version 0.73.2 --locked

      - name: Rust bindings match the header
        shell: pwsh
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: |
          sdk/rust/regen-bindings.ps1 -Check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: anvil-sys-bindings
          path: bindings.generated.rs
          if-no-files-found: ignore

      - name: Rust checks
        shell: bash
        env:
          ANVIL: ${{ github.workspace }}\build\Release\anvil.exe
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          RUSTDOCFLAGS='-D warnings' cargo doc -p anvil-sdk --no-deps
          cargo build -p hello-rust -p panel-rust --release --target x86_64-pc-windows-msvc
          # anvil-sdk is verified against this anvil-sys, not the published one.
          cargo publish -p anvil-sys -p anvil-sdk --dry-run
          mkdir -p build/plugin/hello-rust build/plugin/panel-rust
          cp target/x86_64-pc-windows-msvc/release/hello_rust.dll examples/hello-rust/plugin.toml examples/hello-rust/symbols.toml build/plugin/hello-rust/
          cp target/x86_64-pc-windows-msvc/release/panel_rust.dll examples/panel-rust/plugin.toml build/plugin/panel-rust/

      - name: Test
        env:
          ANVIL_REQUIRE_RUST_EXAMPLES: '1'
        shell: pwsh
        run: |
          Get-Content (Join-Path $env:RUNNER_TEMP msvc.env) |
            ForEach-Object { $name, $value = $_ -split '=', 2; Set-Item "env:$name" $value }
          ctest --test-dir build -C Release --output-on-failure

      # Microbenchmarks (design §17): three runs, gated on each case's ratio to a
      # plain call against bench/baseline-ci.json for this runner's CPU model.
      - name: Benchmark
        shell: pwsh
        run: |
          foreach ($i in 1, 2, 3) {
            build/Release/anvil_bench.exe --out "bench-$i.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          bench/check-regression.ps1 -Result bench-1.json, bench-2.json, bench-3.json

      # Memory budgets (design §17): run so the tool keeps working, not gated;
      # the bytes depend on the Windows build, and the lab checks the budgets.
      - name: Memory
        shell: pwsh
        run: |
          build/Release/anvil_bench.exe --memory --out bench-memory.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: anvil-bench-${{ github.sha }}
          path: bench-*.json
          if-no-files-found: ignore

      - name: Package
        shell: pwsh
        run: |
          cmake --install build --config Release --component anvil --prefix dist/anvil-package
          # AnvilManager.exe next to version.dll (design §3); it is also an asset of its own.
          cmake --install build --config Release --component manager --prefix dist/anvil-package
          cmake --install build --config Release --component manager --prefix dist/anvil-manager
          # The examples, laid out as plugin folders (not installed: docs only).
          New-Item -ItemType Directory -Force dist/anvil-package/anvil/docs/examples | Out-Null
          foreach ($example in 'hello-c', 'hello-cpp', 'hello-rust', 'panel-rust', 'player-cores', 'hello-script') {
            Copy-Item build/plugin/$example -Destination dist/anvil-package/anvil/docs/examples/$example -Recurse
          }
          $files = Get-ChildItem dist/anvil-package -Recurse -File
          $files | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath('dist/anvil-package', $_.FullName).Replace('\', '/')
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $relative
          } | Set-Content dist/anvil-package/SHA256SUMS.txt
          Compress-Archive -Path dist/anvil-package/* -DestinationPath dist/anvil-${{ github.sha }}.zip

      # Per-commit artifact; for a release, release.yml attaches it to the GitHub release.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anvil-${{ github.sha }}
          path: dist/anvil-${{ github.sha }}.zip

      # AnvilManager.exe on its own: the player's download (design §15). It carries
      # the package above (--check-package reads it back; ctest ran it too).
      - name: Check the Manager
        shell: pwsh
        run: |
          $manager = Start-Process dist/anvil-manager/AnvilManager.exe -ArgumentList '--check-package' -Wait -PassThru
          if ($manager.ExitCode -ne 0) { throw "AnvilManager.exe --check-package failed ($($manager.ExitCode))" }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anvil-manager-${{ github.sha }}
          path: dist/anvil-manager/AnvilManager.exe

      # SDK archive for plugin authors (design §16): headers, anvil.exe and the
      # AnvilPlugin CMake package. Built from the same build as the package above.
      - name: Package SDK
        shell: pwsh
        run: |
          cmake --install build --config Release --component sdk --prefix dist/anvil-sdk
          $files = Get-ChildItem dist/anvil-sdk -Recurse -File
          $files | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath('dist/anvil-sdk', $_.FullName).Replace('\', '/')
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $relative
          } | Set-Content dist/anvil-sdk/SHA256SUMS.txt
          Compress-Archive -Path dist/anvil-sdk/* -DestinationPath dist/anvil-sdk-windows-x64-${{ github.sha }}.zip

      # What a plugin repository does with the archive: FetchContent of it, or
      # find_package on the unpacked copy; build, check and deploy the examples.
      - name: Verify SDK
        shell: pwsh
        run: tests/sdk/verify-sdk.ps1 -Archive dist/anvil-sdk-windows-x64-${{ github.sha }}.zip -Work sdk-verify

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anvil-sdk-${{ github.sha }}
          path: dist/anvil-sdk-windows-x64-${{ github.sha }}.zip
