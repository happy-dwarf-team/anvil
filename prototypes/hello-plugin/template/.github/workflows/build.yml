# What the template's CI would do. The game binary cannot be redistributed,
# so CI runs `anvil check` without it; authors run it with --exe locally.
name: build
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - run: cmake --build build --config Release
      - run: cmake --build build --config Release --target hello-check
      - uses: actions/upload-artifact@v4
        with: { name: hello, path: build/plugin }
