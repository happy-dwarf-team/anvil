# The Rust side of the tree: anvil-sys (the C ABI) and anvil-sdk (the safe
# crate), both published to crates.io, and the Rust example plugins. The C++
# core builds with CMake (CMakeLists.txt).
[workspace]
resolver = "2"
members = [
    "sdk/rust/anvil-sys",
    "sdk/rust/anvil-sdk",
    "examples/hello-rust",
    "examples/panel-rust",
    "tests/rust/gen-compile",
]

[workspace.package]
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/happy-dwarf-team/anvil"
